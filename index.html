  function handleCardDetail(id) {
    var state = currentState;
    var entry = (state.entries || []).find(function (e) { return e.id === id; });
    if (!entry) return;
    var idx = (state.entries || []).indexOf(entry);
    var overlay = openModal(
      '<button type="button" class="card-close" id="card-detail-close" aria-label="닫기">&times;</button>' +
      '<div class="card-scroll">' + cardHtml(entry, idx + 1, state, true) + '</div>'
    );
    overlay.classList.add('card-detail-modal');
    /* 관리자: 알람 설정 여부를 pushTokens에서 조회해 채움 */
    if (isAdminUnlocked) fillNotifStatus(entry.id);
    var closeActions = ['edit', 'delete', 'admin-manage', 'request-photo', 'request-contact', 'detail'];
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) { closeModal(overlay); return; }
      if (e.target.closest('#card-detail-close')) { closeModal(overlay); return; }
      var btn = e.target.closest('[data-action]');
      if (btn && closeActions.indexOf(btn.getAttribute('data-action')) >= 0) closeModal(overlay);
    });
  }

  /* 회원 상세 팝업의 "알람 설정" 값을 pushTokens/{id} 문서에서 조회해 채움 (관리자용) */
  function fillNotifStatus(id) {
    var el = document.getElementById('detail-notif-' + id);
    if (!el) return;
    pushTokensRef.doc(id).get().then(function (doc) {
      var el2 = document.getElementById('detail-notif-' + id);
      if (!el2) return;
      var n = 0;
      if (doc.exists) {
        var t = doc.data().tokens;
        n = Array.isArray(t) ? t.length : (t && typeof t === 'object' ? Object.keys(t).length : 0);
      }
      el2.innerHTML = n > 0
        ? '<b style="color:var(--accent);">켜짐</b> <span style="color:var(--muted);">· ' + n + '개 기기</span>'
        : '<span style="color:var(--muted);">꺼짐</span>';
    }).catch(function () {
      var el3 = document.getElementById('detail-notif-' + id);
      if (el3) el3.innerHTML = '<span style="color:var(--muted);">확인 불가</span>';
    });
  }

  /* 신청 탭 상단 역할 토글 (성별 토글과 같은 디자인).
     주선자 로그인: [🧑‍💼 주선자][🤝 친구][🤝 추가(친구 1명+일 때)]

  function roleToggleHtml() {
    var authE = currentUser ? myAuthEntry(currentState) : null;
    if (isMatchmakerEntry(authE)) {
      var friends = entriesManagedByMe(currentState).filter(function (e) { return !e.ownerSelf; });
      var editingFriend = editingEntryId && friends.some(function (f) { return f.id === editingEntryId; });
      var selfActive = (formRole === 'self') && !editingFriend;
      return '<div class="role-toggle">' +
        '<button type="button" class="role-btn' + (selfActive ? ' active' : '') + '" data-role="self">🙋 본인</button>' +
        '<button type="button" class="role-btn' + (!selfActive ? ' active' : '') + '" data-role="friend">🤝 친구</button>' +
      '</div>';
    }
    var self = (formRole === 'self');
    return '<div class="role-toggle">' +
      '<button type="button" class="role-btn' + (self ? ' active' : '') + '" data-role="self">🙋 본인</button>' +
      '<button type="button" class="role-btn' + (!self ? ' active' : '') + '" data-role="matchmaker">🤝 주선자</button>' +
    '</div>';
  }

    var pend = (state.pendingEntries || []).filter(function (e) { return e.managedBy === currentUser.id && !e.ownerSelf; });

      return '<div class="pending-item">' +
        '<div class="p-name">🤝 ' + escapeHtml(f.nickname) + (isPend ? ' <span class="chip" style="background:var(--gold-soft);color:var(--gold);">승인 대기</span>' : '') + '</div>' +
        '<div class="p-meta">' + genderLabel(f.gender) + ' · ' + escapeHtml(f.region || '') + '</div>' +
        '<div class="pending-actions">' +
          '<button type="button" class="card-btn" data-action="edit" data-id="' + escapeHtml(f.id) + '">✏️ 수정</button>' +
        '</div>' +
      '</div>';

      '<div class="form-lede"><h2>🤝 친구 관리</h2><p>등록한 친구를 수정하거나, 새 친구를 추가하세요.</p></div>' +

  function handleMatchmakerSubmit() {
    var state = currentState;
    if (!state.adminAuth) { modalNotice('안내', '관리자가 아직 PIN을 설정하지 않았어요.'); return; }
    var form = document.getElementById('entry-form');
    var nickname = (form.querySelector('[name="nickname"]').value || '').trim();
    var realName = (form.querySelector('[name="realName"]').value || '').trim();
    var contact = (form.querySelector('[name="contact"]').value || '').trim();
    var pin = (form.querySelector('[name="pin"]').value || '').trim();
    var referrerText = (form.querySelector('[name="referrerText"]').value || '').trim();
    var missing = [];
    if (!nickname) missing.push('닉네임');
    if (!realName) missing.push('본인 이름');
    if (!contact) missing.push('전화번호');
    if (!referrerText) missing.push('알게 된 경로');
    if (!pin) missing.push('개인 PIN');
    if (missing.length) return modalNotice('입력 오류', '다음을 채워주세요: ' + missing.join(', '));
    if (pin.length < 4) return modalNotice('입력 오류', 'PIN은 4자리 이상이어야 해요.');
    if (!/^01[0-9]{8,9}$/.test(contact)) return modalNotice('입력 오류', '전화번호는 01012345678 형식으로 입력해주세요.');
    var consent = document.getElementById('f-consent');
    if (!consent || !consent.checked) return modalNotice('동의 필요', '개인정보 수집 및 이용에 동의해 주세요.');
    var nickLower = nickname.toLowerCase();
    var dup = (state.entries || []).concat(state.pendingEntries || []).some(function (e) { return (e.nickname || '').trim().toLowerCase() === nickLower; });
    if (dup) return modalNotice('닉네임 중복', '이미 사용 중인 닉네임이에요.');
    var btn = document.getElementById('submit-btn'), msg = document.getElementById('status-msg');
    if (btn) btn.disabled = true;
    if (msg) { msg.textContent = '제출 중...'; msg.className = 'status-msg'; }
    var pubJwk = state.adminAuth.publicKeyJwk;
    var entryId = genId();
    Promise.all([
      encryptForAdmin(pubJwk, contact),
      makePinAuth(pin),
      encryptForSelf(pin, contact),
      encryptForAdmin(pubJwk, realName),
      encryptForAdmin(pubJwk, referrerText)
    ]).then(function (r) {
      var entry = {
        id: entryId, nickname: nickname, isMatchmaker: true,
        contactEnc: r[0], pinAuth: r[1], contactSelfEnc: r[2], realNameEnc: r[3], referrerEnc: r[4],
        submittedAt: new Date().toISOString()
      };
      return stateRef.update({ pendingEntries: firebase.firestore.FieldValue.arrayUnion(entry) });
    }).then(function () {
      currentUser = { id: entryId, nickname: nickname, pin: pin };
      actingAs = null; actingResolved = false;
      saveSession();
      formRole = 'matchmaker';
      appendLog('signup', nickname, '주선자 등록 신청');
      notifyAdmin('새 주선자 📝', nickname + '님이 주선자 등록을 신청했어요 (승인 대기).');
      modalNotice('접수 완료 🤝', '주선자 등록을 신청했어요! 관리자 승인 후, 신청 탭에서 친구를 대신 소개할 수 있어요.');
      activeTab = 'mine';
      paint(currentState);
    }).catch(function (err) {
      if (btn) btn.disabled = false;
      if (msg) { msg.textContent = '오류: ' + (err.message || err); msg.className = 'status-msg error'; }
    });
  }

  function handleMatchmakerEditSubmit(entry) {
    var state = currentState;
    var form = document.getElementById('entry-form');
    if (!form) return;
    var nickname = (form.querySelector('[name="nickname"]').value || '').trim();
    var realName = (form.querySelector('[name="realName"]').value || '').trim();
    var contact = (form.querySelector('[name="contact"]').value || '').trim();
    var referrerText = (form.querySelector('[name="referrerText"]').value || '').trim();
    if (!nickname) return modalNotice('입력 오류', '닉네임을 입력해주세요.');
    if (contact && !/^01[0-9]{8,9}$/.test(contact)) return modalNotice('입력 오류', '전화번호는 01012345678 형식으로 입력해주세요.');
    var nickLower = nickname.toLowerCase();
    var exempt = nickExemptIds(state);
    var dup = (state.entries || []).concat(state.pendingEntries || []).some(function (e) {
      return e.id !== entry.id && exempt.indexOf(e.id) < 0 && (e.nickname || '').trim().toLowerCase() === nickLower;
    });
    if (dup) return modalNotice('닉네임 중복', '이미 사용 중인 닉네임이에요.');
    var pubJwk = state.adminAuth && state.adminAuth.publicKeyJwk;
    if (!pubJwk) return modalNotice('오류', '관리자 설정을 찾을 수 없어요.');
    var btn = document.getElementById('submit-btn'), msg = document.getElementById('status-msg');
    if (btn) btn.disabled = true;
    if (msg) { msg.textContent = '수정 중...'; msg.className = 'status-msg'; }
    var selfPin = (currentUser && currentUser.id === entry.id) ? currentUser.pin : null;
    Promise.all([
      realName ? encryptForAdmin(pubJwk, realName) : Promise.resolve(null),
      contact ? encryptForAdmin(pubJwk, contact) : Promise.resolve(null),
      (contact && selfPin) ? encryptForSelf(selfPin, contact) : Promise.resolve(null),
      referrerText ? encryptForAdmin(pubJwk, referrerText) : Promise.resolve(null)
    ]).then(function (r) {
      return db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var upd = function (list) {
            return (list || []).map(function (e) {
              if (e.id !== entry.id) return e;
              var u = JSON.parse(JSON.stringify(e));
              u.nickname = nickname;
              if (r[0]) u.realNameEnc = r[0];
              if (r[1]) u.contactEnc = r[1];
              if (r[2]) u.contactSelfEnc = r[2];
              if (r[3]) u.referrerEnc = r[3];
              return u;
            });
          };
          var patch = { entries: upd(s.entries) };
          if ((s.pendingEntries || []).some(function (e) { return e.id === entry.id; })) patch.pendingEntries = upd(s.pendingEntries);
          tx.update(stateRef, patch);
        });
      });
    }).then(function () {
      if (currentUser && currentUser.id === entry.id) { currentUser.nickname = nickname; saveSession(); }
      appendLog('edit', nickname, '주선자 정보 수정');
      editingEntryId = null;
      activeTab = 'mine';
      modalNotice('완료', '주선자 정보를 수정했어요.');
      return refreshNow();
    }).catch(function (err) {
      if (btn) btn.disabled = false;
      if (msg) { msg.textContent = '오류: ' + (err.message || err); msg.className = 'status-msg error'; }
    });
  }

  function fmtDate(iso) {

    try {
      var d = new Date(iso);
      var p = function (n) { return String(n).padStart(2, '0'); };
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) { return '-'; }
  }

      actions =

    var chatBtn = '';

      var meNow = findMyEntry(state);

  function handleRevokePhotoViewer(otherId) {

      if (!ok) return;

  /* 연결 회수: 나와 상대 사이 사진·대화 권한을 한 번에 해제 */

        : '<button type="button" class="card-btn" data-action="sub-pin-issue" data-id="' + escapeHtml(me.id) + '" style="flex:none;">🔑 1일 PIN 발급</button>';
      headBtns = '<button type="button" class="card-btn primary" data-action="card-detail" data-id="' + escapeHtml(me.id) + '" style="flex:none;">👤 내 프로필 보기</button>' +
        '<div style="flex-basis:100%;height:0;"></div>' + /* 줄바꿈: 아래 줄에 일반 계정 전환(왼쪽) · 1일 PIN(오른쪽) */
        '<button type="button" class="card-btn" data-action="sub-detach" data-id="' + escapeHtml(me.id) + '" style="flex:none;">🪪 일반 계정 전환</button>' +
        pinBtn;
    } else if (isSubProfile) {
      /* 친구(sub)가 임시 PIN으로 직접 로그인한 경우: 프로필 수정 + 만료 시각 표시 */
      headBtns = '<button type="button" class="card-btn primary" data-action="card-detail" data-id="' + escapeHtml(me.id) + '" style="flex:none;">👤 내 프로필 보기</button>';
      if (me.pinAuth && !subPinExpired(me)) {
        headBtns += '<span class="chip" style="background:#e6f4ea;color:#137333;align-self:center;">🔑 임시 로그인 ' + escapeHtml(subPinUntilText(me)) + ' (' + escapeHtml(subPinRemainText(me)) + ')</span>';
      }
    } else if (!isSubProfile) {
      /* 일반/주선자 본인 계정: 주선자 요청(내가 관리하는 사람이 없을 때만) + 친구 대신 소개 */
      var iManage = entriesManagedByMe(state).length > 0;
      var amMM = isMatchmakerEntry(myAuthEntry(state));
      var myJoinReq = (state.joinRequests || []).find(function (j) { return j.fromId === me.id; });
      var reqBtn = (amMM || iManage) ? ''
        : (myJoinReq
            ? '<button type="button" class="card-btn" id="cancel-mm-req" style="flex:none;">⏳ 주선자 승인 대기 (취소)</button>'
            : '<button type="button" class="card-btn" id="request-mm" style="flex:none;">🤝 주선자 요청</button>');
      headBtns = '<button type="button" class="card-btn primary" data-action="card-detail" data-id="' + escapeHtml(me.id) + '" style="flex:none;">👤 내 프로필 보기</button>' +
        reqBtn + '<button type="button" class="card-btn" id="start-proxy" style="flex:none;">🤝 친구 대신 소개하기</button>';
    }
    return (
      '<div class="admin-panel">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">' +
          '<h2 style="margin:0;">메시지함</h2>' +
          (headBtns ? '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + headBtns + '</div>' : '') +
        '</div>' +
        '<div class="my-uid" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">고유번호 ' + escapeHtml(formatUid(me) || '—') + '</div>' +
        actingBanner +
        '<p class="sub">' + escapeHtml(me.nickname) + '님, 반가워요! 받은 요청은 직접 승인하거나 거절할 수 있어요.</p>' +
        (me.deleteRequested ? '<div class="mine-note reject" style="margin-top:10px;">🗑 삭제 요청이 접수되어 <b>관리자 확인 중</b>이에요. <button type="button" class="card-btn" data-action="cancel-delete" data-id="' + escapeHtml(me.id) + '" style="flex:none;padding:4px 12px;margin-left:8px;">삭제 요청 취소</button></div>' : '') +
        (me.deactivateRequested ? '<div class="mine-note" style="margin-top:10px;background:var(--gold-soft);border-color:var(--gold);">🗄 비활성화(보관) 요청이 접수되어 <b>관리자 확인 중</b>이에요. <button type="button" class="card-btn" data-action="cancel-deactivate" data-id="' + escapeHtml(me.id) + '" style="flex:none;padding:4px 12px;margin-left:8px;">요청 취소</button></div>' : '') +
        (me.deactivated ? '<div class="mine-note" style="margin-top:10px;background:var(--gold-soft);border-color:var(--gold);">🗄 <b>보관 상태</b>예요 (명단에 노출되지 않아요). 복구는 상단 <b>💬 Q&amp;A</b>로 문의하거나 카카오톡으로 요청해 주세요.</div>' : '') +
        (isSubProfile ? '' : joinRequestSectionHtml(state, false)) + /* 나에게 온 주선자 요청 있으면 표시 */
        sections +
        connectionsSummaryHtml(state, me) +
        (isSubProfile ? '' : msgSection) +
        ((!isSubProfile && !isMatchmakerEntry(myAuthEntry(state)) && me.id === currentUser.id)
          ? '<div class="mine-section" style="margin-top:14px;"><button type="button" class="card-btn" id="convert-mm" style="flex:none;">🤝 주선자 계정으로 전환</button>' +
              '<p class="sub" style="margin:6px 0 0;">여러 친구를 소개하거나, 다른 회원의 주선자 요청을 받고 싶다면 전환하세요. 내 소개팅 프로필은 그대로 유지돼요.</p></div>'
          : '') +
      '</div>'
    );
  }

  /* 관리자 사용량 현황: 누적 요약 + 최근 7일(가입/사진/대화) 추이. 신뢰 가능한 필드(submittedAt/type/status)만 사용 */
  function usageStatsHtml(state) {
    var entries = state.entries || [];
    var pending = state.pendingEntries || [];
    var reqs = state.dateRequests || [];
    var cand = entries.filter(function (e) { return !e.isMatchmaker; }); /* 명단 후보(래퍼 제외) */
    var gGeneral = cand.filter(function (e) { return !e.managedBy; }).length;
    var gFriend = cand.filter(function (e) { return e.managedBy && !e.ownerSelf; }).length;
    var gOwnerSelf = cand.filter(function (e) { return e.managedBy && e.ownerSelf; }).length;
    var mmCount = entries.filter(function (e) { return e.isMatchmaker; }).length;
    var delReq = entries.filter(function (e) { return e.deleteRequested; }).length;
    function reqStat(type) {
      var list = reqs.filter(function (r) { return (r.type || 'contact') === type; });
      var ap = 0, rj = 0, wait = 0;
      list.forEach(function (r) { var s = reqStatus(r); if (s === 'approved') ap++; else if (s === 'rejected') rj++; else wait++; });
      return { total: list.length, ap: ap, rj: rj, wait: wait };
    }
    var photo = reqStat('photo'), talk = reqStat('contact');
    var row = function (lbl, val, sub) {
      return '<tr><td class="lbl">' + lbl + '</td><td><b>' + val + '</b>' + (sub ? ' <span class="stats-sub">' + sub + '</span>' : '') + '</td></tr>';
    };
    var summary =
      '<table class="stats-table">' +
        '<tr><th style="text-align:left;">구분</th><th>수</th></tr>' +
        row('명단 회원(후보)', cand.length, '일반 ' + gGeneral + '·친구 ' + gFriend + '·주선자본인 ' + gOwnerSelf) +
        row('주선자 계정', mmCount, '') +
        row('승인 대기', pending.length, '') +
        row('삭제요청 대기', delReq, '') +
        row('📷 사진 요청', photo.total, '대기 ' + photo.wait + '·승인 ' + photo.ap + '·거절 ' + photo.rj) +
        row('💌 대화 신청', talk.total, '대기 ' + talk.wait + '·승인 ' + talk.ap + '·거절 ' + talk.rj) +
      '</table>';
    /* 일자별 추이 (KST) — 첫 활동일부터 오늘까지 전체. 최신 날짜가 위로 오게 정렬, 세로 스크롤(약 7일 노출) */
    var candDays = cand.map(function (e) { return e.submittedAt ? kstDay(e.submittedAt) : ''; }).filter(Boolean);
    var todayD = kstDay(new Date().toISOString());
    var allDates = candDays.slice();
    reqs.forEach(function (r) { if (r.submittedAt) allDates.push(kstDay(r.submittedAt)); });
    var earliest = allDates.length ? allDates.reduce(function (a, b) { return a < b ? a : b; }) : todayD;
    function addDay(dstr, n) { var d = new Date(dstr + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
    var days = [], d = earliest, guard = 0;
    while (d <= todayD && guard++ < 1000) { days.push(d); d = addDay(d, 1); } /* 오래된→최신 */
    var byDay = {};
    days.forEach(function (dd) { byDay[dd] = { join: 0, photo: 0, talk: 0 }; });
    candDays.forEach(function (dd) { if (byDay[dd]) byDay[dd].join++; });
    reqs.forEach(function (r) { if (r.submittedAt) { var dd = kstDay(r.submittedAt); if (byDay[dd]) { if ((r.type || 'contact') === 'photo') byDay[dd].photo++; else byDay[dd].talk++; } } });
    var trendRows = days.slice().reverse().map(function (dd) { /* 최신 날짜가 위로 */
      var c = byDay[dd]; var md = dd.slice(5).replace('-', '/');
      var cum = candDays.filter(function (x) { return x <= dd; }).length; /* 그 날까지 가입한 현재 회원 누적 */
      return '<tr><td class="lbl">' + md + '</td><td><b>' + cum + '</b></td><td>' + c.join + '</td><td>' + c.photo + '</td><td>' + c.talk + '</td></tr>';
    }).join('');
    var trend =
      '<div class="stats-scroll" style="max-height:270px;overflow-y:auto;"><table class="stats-table stats-trend">' +
        '<thead><tr><th style="text-align:left;">날짜</th><th>누적 회원</th><th>가입</th><th>📷사진</th><th>💌대화</th></tr></thead>' +
        '<tbody>' + trendRows + '</tbody>' +
      '</table></div>';
    return '<details class="admin-fold" data-sec="usage"' + secOpenAttr('usage', false) + '><summary>📊 사용량 현황</summary>' +
      '<div class="admin-fold-body">' + summary +
      '<p class="stats-sub" style="margin:10px 0 4px;">일자별 추이 (최신순 · 누적 회원=그 날까지 가입한 현재 회원, 가입=신규 프로필, 신청=보낸 날 기준)</p>' + trend +
      '<p class="stats-sub" style="margin-top:6px;">※ 탈퇴한 회원은 집계에 없어 누적은 현재 회원 기준이에요. 승인/탈퇴 시점은 별도로 기록되지 않아요.</p>' +
      '</div></details>';
  }

  function renderAdmin(state) {
    if (!isAdminUnlocked) {
      return '<div class="admin-panel"><h2>관리자 모드</h2><p class="sub">위쪽 "관리자" 버튼으로 PIN을 입력하면 승인 대기 명단, 실명, 연락처, 알게 된 경로, 대화 신청함을 볼 수 있어요.</p></div>';
    }
    /* 관리자 섹션 통일 폴딩: 제목 + 개수 배지 + 본문. count가 null이면 배지 생략.
       key가 있으면 저장된 열림 상태(secOpenAttr)를 반영하고 data-sec로 토글을 기억 */
    function adminFold(title, count, body, open, key) {
      var cnt = (count === null || count === undefined) ? '' : '<span class="pending-count">' + count + '</span>';
      var attrs = key ? (' data-sec="' + key + '"' + secOpenAttr(key, open)) : (open ? ' open' : '');
      return '<details class="admin-fold"' + attrs + '>' +
        '<summary>' + title + cnt + '</summary>' +
        '<div class="admin-fold-body">' + body + '</div>' +
      '</details>';
    }
    /* 섹션 내 개별 항목도 접기(요청함과 동일한 req-fold 스타일). summary=요약줄, body=상세+버튼 */
    function foldItem(summaryInner, bodyInner) {
      return '<details class="req-fold">' +
        '<summary>' + summaryInner + '</summary>' +
        '<div class="req-fold-body">' + bodyInner + '</div>' +
      '</details>';
    }
    var pending = state.pendingEntries || [];
    var pendingItems = pending.map(function (e) {
      var displayName = e.nickname || e.name || '(이름 없음)';
      var ageStr = e.birthYear ? (String(e.birthYear).slice(2) + '년생') : '-';
      var heldNote = e.heldReason ? '<div class="p-meta" style="color:var(--accent);margin-top:3px;white-space:pre-wrap;">📌 보류 중: ' + escapeHtml(e.heldReason) + '</div>' : '';
      if (e.rejectedReason) heldNote += '<div class="p-meta" style="color:#c5221f;margin-top:3px;white-space:pre-wrap;">❌ 반려: ' + escapeHtml(e.rejectedReason) + (e.rejectedAt ? ' <span style="color:var(--muted);">(' + fmtDate(e.rejectedAt) + ')</span>' : '') + '</div>';
      var holdBtn = '<button type="button" class="card-btn" data-action="hold-pending" data-id="' + escapeHtml(e.id) + '">' + (e.heldReason ? '보류 사유 수정' : '보류') + '</button>';
      var heldChip = (e.heldReason ? ' <span class="chip" style="background:var(--accent-soft);color:var(--accent);">📌 보류</span>' : '') +
        (e.rejectedReason ? ' <span class="chip" style="background:#fce8e6;color:#c5221f;">❌ 반려</span>' : '');
      if (e.isMatchmaker) {
        return foldItem(
          '<span class="req-sum-who">🤝 ' + escapeHtml(displayName) + '</span> <span class="chip" style="background:#e8f0fe;color:#1a73e8;">🆕 신규</span> <span class="chip" style="background:var(--gold-soft);color:var(--gold);">주선자</span>' + heldChip,
          '<div class="p-meta">주선자(매니저) 등록 — 명단에 노출되지 않아요. 승인하면 친구들을 대신 소개할 수 있어요.</div>' +
          heldNote +
          '<div class="pending-actions">' +
            '<button type="button" class="card-btn" data-action="detail-pending" data-id="' + escapeHtml(e.id) + '">상세 보기</button>' +
            '<button type="button" class="card-btn approve" data-action="approve" data-id="' + escapeHtml(e.id) + '">승인</button>' +
            holdBtn +
            '<button type="button" class="card-btn danger" data-action="reject" data-id="' + escapeHtml(e.id) + '">거절</button>' +
          '</div>'
        );
      }
      var photoStatus = !e.photoCount
        ? '<span style="color:var(--muted);">사진 없음</span>'
        : (e.blurPhoto === false
          ? '<b style="color:var(--accent);">🔓 사진 전체공개</b>'
          : '<span style="color:var(--muted);">🔒 사진 비공개 (요청 승인 시 공개)</span>');
      return foldItem(
        '<span class="req-sum-who">' + escapeHtml(displayName) + '</span> <span class="chip" style="background:#e8f0fe;color:#1a73e8;">🆕 신규</span>' + heldChip + '<span class="req-sum-when">' + genderLabel(e.gender) + ' · ' + escapeHtml(ageStr) + '</span>',
        '<div class="p-meta">' + genderLabel(e.gender) + ' · ' + escapeHtml(ageStr) + ' · ' + escapeHtml(e.region || '') + '</div>' +
        '<div class="p-meta" style="margin-top:3px;">' + photoStatus + '</div>' +
        heldNote +
        '<div class="pending-actions">' +
          '<button type="button" class="card-btn" data-action="detail-pending" data-id="' + escapeHtml(e.id) + '">상세 보기</button>' +
          '<button type="button" class="card-btn approve" data-action="approve" data-id="' + escapeHtml(e.id) + '">승인</button>' +
          holdBtn +
          '<button type="button" class="card-btn danger" data-action="reject" data-id="' + escapeHtml(e.id) + '">거절</button>' +
        '</div>'
      );
    }).join('');
    /* 삭제 요청·비활성화 요청 → "승인 대기"에 함께 합침 (신규 가입 + 삭제 + 보관 전환) */
    var delReqs = (state.entries || []).filter(function (e) { return e.deleteRequested; });
    var deacReqs = (state.entries || []).filter(function (e) { return e.deactivateRequested; });
    var delReqItems = delReqs.map(function (e) {
      return foldItem(
        '<span class="req-sum-who">' + escapeHtml(e.nickname) + '</span> <span class="chip" style="background:#fce8e6;color:#c5221f;">🗑 삭제 요청</span>',
        '<div class="p-meta">' + genderLabel(e.gender) + ' · ' + escapeHtml(e.region || '') + ' · 요청: ' + fmtDate(e.deleteReqAt) + '</div>' +
        (e.deleteReason ? '<div class="p-meta" style="color:var(--ink);">사유: "' + escapeHtml(e.deleteReason) + '"</div>' : '') +
        '<div class="pending-actions">' +
          '<button type="button" class="card-btn" data-action="card-detail" data-id="' + escapeHtml(e.id) + '">👤 프로필</button>' +
          '<button type="button" class="card-btn danger" data-action="approve-delete" data-id="' + escapeHtml(e.id) + '">삭제 승인</button>' +
          '<button type="button" class="card-btn" data-action="cancel-delete" data-id="' + escapeHtml(e.id) + '">요청 취소</button>' +
        '</div>'
      );
    }).join('');
    var deacReqItems = deacReqs.map(function (e) {
      return foldItem(
        '<span class="req-sum-who">' + escapeHtml(e.nickname) + '</span> <span class="chip" style="background:var(--gold-soft);color:var(--gold);">🗄 비활성화 요청</span>',
        '<div class="p-meta">' + genderLabel(e.gender) + ' · ' + escapeHtml(e.region || '') + ' · 요청: ' + fmtDate(e.deactivateReqAt) + '</div>' +
        (e.deactivateReason ? '<div class="p-meta" style="color:var(--ink);">사유: "' + escapeHtml(e.deactivateReason) + '"</div>' : '') +
        '<div class="pending-actions">' +
          '<button type="button" class="card-btn" data-action="card-detail" data-id="' + escapeHtml(e.id) + '">👤 프로필</button>' +
          '<button type="button" class="card-btn approve" data-action="approve-deactivate" data-id="' + escapeHtml(e.id) + '">보관 전환 승인</button>' +
          '<button type="button" class="card-btn" data-action="cancel-deactivate" data-id="' + escapeHtml(e.id) + '">요청 취소</button>' +
        '</div>'
      );
    }).join('');
    var approvalTotal = pending.length + delReqs.length + deacReqs.length;
    var pendingSection = adminFold('⏳ 승인 대기', approvalTotal,
      (approvalTotal ? (pendingItems + delReqItems + deacReqItems) : '<p class="sub">대기 중인 신청이 없어요.</p>'), false, 'pending');
    /* 보관(비활성) 계정 목록 — 사유·재활성화·연결 안내 */
    var deacList = (state.entries || []).filter(function (e) { return e.deactivated; });
    var deacListSection = deacList.length
      ? adminFold('🗄 보관 계정', deacList.length,
          '<p class="sub">비활성화(보관)된 계정이에요. 명단엔 안 보여요. 사유 확인·다시 활성화·연결 회원 안내를 할 수 있어요.</p>' +
          deacList.map(function (e) {
            var sent = e.connectNotifiedAt;
            var sentChip = sent ? ' <span class="chip" style="background:#e6f4ea;color:#137333;">✅ 안내 보냄</span>' : '';
            var sentNote = sent
              ? '<div class="p-meta" style="color:#137333;">✅ 연결 회원 안내 보냄 · ' + fmtDate(e.connectNotifiedAt) + (e.connectNotifiedCount > 1 ? ' (' + e.connectNotifiedCount + '회)' : '') + '</div>'
              : '<div class="p-meta" style="color:var(--muted);">아직 연결 회원 안내를 보내지 않았어요.</div>';
            return foldItem(
              '<span class="req-sum-who">' + escapeHtml(e.nickname) + '</span> <span class="chip" style="background:var(--gold-soft);color:var(--gold);">🗄 보관</span>' + sentChip,
              '<div class="p-meta">' + genderLabel(e.gender) + ' · ' + escapeHtml(e.region || '') + (e.deactivatedAt ? ' · 보관: ' + fmtDate(e.deactivatedAt) : '') + '</div>' +
              (e.deactivatedReason ? '<div class="p-meta" style="color:var(--ink);">사유: "' + escapeHtml(e.deactivatedReason) + '"</div>' : '') +
              sentNote +
              '<div class="pending-actions">' +
                '<button type="button" class="card-btn" data-action="card-detail" data-id="' + escapeHtml(e.id) + '">👤 프로필</button>' +
                '<button type="button" class="card-btn approve" data-action="reactivate" data-id="' + escapeHtml(e.id) + '">♻️ 다시 활성화</button>' +

  var DOC_LIMIT = 1048576; /* Firestore 문서 1개 최대 1MiB */

    (state.entries || []).concat(state.pendingEntries || []).forEach(function (e) {
      if (e.photoThumb) { thumbBytes += byteLen(e.photoThumb); thumbCount++; }

    });

    var barColor = pct > 85 ? '#c5221f' : pct > 60 ? '#E08A2E' : '#3F8C6E';
    var people = (state.entries || []).length + (state.pendingEntries || []).length;
    var avgPerPerson = people ? Math.round(total / people) : 0;

          return { on: on, html: '<button type="button" class="pf-switch-chip' + (on ? ' active' : '') + '" data-action="switch-profile" data-id="' + escapeHtml(s.id) + '" title="' + escapeHtml(tip) + '">🤝 ' + escapeHtml(s.nickname) + unBadge + keyBadge + '</button>' };
        });
        var addBtn = '<button type="button" class="pf-switch-chip pf-switch-add" data-action="switch-add">＋ 추가</button>';
        function line(inner) { return '<div class="ps-line">' + inner + '</div>'; }
        /* 친구는 세로로 한 줄씩. 폴딩(2명+): 접힘=한 명+더보기, 펼침=전체(등록순)+추가.
           더보기/접기 버튼은 항상 첫 줄(첫 친구) 오른쪽에. +추가는 마지막 친구 아래 줄. */
        var canFold = friendSubs.length >= 2;

          childChips = line(chipList[0].html + '<button type="button" class="pf-switch-chip pf-switch-fold" data-action="ps-toggle">접기 ▴</button>') +

    /* 헤더 로그인/PIN 버튼 상태: 회원 로그인 ↔ 관리자 로그인은 한 번에 하나만 노출.
       - 회원 로그인 중: 관리자 버튼 숨기고 그 자리에 'PIN 변경' (로그인 계정이 본인 소유일 때만)
       - 관리자 로그인 중: 회원 로그인 버튼 숨김 */
    var authE = myAuthEntry(state);
    var canChangePin = !!(currentUser && authE && !authE.managedBy);
    var panel;
    if (activeTab === 'list') panel = renderList(state);
    else if (activeTab === 'mine' && currentUser) panel = renderMine(state);

      '<div class="admin-bar">' +
        /* 1줄: 공지·사용법 / URL 복사 */
        '<div class="admin-bar-row">' +
          '<button type="button" class="admin-link" id="show-notice" style="background:#1a73e8;border-color:#1a73e8;color:#fff;opacity:1;font-weight:700;">&#128227; 인사말·공지사항·사용법</button>' +

  /* ---- state & paint ---- */
  function paint(state) {
    currentState = state;
    document.getElementById('app').innerHTML = renderApp(state);
    try {
      var items = document.querySelectorAll('.admin-msg-item');
      for (var i = 0; i < items.length; i++) {
        if (openMsgFolds[items[i].getAttribute('data-eid')]) items[i].open = true;
      }
    } catch (e) {}
    try { applyLogFilter(); } catch (e) {} /* 활동기록 필터 재적용 */
    try { adjustSwitcherClip(); } catch (e) {} /* 전환창 친구 2줄 초과 시 접기 */
    try { updateCharCounts(); } catch (e) {} /* 자기소개 등 글자수 카운터 */
    try { purgeExpiredRejections(state); } catch (e) {} /* 반려 후 하루 지난 신청 정리(관리자) */
    maybeRestoreDraft();
  }

  /* 신청서를 작성 중이면(포커스/입력/사진 있음) 배경 갱신으로 화면을 다시 그리지 않음
     — 다른 사람 활동으로 인한 실시간 갱신이 입력 중인 폼을 지우는 문제 방지 */
  function isEditingForm() {
    if (activeTab !== 'form') return false;
    var form = document.getElementById('entry-form');
    if (!form) return false;
    if (form.contains(document.activeElement)) return true;
    if (photoDataUrls && photoDataUrls.length) return true;
    var fields = form.querySelectorAll('input, textarea, select');
    for (var i = 0; i < fields.length; i++) {
      var el = fields[i];
      if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) return true; }
      else if ((el.value || '').trim()) return true;
    }
    return false;
  }

  /* ---- 신청서 임시 저장 (새로고침/이동/오류로도 안 날아가게) ---- */
  var DRAFT_KEY = 'form-draft-v1';
  function saveDraft() {
    if (editingEntryId || proxyRegisterMode || formRole !== 'self') return; /* 신규 본인 신청서 작성만 (수정·대리등록·주선자등록 제외) */
    var form = document.getElementById('entry-form');
    if (!form) return;
    try {
      var g = function (n) { var el = form.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
      var radio = function (n) { var el = form.querySelector('[name="' + n + '"]:checked'); return el ? el.value : ''; };
      var draft = {
        nickname: g('nickname'), realName: g('realName'), contact: g('contact'),
        gender: radio('gender'), birthYear: g('birthYear'), region: g('region'),
        workplace: g('workplace'), referrerText: g('referrerText'), degreeChoice: radio('degreeChoice'),
        height: g('height'), intro: g('intro'), idealType: g('idealType'), dealbreaker: g('dealbreaker'),
        photos: (photoDataUrls || []).slice(), savedAt: Date.now()
      };
      /* PIN은 민감정보라 저장하지 않음 */
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    } catch (e) {}
  }
  function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  function draftHasContent(d) {
    return !!(d && (d.nickname || d.realName || d.contact || d.region || d.workplace ||
      d.intro || d.idealType || d.dealbreaker || d.height || d.birthYear ||
      d.gender || d.degreeChoice || (d.photos && d.photos.length)));
  }
  function maybeRestoreDraft() {
    if (editingEntryId || proxyRegisterMode || formRole !== 'self') return; /* 본인 신청서에서만 복원 (주선자 등록·대리 제외) */
    var form = document.getElementById('entry-form');
    if (!form) return;
    var nick = form.querySelector('[name="nickname"]');
    if (!nick || nick.value) return; /* 이미 채워져 있으면 건드리지 않음 */
    var d = loadDraft();
    if (!draftHasContent(d)) return;
    var setVal = function (n, v) { var el = form.querySelector('[name="' + n + '"]'); if (el && v) el.value = v; };
    setVal('nickname', d.nickname); setVal('realName', d.realName); setVal('contact', d.contact);
    setVal('birthYear', d.birthYear); setVal('region', d.region); setVal('workplace', d.workplace);
    setVal('referrerText', d.referrerText); if (d.referrerText) { try { setReferrerField(d.referrerText); } catch (e) {} } setVal('height', d.height);
    setVal('intro', d.intro); setVal('idealType', d.idealType); setVal('dealbreaker', d.dealbreaker);
    if (d.gender) { var gr = form.querySelector('[name="gender"][value="' + d.gender + '"]'); if (gr) gr.checked = true; }
    if (d.degreeChoice) { var dr = form.querySelector('[name="degreeChoice"][value="' + d.degreeChoice + '"]'); if (dr) dr.checked = true; }
    if (d.photos && d.photos.length) { photoDataUrls = d.photos.slice(); renderPhotoThumbs(); }
    var lede = form.parentNode.querySelector('.form-lede');
    if (lede && !document.getElementById('draft-restored-note')) {
      var note = document.createElement('div');
      note.id = 'draft-restored-note';
      note.className = 'readonly-note';
      note.style.cssText = 'background:var(--gold-soft);border-color:var(--gold);margin-top:10px;';
      note.innerHTML = '&#128190; 작성 중이던 내용을 불러왔어요. <button type="button" class="card-btn" id="draft-clear" style="margin-left:8px;padding:4px 12px;">새로 쓰기</button>';
      lede.parentNode.insertBefore(note, lede.nextSibling);
    }
  }

  function saveState(state) {
    currentState = state;
    return stateRef.set(JSON.parse(JSON.stringify(state)));
  }

  function decryptAllAdminData(state) {
    if (!isAdminUnlocked || !adminPrivateKey) return Promise.resolve();
    var promises = [];
    (state.entries || []).forEach(function (entry) {
      if (entry.contactEnc && !decryptedContacts[entry.id]) {
        promises.push(decryptWithAdmin(adminPrivateKey, entry.contactEnc).then(function (v) { decryptedContacts[entry.id] = v; }).catch(function () {}));
      }
    });
    (state.dateRequests || []).forEach(function (req) {
      if (!decryptedRequests[req.id] && req.ciphertext) {
        promises.push(decryptWithAdmin(adminPrivateKey, { iv: req.iv, ciphertext: req.ciphertext, wrappedKey: req.wrappedKey }).then(function (v) { decryptedRequests[req.id] = v; }).catch(function () {}));
      }
    });
    return Promise.all(promises);
  }

  /* ---- event handlers ---- */
  function handleAdminToggle() {
    var state = currentState;
    if (isAdminUnlocked) {
      isAdminUnlocked = false;
      adminPrivateKey = null;
      decryptedContacts = {};
      decryptedRequests = {};
      clearAdminPin();
      if (activeTab === 'admin') activeTab = 'form';
      paint(state);
      return;
    }
    if (!state.adminAuth) {
      modalPinSetup().then(function (r) {
        if (!r) return;
        var pwErr = adminPwError(r.p1);
        if (pwErr) return modalNotice('오류', pwErr);
        if (r.p1 !== r.p2) return modalNotice('오류', '비밀번호가 일치하지 않아요.');
        setupAdminPin(r.p1).then(function (auth) {
          state.adminAuth = auth;
          return saveState(state).then(function () {
            return unlockAdminKey(r.p1, auth);
          });
        }).then(function (key) {
          adminPrivateKey = key;
          isAdminUnlocked = true; requestNotifPermission();
          saveAdminPin(r.p1);
          return decryptAllAdminData(state);
        }).then(function () {
          paint(state);
        });
      });
      return;
    }
    modalPin('관리자 인증', '비밀번호를 입력하세요.', { password: true }).then(function (pin) {
      if (!pin) return;
      unlockAdminKey(pin, state.adminAuth).then(function (key) {
        adminPrivateKey = key;
        isAdminUnlocked = true;
        saveAdminPin(pin);
        return decryptAllAdminData(state);
      }).then(function () {
        paint(state);
      }).catch(function () {
        modalNotice('오류', '비밀번호가 올바르지 않아요.');
      });
    });
  }

  function handleChangeAdminPw() {
    var state = currentState;
    if (!isAdminUnlocked || !adminPrivateKey || !state.adminAuth) {
      return modalNotice('안내', '관리자 모드에서만 변경할 수 있어요.');
    }
    modalPinSetup().then(function (r) {
      if (!r) return;
      var pwErr = adminPwError(r.p1);
      if (pwErr) return modalNotice('오류', pwErr);
      if (r.p1 !== r.p2) return modalNotice('오류', '비밀번호가 일치하지 않아요.');
      rewrapAdminKey(r.p1, state.adminAuth, adminPrivateKey).then(function (auth) {
        return stateRef.update({ adminAuth: auth }).then(function () {
          state.adminAuth = auth;
          saveAdminPin(r.p1);
          appendLog('admin', '관리자', '비밀번호 변경');
          modalNotice('완료', '관리자 비밀번호가 변경되었어요.');
        });
      }).catch(function (err) {
        modalNotice('오류', '변경에 실패했어요: ' + (err.message || err));
      });
    });
  }

  /* 숫자 PIN 설정 모달 (신규/확인) */
  function modalNumericPinSetup(title, message, okLabel) {
    return new Promise(function (resolve) {
      var overlay = openModal(
        '<h3>' + escapeHtml(title) + '</h3>' +
        '<p class="modal-msg">' + escapeHtml(message) + '</p>' +
        '<input type="text" inputmode="numeric" class="modal-input" id="np1" data-numeric maxlength="8" placeholder="PIN (숫자 4~8자리)">' +
        '<input type="text" inputmode="numeric" class="modal-input" id="np2" data-numeric maxlength="8" placeholder="PIN 확인" style="margin-top:8px;">' +
        '<div class="modal-actions">' +
          '<button type="button" class="card-btn" id="modal-cancel">취소</button>' +
          '<button type="button" class="card-btn primary" id="modal-ok">' + escapeHtml(okLabel || '변경') + '</button>' +
        '</div>'
      );
      function finish(v) { closeModal(overlay); resolve(v); }
      overlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });
      overlay.querySelector('#modal-ok').addEventListener('click', function () {
        finish({ p1: overlay.querySelector('#np1').value.trim(), p2: overlay.querySelector('#np2').value.trim() });
      });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(null); });
    });
  }

  /* 로그인한 본인이 개인(로그인) PIN 변경.
     - 항상 로그인 계정(myAuthEntry) 기준으로 바꿈 (주선자가 친구로 전환해 있어도 로그인 PIN을 바꿈)
     - 내 연락처 + 내가 관리하는 프로필(친구/본인)의 연락처도 새 PIN으로 재암호화해 계속 열람 가능하게 함 */
  function handleChangeMyPin() {
    var me = myAuthEntry(currentState);
    if (!me) return modalNotice('로그인 필요', '먼저 로그인해주세요.');
    modalNumericPinSetup('PIN 변경', '새로 사용할 개인 PIN을 입력해주세요.').then(function (r) {
      if (!r) return;
      if (!/^[0-9]{4,8}$/.test(r.p1)) return modalNotice('입력 오류', 'PIN은 숫자 4~8자리예요.');
      if (r.p1 !== r.p2) return modalNotice('오류', 'PIN이 일치하지 않아요.');
      var oldPin = currentUser.pin, newPin = r.p1;
      /* 내가 관리하는 프로필들(친구·본인) — 연락처가 내 옛 PIN으로 암호화돼 있음 */
      var subs = (currentState.entries || []).filter(function (e) { return e.managedBy === me.id && e.contactSelfEnc; });
      var decJobs = [ me.contactSelfEnc ? decryptForSelf(oldPin, me.contactSelfEnc).catch(function () { return null; }) : Promise.resolve(null) ];
      subs.forEach(function (s) { decJobs.push(decryptForSelf(oldPin, s.contactSelfEnc).catch(function () { return null; })); });
      Promise.all(decJobs).then(function (contacts) {
        var encJobs = [ makePinAuth(newPin), contacts[0] ? encryptForSelf(newPin, contacts[0]) : Promise.resolve(null) ];
        subs.forEach(function (s, i) { var c = contacts[i + 1]; encJobs.push(c ? encryptForSelf(newPin, c) : Promise.resolve(null)); });
        return Promise.all(encJobs).then(function (res) {
          var newAuth = res[0], newSelf = res[1];
          var subEnc = {}; subs.forEach(function (s, i) { if (res[i + 2]) subEnc[s.id] = res[i + 2]; });
          return db.runTransaction(function (tx) {
            return tx.get(stateRef).then(function (doc) {
              var s = doc.data();
              var entries = (s.entries || []).map(function (e) {
                if (e.id === me.id) {
                  var c = JSON.parse(JSON.stringify(e));
                  c.pinAuth = newAuth; delete c.pinHash; delete c.pinEnc;
                  if (newSelf) c.contactSelfEnc = newSelf;
                  return c;
                }
                if (subEnc[e.id]) { var c2 = JSON.parse(JSON.stringify(e)); c2.contactSelfEnc = subEnc[e.id]; return c2; }
                return e;
              });
              tx.update(stateRef, { entries: entries });
            });
          });
        });
      }).then(function () {
        currentUser.pin = newPin; saveSession();
        appendLog('edit', me.nickname, 'PIN 변경');
        return refreshNow();
      }).then(function () {
        modalNotice('완료', 'PIN이 변경되었어요.');
      }).catch(function (err) {
        modalNotice('오류', '변경에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleFormSubmit() {
    if (formRole === 'mm-new' && !editingEntryId) { handleMatchmakerSubmit(); return; } /* 새 주선자 등록 */
    if (editingEntryId) { /* 주선자 계정 수정은 최소 폼 전용 핸들러로 */
      var _mmE = (currentState.entries || []).concat(currentState.pendingEntries || []).find(function (e) { return e.id === editingEntryId; });
      if (_mmE && _mmE.isMatchmaker) { handleMatchmakerEditSubmit(_mmE); return; }
    }
    var state = currentState;
    if (!state.adminAuth) {
      modalNotice('안내', '관리자가 아직 PIN을 설정하지 않았어요. 관리자에게 문의해주세요.');
      return;
    }
    var form = document.getElementById('entry-form');
    var nickname = (form.querySelector('[name="nickname"]').value || '').trim();
    var realName = (form.querySelector('[name="realName"]').value || '').trim();
    var contact = (form.querySelector('[name="contact"]').value || '').trim();
    var genderEl = form.querySelector('[name="gender"]:checked');
    var gender = genderEl ? genderEl.value : '';
    var birthYear = parseInt(form.querySelector('[name="birthYear"]').value, 10);
    var region = (form.querySelector('[name="region"]').value || '').trim();
    var workplace = (form.querySelector('[name="workplace"]').value || '').trim();
    var referrerText = (form.querySelector('[name="referrerText"]').value || '').trim();
    var degreeEl = form.querySelector('[name="degreeChoice"]:checked');
    var degreeChoice = degreeEl ? degreeEl.value : '';
    var pin = (form.querySelector('[name="pin"]').value || '').trim();
    var height = (form.querySelector('[name="height"]').value || '').trim();
    var intro = (form.querySelector('[name="intro"]').value || '').trim();
    var idealType = (form.querySelector('[name="idealType"]').value || '').trim();
    var dealbreaker = (form.querySelector('[name="dealbreaker"]').value || '').trim();
    var blurPhoto = form.querySelector('#f-blur') ? form.querySelector('#f-blur').checked : false;

    var isEdit = !!editingEntryId;
    /* 친구 대신 소개(대리 등록) — renderForm과 동일한 판정: proxyRegisterMode 이거나, 주선자가 주선자 탭(formRole)으로 온 경우.
       (소개자는 곧 그 회원이므로 소개자 입력을 요구하지 않음 → 아래에서 자동 설정) */
    var proxy = (proxyRegisterMode || (formRole === 'matchmaker' && currentUser)) && !isEdit;
    /* 주선자(Lv2)가 [본인] 탭(formRole='self')에서 자기 소개팅 프로필을 만드는 경우 → 주선자 아래 관리 프로필로 생성 */
    var ownerByMM = !proxy && !isEdit && !!(currentUser && isMatchmakerEntry(myAuthEntry(state)));
    var managedCreate = proxy || ownerByMM; /* 주선자 아래 관리 프로필 생성(managedBy 설정, 로그인 전환 안 함) */
    var origEntry = isEdit ? (state.entries || []).concat(state.pendingEntries || []).find(function (e) { return e.id === editingEntryId; }) : null;
    var origIsPending = !!(isEdit && origEntry && (state.pendingEntries || []).some(function (e) { return e.id === editingEntryId; }));

    var missing = [];
    if (!nickname) missing.push('닉네임');
    if (!gender) missing.push('성별');
    if (!birthYear) missing.push('생년');
    if (!height) missing.push('키');
    if (!region) missing.push('사는 곳');
    if (!workplace) missing.push('직장 위치');
    if (!isEdit) {
      if (!realName) missing.push('실명');
      if (!contact) missing.push('전화번호');
      /* 알게 된 경로: 일반 회원 본인 등록은 필수. 대리/주선자 본인 생성은 아래에서 자동 설정하므로 제외 */
      if (!managedCreate && !referrerText) missing.push('알게 된 경로');
      if (!managedCreate && !pin && !currentUser) missing.push('개인 PIN'); /* 로그인 상태면 기존 PIN 재사용 가능 */
      if (intro.length < 20) missing.push('자기소개(20자 이상)');
      if (idealType.length < 10) missing.push('원하는 이성 조건(10자 이상)');
      if (dealbreaker.length < 10) missing.push('피하고 싶은 조건(10자 이상)');
    }
    if (missing.length > 0) {
      modalNotice('입력 오류', '다음 항목을 채워주세요: ' + missing.join(', '));
      return;
    }
    if (proxy && !(currentUser && currentUser.id)) {
      modalNotice('로그인 필요', '친구 대신 소개하려면 먼저 로그인해주세요.');
      return;
    }
    if (!isEdit) {
      var consent = document.getElementById('f-consent');
      if (!consent || !consent.checked) {
        modalNotice('동의 필요', proxy ? '소개 대상 본인의 등록 동의를 확인해 주세요.' : '개인정보 수집 및 이용에 동의해 주세요.');
        return;
      }
    }
    if (!isEdit && photoDataUrls.length < 1) { /* 신규 등록은 사진 최소 1장 필수 (최대 3장) */
      modalNotice('사진 필요', '사진을 최소 1장 등록해 주세요. (최대 3장)');
      return;
    }
    if (proxy && !referrerText) referrerText = '주선자: ' + ((currentUser && currentUser.nickname) || '');
    if (ownerByMM && !referrerText) referrerText = '주선자 본인';
    if (!isEdit && !managedCreate && !pin && currentUser && currentUser.pin) pin = currentUser.pin; /* 로그인(일반) 상태 본인 프로필: 기존 PIN 그대로 사용 (주선자 관리 프로필은 PIN 없음) */
    if (pin && pin.length < 4) {
      modalNotice('입력 오류', 'PIN은 4자리 이상이어야 해요.');
      return;
    }
    if (contact && !/^01[0-9]{8,9}$/.test(contact)) {
      modalNotice('입력 오류', '전화번호는 01012345678 형식으로 입력해주세요.');
      return;
    }
    /* 닉네임 중복 확인 (본인 제외). 주선자 본인 프로필은 주선자 계정과 같은 닉네임 허용 */
    var nickLower = nickname.toLowerCase();
    var nickExempt = nickExemptIds(state); /* 주선자 본인 프로필 ↔ 주선자 계정 동일 닉네임 허용 (신규·수정 공통) */
    var dup = (state.entries || []).concat(state.pendingEntries || []).some(function (e) {
      return nickExempt.indexOf(e.id) < 0 && (e.nickname || '').trim().toLowerCase() === nickLower;
    });
    if (dup) {
      modalNotice('닉네임 중복', '이미 사용 중인 닉네임이에요. 다른 닉네임을 사용해주세요.');
      return;
    }
    if (isEdit && !formPhotosReady) {
      modalNotice('안내', '사진을 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }

    var btn = document.getElementById('submit-btn');
    var msg = document.getElementById('status-msg');
    btn.disabled = true;
    msg.textContent = isEdit ? '수정 중...' : '제출 중...';
    msg.className = 'status-msg';

    var pubJwk = state.adminAuth.publicKeyJwk;
    var entryId = (isEdit && origEntry) ? origEntry.id : genId();
    var finalPhotos = photoDataUrls.slice();

    var selfPin = pin || (currentUser && currentUser.id === entryId ? currentUser.pin : null);
    if (managedCreate && currentUser) selfPin = currentUser.pin; /* 관리 프로필(대리/주선자본인) 번호를 주선자 PIN으로 암호화 → 전환 시 번호 사용 가능 */
    var encPromises = [
      realName ? encryptForAdmin(pubJwk, realName) : Promise.resolve(null),
      contact ? encryptForAdmin(pubJwk, contact) : Promise.resolve(null),
      referrerText ? encryptForAdmin(pubJwk, referrerText) : Promise.resolve(null),
      pin ? makePinAuth(pin) : Promise.resolve(null),
      (contact && selfPin) ? encryptForSelf(selfPin, contact) : Promise.resolve(null),
      finalPhotos.length
        ? resizeDataUrl(finalPhotos[0],
            blurPhoto ? BLUR_THUMB_MAX : THUMB_MAX,
            blurPhoto ? BLUR_THUMB_MAX : THUMB_MAX,
            blurPhoto ? BLUR_THUMB_Q : THUMB_Q)
        : Promise.resolve(null)
    ];
    Promise.all(encPromises).then(function (results) {
      var thumb = results[5] || null;
      /* 원본 사진은 photos/{id} 별도 문서로 저장 (app/state는 썸네일만) */
      var photoWrite;
      if (finalPhotos.length) photoWrite = photosRef.doc(entryId).set({ photos: finalPhotos });
      else if (isEdit) photoWrite = photosRef.doc(entryId).delete().catch(function () {});
      else photoWrite = Promise.resolve();
      return photoWrite.then(function () {
        photoCache[entryId] = finalPhotos;
        if (isEdit && origEntry) {
          return db.runTransaction(function (tx) {
            return tx.get(stateRef).then(function (doc) {
              var s = doc.data();
              var applyEdit = function (list, isPending) {
                return (list || []).map(function (e) {
                  if (e.id !== editingEntryId) return e;
                  /* 최신 저장본을 복사한 뒤 바뀐 항목만 덮어씀 → 다른(최신) 버전이 추가한 필드도 보존 */
                  var u = JSON.parse(JSON.stringify(e));
                  u.nickname = nickname;
                  u.gender = gender;
                  u.birthYear = birthYear;
                  u.region = region;
                  u.workplace = workplace;
                  u.photoThumb = thumb;
                  u.photoCount = finalPhotos.length;
                  u.blurPhoto = blurPhoto && finalPhotos.length > 0;
                  u.height = height;
                  u.intro = intro;
                  u.idealType = idealType;
                  u.dealbreaker = dealbreaker;
                  u.degreeChoice = degreeChoice;
                  /* 비운 항목은 기존 값 유지, 새로 입력한 항목만 덮어씀 */
                  if (results[0]) u.realNameEnc = results[0];
                  if (results[1]) u.contactEnc = results[1];
                  if (results[2]) u.referrerEnc = results[2];
                  if (results[4]) u.contactSelfEnc = results[4];
                  /* PIN: 새로 입력했으면 신형(pinAuth)으로 교체, 아니면 기존 형식 유지 */
                  if (results[3]) { u.pinAuth = results[3]; delete u.pinHash; }
                  /* 승인 대기(보류/반려) 상태에서 수정·재제출 → 반려/보류 해제하고 다시 대기열로 */
                  if (isPending) { delete u.rejectedReason; delete u.rejectedAt; delete u.heldReason; delete u.heldAt; u.submittedAt = new Date().toISOString(); }
                  return u;
                });
              };
              tx.update(stateRef, { entries: applyEdit(s.entries, false), pendingEntries: applyEdit(s.pendingEntries, true) });
            });
          });
        } else {
          var entry = {
            id: entryId,
            nickname: nickname,
            gender: gender,
            birthYear: birthYear,
            region: region,
            workplace: workplace,
            photoThumb: thumb,
            photoCount: finalPhotos.length,
            blurPhoto: blurPhoto && finalPhotos.length > 0,
            height: height,
            intro: intro,
            idealType: idealType,
            dealbreaker: dealbreaker,
            realNameEnc: results[0],
            contactEnc: results[1],
            referrerEnc: results[2],
            degreeChoice: degreeChoice,
            pinAuth: results[3],
            contactSelfEnc: results[4],
            submittedAt: new Date().toISOString()
          };
          if (proxy) {
            entry.managedBy = currentUser.id;      /* 이 프로필을 관리하는 주선자 */
            entry.isProxy = true;
            entry.proxyConsentAt = new Date().toISOString();
          } else if (ownerByMM) {
            entry.managedBy = currentUser.id;      /* 주선자 아래 '본인' 프로필 */
            entry.ownerSelf = true;
          }
          return stateRef.update({
            pendingEntries: firebase.firestore.FieldValue.arrayUnion(entry)
          });
        }
      });
    }).then(function () {
      if (contact) saveMyPhone(entryId, selfPin, contact); /* 서버에 번호 안전 저장(암호화) — SMS·지인필터 공용, best-effort */
      photoDataUrls = [];
      if (isEdit) {
        editingEntryId = null;
        if (origEntry && origEntry.nickname !== nickname) appendLog('edit', nickname, '닉네임 변경: ' + origEntry.nickname + ' → ' + nickname);
        else appendLog('edit', nickname, '프로필 수정');
        notifyAdmin(origIsPending ? '신청서 재제출' : '프로필 수정', nickname + '님이 ' + (origIsPending ? '신청서를 수정해 다시 제출했어요 (승인 대기).' : '프로필을 수정했어요.'));
        modalNotice('완료', origIsPending ? '수정해서 다시 제출했어요. 관리자 승인을 기다려 주세요.' : '프로필이 수정되었어요.');
        activeTab = currentUser ? 'mine' : 'list'; /* 회원이 메시지함에서 수정 → 저장 후 메시지함 복귀 */
        paint(currentState);
      } else if (managedCreate) {
        /* 대리 등록 / 주선자 본인: 주선자는 로그인 유지, 새 프로필로 바꾸지 않음 */
        editingEntryId = null;
        proxyRegisterMode = false;
        var mgrNick = (currentUser && currentUser.nickname) || '주선자';
        if (ownerByMM) {
          appendLog('signup', mgrNick, '주선자 본인 프로필 등록: ' + nickname);
          notifyAdmin('새 신청서 📝 (주선자 본인)', mgrNick + '님이 본인 프로필(' + nickname + ')을 등록했어요 (승인 대기).');
          modalNotice('접수 완료 🙋', '본인 프로필을 등록했어요! 관리자 승인 후 명단에 올라가요. 상단 "🔄 활동 중 프로필"에서 본인으로 전환해 직접 요청·승인할 수 있어요.');
        } else {
          appendLog('signup', mgrNick, '친구 대신 소개 신청: ' + nickname);
          notifyAdmin('새 신청서 📝 (대리)', mgrNick + '님이 ' + nickname + '님을 대신 소개했어요 (승인 대기).');
          modalNotice('접수 완료 🤝', nickname + '님을 대신 소개했어요! 관리자 승인 후 명단에 올라가요. 승인되면 상단 "🔄 활동 중 프로필"에서 그 친구로 전환해 요청을 대신 승인·관리할 수 있어요.');
        }
        activeTab = 'mine';
        paint(currentState);
      } else {
        editingEntryId = null;
        clearDraft(); /* 제출 성공 → 임시저장 삭제 */
        currentUser = { id: entryId, nickname: nickname, pin: pin };
        saveSession();
        appendLog('signup', nickname, '신청서 제출');
        notifyAdmin('새 신청서 접수', nickname + '님이 신청서를 제출했어요! 승인 대기 중.');
        showStamp();
      }
    }).catch(function (err) {
      btn.disabled = false;
      msg.textContent = '오류가 발생했어요: ' + (err.message || err);
      msg.className = 'status-msg error';
    });
  }

  function showStamp() {
    var overlay = openModal(
      '<div style="text-align:center;">' +
        '<div class="stamp-ring" style="margin:0 auto 16px;">' + ICON_STAMP + '</div>' +
        '<h3>접수 완료!</h3>' +
        '<p class="modal-msg" style="margin-bottom:4px;">관리자에게 승인 요청이 전달되었어요!</p>' +
        '<p style="font-size:0.82rem;color:var(--muted);margin:0 0 20px;">승인 후 명단에 올라갑니다.</p>' +
        '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인</button></div>' +
      '</div>'
    );
    function finish() {
      closeModal(overlay);
      activeTab = 'list';
      paint(currentState);
    }
    overlay.querySelector('#modal-ok').addEventListener('click', finish);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(); });
  }

  function handleEdit(id) {
    var state = currentState;
    var entry = (state.entries || []).concat(state.pendingEntries || []).find(function (e) { return e.id === id; });
    if (!entry) return;
    if (isAdminUnlocked) {
      startEditing(entry);
      return;
    }
    if (currentUser && currentUser.id === id) {
      startEditing(entry);
      return;
    }
    if (iManageTarget(state, id)) { /* 내가 소개한 대리(sub) 프로필은 수정 가능 */
      startEditing(entry);
      return;
    }
    modalNotice('로그인 필요', '수정은 로그인한 뒤 본인 프로필(또는 내가 소개한 친구)만 할 수 있어요. 상단에서 로그인해 주세요.');
  }

  function startEditing(entry) {
    editingEntryId = entry.id;
    exampleTipDismissed = false; /* 수정 모드에서도 예시 카드 표시 */
    photoDataUrls = [];
    formPhotosReady = false;
    /* 원본 사진(고화질)을 photos/{id}에서 불러와 편집기에 채움 */
    loadPhotos(entry).then(function (arr) {
      photoDataUrls = (arr || []).slice();
      formPhotosReady = true;
      renderPhotoThumbs();
    });
    activeTab = 'form';
    paint(currentState);
    setTimeout(function () {
      var form = document.getElementById('entry-form');
      if (!form) return;
      var setVal = function (name, val) { var el = form.querySelector('[name="' + name + '"]'); if (el) el.value = val || ''; };
      setVal('nickname', entry.nickname);
      setVal('realName', '');
      setVal('contact', '');
      var genderRadio = form.querySelector('[name="gender"][value="' + entry.gender + '"]');
      if (genderRadio) genderRadio.checked = true;
      setVal('birthYear', entry.birthYear);
      setVal('region', entry.region);
      setVal('workplace', entry.workplace);
      setVal('referrerText', '');
      var degRadio = form.querySelector('[name="degreeChoice"][value="' + (entry.degreeChoice || '') + '"]');
      if (degRadio) degRadio.checked = true;
      setVal('height', entry.height || '');
      setVal('intro', entry.intro || '');
      setVal('idealType', entry.idealType || '');
      setVal('dealbreaker', entry.dealbreaker || '');
      var blurCheck = form.querySelector('#f-blur');
      if (blurCheck) blurCheck.checked = !!entry.blurPhoto;
      renderPhotoThumbs();
      updateCharCounts();
    }, 50);
  }

  function handleCancelRequest(toId) {
    var state = currentState;
    requireLogin().then(function (myEntry) {
      if (!myEntry) return;
      var req = (state.dateRequests || []).find(function (rq) {
        return rq.fromId === myEntry.id && rq.toId === toId && reqStatus(rq) === 'pending';
      });
      if (!req) return modalNotice('안내', '취소할 수 있는 요청이 없어요.');
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var newRequests = (s.dateRequests || []).filter(function (rq) { return rq.id !== req.id; });
          tx.update(stateRef, { dateRequests: newRequests });
        });
      }).then(function () {
        modalNotice('완료', '요청이 취소되었어요.');
      }).catch(function (err) {
        modalNotice('오류', '취소에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleDelete(id) {
    var state = currentState;
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    function doDelete() {
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var newEntries = (s.entries || []).filter(function (e) { return e.id !== id; });
          var newRequests = (s.dateRequests || []).filter(function (r) { return r.toId !== id; });
          tx.update(stateRef, { entries: newEntries, dateRequests: newRequests });
        });
      }).then(function () {
        photosRef.doc(id).delete().catch(function () {});
        delete photoCache[id];
        if (isAdminUnlocked) appendLog('admin', '관리자', '프로필 삭제 · ' + entry.nickname);
        else appendLog('edit', entry.nickname, '프로필 삭제 (본인)');
        modalNotice('완료', '명단에서 삭제되었어요.');
      }).catch(function (err) {
        modalNotice('오류', '삭제에 실패했어요: ' + (err.message || err));
      });
    }
    if (isAdminUnlocked) {
      modalConfirm('삭제', escapeHtml(entry.nickname) + '님을 명단에서 삭제할까요?').then(function (ok) {
        if (!ok) return;
        doDelete();
      });
      return;
    }
    /* 로그인한 본인, 또는 내가 소개한 친구(sub) → 즉시 삭제 대신 '관리자 삭제 요청' (삭제 후 튀기 방지) */
    if (currentUser && (currentUser.id === id || iManageTarget(state, id))) {
      requestDeletion(id);
      return;
    }
    modalNotice('로그인 필요', '삭제는 로그인한 뒤 본인 프로필(또는 내가 소개한 친구)만 할 수 있어요. 상단에서 로그인해 주세요.');
  }
  /* 회원(본인/주선자)의 삭제 요청 — 즉시 삭제 안 하고 관리자 승인 대기로 표시 */
  function requestDeletion(id) {
    var entry = (currentState.entries || []).find(function (e) { return e.id === id; });

      var todayK = kstDay(new Date().toISOString());

        return;
      }
      var remainToday = typeLimit - sentTodayType; /* 이번 건 포함 남은 횟수 */
      var icon = isPhoto ? '📷' : '💌';
      var noteOverlay = openModal(

        '<p class="modal-msg">' + (isPhoto ? '수락하면 <b>서로 사진이 공개</b>돼요. ' : '수락하면 <b>앱 안에서 채팅</b>으로 대화할 수 있어요 (번호는 공개되지 않아요). ') + '간단한 인사·요청 이유를 꼭 남겨주세요 <b>(최소 10자)</b>.</p>' +
        '<p class="modal-msg" style="color:var(--gold);font-size:0.82rem;margin:-2px 0 6px;">오늘 ' + actionText + ' 남은 횟수: <b>' + remainToday + '/' + typeLimit + '</b></p>' +
        '<textarea class="modal-input" id="modal-note" rows="3" maxlength="200" placeholder="' + (isPhoto ? '예) 안녕하세요! 프로필 보고 관심이 있어서 사진 요청 드립니다. 제 사진도 공개해드렸으니, 보시고 편하게 답변 주세요.' : '예) 안녕하세요! 프로필 잘 봤어요, 꼭 한번 대화해보고 싶어요 :)') + '"></textarea>' +

          '<button type="button" class="card-btn primary" id="modal-ok">요청하기</button>' +
          (isPhoto ? '<button type="button" class="card-btn approve" id="modal-ok-reveal">요청 + 내 사진 공개</button>' : '') +
        '</div>' +
        (isPhoto ? '<p class="modal-msg" style="color:var(--muted);font-size:0.8rem;margin:6px 0 0;">“요청 + 내 사진 공개”를 누르면 상대가 수락 전에도 내 사진을 볼 수 있어요 (수락률↑).</p>' : '')
      );
      new Promise(function (resolve) {
        function finish(val) { closeModal(noteOverlay); resolve(val); }
        var noteEl = noteOverlay.querySelector('#modal-note');
        var warnEl = noteOverlay.querySelector('#modal-note-warn');
        function submit(reveal) {
          var v = noteEl.value.trim();
          if (v.length < 10) { warnEl.hidden = false; noteEl.focus(); return; } /* 코멘트 최소 10자 필수 */
          finish({ note: v, reveal: reveal });
        }
        noteOverlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });

        var revBtn = noteOverlay.querySelector('#modal-ok-reveal');
        if (revBtn) revBtn.addEventListener('click', function () { submit(true); });
        noteOverlay.addEventListener('click', function (e) { if (e.target === noteOverlay) finish(null); });
      }).then(function (result) {
        if (!result) return;
        /* 대화 신청은 번호를 공유하지 않음 — 수락되면 앱 내 채팅으로만 대화 */
        var req = {

        /* 주선자가 친구 대신 보내는 요청이면 표시 → 받는 사람에게 안내, 채팅서 발신 주체 구분 */
        if (fromEntry.managedBy && fromEntry.managedBy === currentUser.id && !fromEntry.ownerSelf && isMatchmakerEntry(myAuthEntry(state))) req.viaMm = true;
        if (isPhoto && result.reveal) req.fromRevealed = true; /* 요청과 동시에 내 사진 미리 공개 */
        return stateRef.update({

        }).then(function () {

  function handleApprove(id) {

  /* 관리자: 신청 보류 (사유 남김). 신청자는 로그인 가능·메시지함에 사유 표시, 명단엔 미등록 */

  /* 관리자: 승인된 회원 관리 — 보류(명단 내림, 되돌릴 수 있음) 또는 완전 삭제 선택 */

  /* 관리자: 승인 회원을 보류로 되돌림 (entries → pendingEntries, heldReason). 재승인 시 고유번호 유지 */

  /* 반려 후 하루 지난 신청은 자동 정리 (관리자 화면에서만 실행) */
  var _purgingRej = false;
  function purgeExpiredRejections(state) {
    if (!isAdminUnlocked || _purgingRej) return;
    var cutoff = Date.now() - 24 * 3600000;
    var expired = (state.pendingEntries || []).filter(function (e) { return e.rejectedAt && new Date(e.rejectedAt).getTime() < cutoff; });
    if (!expired.length) return;
    _purgingRej = true;
    db.runTransaction(function (tx) {
      return tx.get(stateRef).then(function (doc) {
        var s = doc.data();
        var keep = (s.pendingEntries || []).filter(function (e) { return !(e.rejectedAt && new Date(e.rejectedAt).getTime() < cutoff); });
        if (keep.length === (s.pendingEntries || []).length) return;
        tx.update(stateRef, { pendingEntries: keep });
      });
    }).then(function () {
      expired.forEach(function (e) { photosRef.doc(e.id).delete().catch(function () {}); });
      _purgingRej = false;
    }).catch(function () { _purgingRej = false; });
  }
  function handleApproveRequest(id) {
    var state = currentState;
    var req = (state.dateRequests || []).find(function (r) { return r.id === id; });
    if (!req) return;
    var reqType = req.type || 'contact';
    modalMessage('요청 승인 (관리자)', '신청자에게 전달할 답장을 남길 수 있어요.', '승인', 'approve').then(function (replyMsg) {
      if (replyMsg === null) return;
      if (reqType === 'photo') {
        db.runTransaction(function (tx) {
          return tx.get(stateRef).then(function (doc) {
            var s = doc.data();
            var reqs = (s.dateRequests || []).map(function (r) {
              if (r.id === id) {
                var copy = JSON.parse(JSON.stringify(r));
                copy.approved = true; copy.held = false;
                if (replyMsg) copy.approveMessage = replyMsg;
                return copy;
              }
              return r;
            });
            tx.update(stateRef, { dateRequests: reqs });
          });
        }).then(function () {
          appendLog('admin', '관리자', '사진 요청 승인');
          return refreshNow();
        }).catch(function (err) {
          modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));
        });
        return;
      }
      var fromEntry = (state.entries || []).find(function (e) { return e.id === req.fromId; });
      var toEntry = (state.entries || []).find(function (e) { return e.id === req.toId; });
      var decryptPromises = [];
      if (fromEntry && fromEntry.contactEnc && adminPrivateKey) {
        decryptPromises.push(decryptWithAdmin(adminPrivateKey, fromEntry.contactEnc).catch(function () { return ''; }));
      } else { decryptPromises.push(Promise.resolve('')); }
      if (toEntry && toEntry.contactEnc && adminPrivateKey) {
        decryptPromises.push(decryptWithAdmin(adminPrivateKey, toEntry.contactEnc).catch(function () { return ''; }));
      } else { decryptPromises.push(Promise.resolve('')); }
      Promise.all(decryptPromises).then(function (contacts) {
        return db.runTransaction(function (tx) {
          return tx.get(stateRef).then(function (doc) {
            var s = doc.data();
            var reqs = (s.dateRequests || []).map(function (r) {
              if (r.id === id) {
                var copy = JSON.parse(JSON.stringify(r));
                copy.approved = true; copy.held = false;
                copy.revealedContact = { from: contacts[0], to: contacts[1] };
                if (replyMsg) copy.approveMessage = replyMsg;
                return copy;
              }
              return r;
            });
            tx.update(stateRef, { dateRequests: reqs });
          });
        });
      }).then(function () {
        appendLog('admin', '관리자', '대화 신청 수락');
        return refreshNow();
      }).catch(function (err) {
        modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));
      });
    });
  }

  /* viewerId 가 targetId 의 사진을 볼 수 있는가:
     (1) 내가 보낸 사진 요청을 상대가 승인, 또는 (2) 상대가 나에게 자기 사진을 직접 공개(fromRevealed) */
  function canViewPhotoOf(state, viewerId, targetId) {
    return (state.dateRequests || []).some(function (req) {
      if ((req.type || 'contact') !== 'photo') return false;
      /* 승인된 사진 요청은 양방향 상호 공개 (요청자·수신자 모두 서로 사진을 봄) — "보고 튀기" 방지 */
      if (req.approved && ((req.fromId === viewerId && req.toId === targetId) || (req.fromId === targetId && req.toId === viewerId))) return true;

  /* 보류/거절된 보낸 요청을, 상대 피드백을 보고 정보를 담아 다시 요청 */
  function handleReapplyRequest(id) {
    var state = currentState;
    var me = findMyEntry(state);
    if (!me) return modalNotice('로그인 필요', '먼저 로그인해주세요.');
    var req = (state.dateRequests || []).find(function (r) { return r.id === id; });
    if (!req || req.fromId !== me.id) return;
    var st = reqStatus(req);
    if (st !== 'held' && st !== 'rejected') return;
    var isPhoto = (req.type || 'contact') === 'photo';
    var to = (state.entries || []).find(function (e) { return e.id === req.toId; });
    var toName = to ? to.nickname : '상대방';
    var feedback = st === 'held' ? (req.holdMessage || '') : (req.rejectMessage || '');
    var feedbackHtml = feedback
      ? '<div class="mine-note" style="background:var(--gold-soft);color:var(--ink);">' + escapeHtml(toName) + '님의 메시지<br>"' + escapeHtml(feedback) + '"</div>'
      : '<div class="mine-note">' + escapeHtml(toName) + '님이 남긴 메시지는 없어요.</div>';
    var overlay = openModal(
      '<h3>다시 요청하기</h3>' +
      '<p class="modal-msg">' + escapeHtml(toName) + '님에게 ' + (isPhoto ? '사진' : '번호') + ' 요청을 다시 보내요. 상대가 궁금해한 정보를 담아주세요.</p>' +
      feedbackHtml +
      '<textarea class="modal-input" id="reapply-note" rows="3" maxlength="200" placeholder="예: 직장은 강남 ○○회사 다니고 있어요! 다시 요청드려요" style="margin-top:8px;">' + escapeHtml(reqNote(req) || '') + '</textarea>' +
      '<div class="modal-actions">' +
        '<button type="button" class="card-btn" id="modal-cancel">취소</button>' +
        '<button type="button" class="card-btn primary" id="modal-ok">다시 요청</button>' +
      '</div>'
    );
    new Promise(function (resolve) {
      function finish(v) { closeModal(overlay); resolve(v); }
      overlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });
      overlay.querySelector('#modal-ok').addEventListener('click', function () { finish(overlay.querySelector('#reapply-note').value.trim()); });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(null); });
    }).then(function (note) {
      if (note === null || note === undefined) return;
      return db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var reqs = (s.dateRequests || []).map(function (r) {
            if (r.id !== id) return r;
            var c = JSON.parse(JSON.stringify(r));
            c.note = note || '';
            /* 대기 상태로 초기화 (이전 보류/거절/답장 흔적 제거) */
            delete c.held; delete c.holdMessage; delete c.heldBy;
            delete c.rejected; delete c.rejectMessage; delete c.rejectedBy;
            delete c.approved; delete c.userApproved; delete c.approveMessage;
            delete c.decidedAt; delete c.revealedContact; delete c.toContact;
            c.submittedAt = new Date().toISOString();
            c.reappliedAt = new Date().toISOString();
            return c;
          });
          tx.update(stateRef, { dateRequests: reqs });
        });
      }).then(function () {
        appendLog('request', me.nickname, (isPhoto ? '사진' : '번호') + ' 요청 재신청 → ' + toName);
        notifyAdmin('요청 재신청', me.nickname + '님이 ' + toName + '님에게 다시 요청했어요.');
        return refreshNow();
      }).then(function () {
        modalNotice('다시 요청 완료', escapeHtml(toName) + '님에게 다시 요청했어요! 상대가 확인하면 결정해 줄 거예요.');
      }).catch(function (err) {
        modalNotice('오류', '다시 요청에 실패했어요: ' + (err.message || err));
      });
    });
  }

  /* 개인이 자기 목록에서 승인/거절된 내역 삭제 (내 화면에서만 숨김,
     양쪽 다 숨기면 완전 삭제) */
  function handleHideRequest(id) {
    var state = currentState;
    var me = findMyEntry(state);
    if (!me) return modalNotice('로그인 필요', '먼저 로그인해주세요.');
    var req = (state.dateRequests || []).find(function (r) { return r.id === id; });
    if (!req || (req.fromId !== me.id && req.toId !== me.id)) return;
    modalConfirm('내역 삭제', '이 내역을 목록에서 삭제할까요?').then(function (ok) {
      if (!ok) return;
      /* 즉시 화면에서 숨김 (서버 재조회 전에 바로 사라지게) */
      try {
        (currentState.dateRequests || []).forEach(function (r) {
          if (r.id === id) { r.hiddenBy = r.hiddenBy || []; if (r.hiddenBy.indexOf(me.id) < 0) r.hiddenBy.push(me.id); }
        });
        paint(currentState);
      } catch (e) {}
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var reqs = [];
          (s.dateRequests || []).forEach(function (r) {
            if (r.id !== id) { reqs.push(r); return; }
            var c = JSON.parse(JSON.stringify(r));
            var hidden = c.hiddenBy || [];
            if (hidden.indexOf(me.id) < 0) hidden.push(me.id);
            c.hiddenBy = hidden;
            /* 개인 삭제는 본인 화면에서만 숨김 — 기록은 항상 유지 (관리자만 완전 삭제 가능) */
            reqs.push(c);
          });
          tx.update(stateRef, { dateRequests: reqs });
        });
      }).then(function () {
        return refreshNow();
      }).catch(function (err) {
        modalNotice('오류', '삭제에 실패했어요: ' + (err.message || err));
      });
    });
  }

  /* 관리자 삭제 = 완전 삭제 (모두에게서 제거) */
  function handleDeleteRequest(id) {
    modalConfirm('요청 삭제', '이 요청을 완전히 삭제할까요? 당사자들의 기록에서도 사라져요.', '완전 삭제').then(function (ok) {
      if (!ok) return;
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var reqs = (s.dateRequests || []).filter(function (r) { return r.id !== id; });
          tx.update(stateRef, { dateRequests: reqs });
        });
      }).then(function () {
        appendLog('admin', '관리자', '요청 삭제');
        return refreshNow();
      }).catch(function (err) {
        modalNotice('오류', '삭제에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleRevealPhoto(id) {
    /* 권한이 있으면 저화질 썸네일 블러를 벗기는 중간 단계 없이 곧바로 원본(전체 해상도) 갤러리를 연다.
       → 40px 저해상도 썸네일이 잠깐 드러나는 어색함 없음 */
    if (isAdminUnlocked) { handleGallery(id); return; }
    var state = currentState;
    requireLogin().then(function (myEntry) {
      if (!myEntry) return;
      if (myEntry.id === id || canViewPhotoOf(state, myEntry.id, id)) {
        handleGallery(id);
      } else {
        modalNotice('안내', '사진 보기 요청을 보내고 상대방의 승인을 받아야 해요.');
      }
    });
  }

  function openGallery(photos, startIdx) {
    var idx = startIdx || 0;
    var overlay = document.createElement('div');
    overlay.className = 'gallery-overlay';
    function render() {
      var html = '<img class="gallery-img" src="' + photos[idx] + '" alt="사진 ' + (idx + 1) + '">';
      if (photos.length > 1) {
        html += '<div class="gallery-counter">' + (idx + 1) + ' / ' + photos.length + '</div>';
        html += '<button class="gallery-nav gallery-nav--prev" id="gal-prev">&#8249;</button>';
        html += '<button class="gallery-nav gallery-nav--next" id="gal-next">&#8250;</button>';
      }
      html += '<button class="gallery-close" id="gal-close">&times;</button>';
      overlay.innerHTML = html;
    }
    render();
    document.body.appendChild(overlay);
    function closeGallery() {
      if (!overlay.parentNode) return;
      overlay.remove();
      popOverlay(overlay);
    }
    pushOverlay(overlay, closeGallery);
    overlay.addEventListener('click', function (e) {
      if (e.target.id === 'gal-prev') { idx = (idx - 1 + photos.length) % photos.length; render(); return; }
      if (e.target.id === 'gal-next') { idx = (idx + 1) % photos.length; render(); return; }
      if (e.target.id === 'gal-close' || e.target === overlay) { closeGallery(); return; }
    });
    overlay.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeGallery();
      if (e.key === 'ArrowLeft' && photos.length > 1) { idx = (idx - 1 + photos.length) % photos.length; render(); }
      if (e.key === 'ArrowRight' && photos.length > 1) { idx = (idx + 1) % photos.length; render(); }
    });
    overlay.setAttribute('tabindex', '0');
    overlay.focus();
  }

  function handleGallery(id) {
    var state = currentState;
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    loadPhotos(entry).then(function (photos) {
      if (!photos.length) return;
      openGallery(photos, 0);
    });
  }

  function handleRevealContact(id) {
    var state = currentState;
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    requireLogin().then(function (myEntry) {
      if (!myEntry) return;
      var matchReqs = (state.dateRequests || []).filter(function (req) {
        return req.approved && (req.type || 'contact') === 'contact' && (req.fromId === id || req.toId === id);
      });
      var match = matchReqs.find(function (req) {
        return (req.fromId === myEntry.id && req.toId === id) || (req.toId === myEntry.id && req.fromId === id);
      });
      if (!match) return modalNotice('안내', '승인된 번호 요청이 없어요. "메시지함" 탭에서 상태를 확인해보세요.');
      var otherIsRequester = match.fromId === id;
      var contact = match.revealedContact
        ? (otherIsRequester ? match.revealedContact.from : match.revealedContact.to)
        : (otherIsRequester ? match.fromContact : match.toContact);
      if (!contact) return modalNotice('안내', '연락처 정보가 아직 없어요.');
      modalNotice('연락처', escapeHtml(entry.nickname) + '님의 연락처: ' + escapeHtml(contact));
    });
  }

  /* 관리자가 회원 PIN을 새로 재설정 (원본 열람 불가한 기존 회원용) */
  function handleAdminResetPin(id) {
    if (!isAdminUnlocked || !adminPrivateKey) return modalNotice('안내', '관리자 모드에서만 가능해요.');
    var entry = (currentState.entries || []).find(function (e) { return e.id === id; });
    if (!entry) return;
    modalNumericPinSetup('PIN 재설정', escapeHtml(entry.nickname) + '님에게 새로 부여할 PIN을 입력해주세요.').then(function (r) {
      if (!r) return;
      if (!/^[0-9]{4,8}$/.test(r.p1)) return modalNotice('입력 오류', 'PIN은 숫자 4~8자리예요.');
      if (r.p1 !== r.p2) return modalNotice('오류', 'PIN이 일치하지 않아요.');
      var contactP = entry.contactEnc ? decryptWithAdmin(adminPrivateKey, entry.contactEnc).catch(function () { return null; }) : Promise.resolve(null);
      contactP.then(function (contact) {
        return Promise.all([
          makePinAuth(r.p1),
          contact ? encryptForSelf(r.p1, contact) : Promise.resolve(null)
        ]).then(function (res) {
          return db.runTransaction(function (tx) {
            return tx.get(stateRef).then(function (doc) {
              var s = doc.data();
              var entries = (s.entries || []).map(function (e) {
                if (e.id !== id) return e;
                var c = JSON.parse(JSON.stringify(e));
                c.pinAuth = res[0];
                delete c.pinHash;
                delete c.pinEnc;
                if (res[1]) c.contactSelfEnc = res[1];
                return c;
              });
              tx.update(stateRef, { entries: entries });
            });
          });
        });
      }).then(function () {
        appendLog('admin', '관리자', 'PIN 재설정 · ' + entry.nickname);
        return refreshNow();
      }).then(function () {
        modalNotice('완료', entry.nickname + '님의 새 PIN은 ' + r.p1 + ' 입니다. 회원에게 알려주세요.');
      }).catch(function (err) {
        modalNotice('오류', '재설정에 실패했어요: ' + (err.message || err));
      });
    });
  }
