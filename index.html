        '<span class="count" title="요청">요청 ' + reqCount + '</span>' +
        '<span class="count' + (msgUnread >= 1 ? ' blink' : '') + '" title="안 읽은 Q&A">Q&A ' + msgUnread + '</span></button>';
    }
    /* 주선자 프로필 전환 바: 주선자 계정이거나 대리 프로필이 1개 이상일 때 표시 (주선자는 sub 없어도 항상 보임) */
    var switcher = '';
    if (currentUser) {
      var mySubs = entriesManagedByMe(state);
      var meSelfAny = (state.entries || []).concat(state.pendingEntries || []).find(function (e) { return e.id === currentUser.id; });
      var iAmMM = isMatchmakerEntry(meSelfAny);
      if (mySubs.length || iAmMM) {
        var selfActive = !actingAs || actingAs === currentUser.id;
        var selfSuffix = iAmMM ? ' (주선자)' : ' (나)';
        var chips = '<button type="button" class="pf-switch-chip' + (selfActive ? ' active' : '') + '" data-action="switch-profile" data-id="' + escapeHtml(currentUser.id) + '">' + escapeHtml(currentUser.nickname) + selfSuffix + '</button>';
        chips += mySubs.map(function (s) {
          var on = actingAs === s.id;
          return '<button type="button" class="pf-switch-chip' + (on ? ' active' : '') + '" data-action="switch-profile" data-id="' + escapeHtml(s.id) + '">🤝 ' + escapeHtml(s.nickname) + '</button>';
        }).join('');
        chips += '<button type="button" class="pf-switch-chip pf-switch-add" data-action="switch-add">＋ 친구 소개</button>';
        switcher = '<div class="profile-switch"><span class="ps-label">🔄 활동 중 프로필</span><div class="ps-chips">' + chips + '</div></div>';
      }
    }
    var panel;
    if (activeTab === 'list') panel = renderList(state);
    else if (activeTab === 'mine' && currentUser) panel = renderMine(state);
    else if (activeTab === 'admin' && isAdminUnlocked) panel = renderAdmin(state);
    else panel = renderForm(state);
    return (
      '<div class="masthead"><div class="masthead-inner">' +
        '<div class="masthead-icon">' + ICON_HEART + '</div>' +
        '<div><h1 id="masthead-title" title="새로고침" style="cursor:pointer;">소개장터</h1><p>관리자 주변 사람들 중심으로 시작한, 서로를 소개하는 작은 장터예요.</p></div>' +
      '</div>' +
      '<div class="admin-bar">' +
        '<div class="admin-bar-row">' +
          '<button type="button" class="admin-link" id="copy-url">&#128279; URL 복사</button>' +
          '<button type="button" class="admin-link" id="show-notice">&#128227; 공지사항</button>' +
          '<button type="button" class="admin-link" id="feedback-btn">&#128172; Q&amp;A</button>' +
        '</div>' +
        (NOTIF_ENABLED
          ? '<div class="admin-bar-row">' +
              (isStandalone() ? '' : '<button type="button" class="admin-link" id="add-home">&#128241; 홈 화면에 추가</button>') +
              '<button type="button" class="admin-link' + (notifOn() ? ' unlocked' : '') + '" id="notif-toggle">' +
                (notifOn() ? '&#128276; 알림 켜짐' : '&#128276; 알림 켜기') + '</button>' +
              '<button type="button" class="admin-link" id="notif-help">&#128214; 알림 켜는 법</button>' +
            '</div>'
          : '') +
        '<div class="admin-bar-row">' +
          (currentUser
            ? '<button type="button" class="admin-link unlocked" id="user-logout">' + ICON_UNLOCK + ' ' + escapeHtml(currentUser.nickname) + ' · 로그아웃</button>'
            : '<button type="button" class="admin-link" id="user-login">' + ICON_LOCK + ' 로그인</button>') +
          '<button type="button" class="admin-link' + (isAdminUnlocked ? ' unlocked' : '') + '" id="admin-toggle">' +
            (isAdminUnlocked ? ICON_UNLOCK + ' 관리자 모드' : ICON_LOCK + ' 관리자') +
          '</button>' +
        '</div>' +
      '</div></div>' +
      '<div class="notice-bar">' +
        '<span class="notice-icon">&#128227;</span> 요청이 오거나 승인·거절되면 알림으로 바로 알려드려요. 위 <b>&#128276; 알림 켜기</b> 를 눌러 켜보세요! (켜는 법은 <b>&#128214; 알림 켜는 법</b>)' +
      '</div>' +
      '<div class="page">' +
        '<div class="tabs" role="tablist">' + tabs + '</div>' +
        switcher +
        '<div id="tab-panel">' + panel + '</div>' +
      '</div>'
    );
  }

  /* ---- state & paint ---- */
  function paint(state) {
    currentState = state;
    document.getElementById('app').innerHTML = renderApp(state);
    try {
      var items = document.querySelectorAll('.admin-msg-item');
      for (var i = 0; i < items.length; i++) {
        if (openMsgFolds[items[i].getAttribute('data-eid')]) items[i].open = true;
      }
    } catch (e) {}
    try { applyLogFilter(); } catch (e) {} /* 활동기록 필터 재적용 */
    try { updateCharCounts(); } catch (e) {} /* 자기소개 등 글자수 카운터 */
    maybeRestoreDraft();
  }

  /* 신청서를 작성 중이면(포커스/입력/사진 있음) 배경 갱신으로 화면을 다시 그리지 않음
     — 다른 사람 활동으로 인한 실시간 갱신이 입력 중인 폼을 지우는 문제 방지 */
  function isEditingForm() {
    if (activeTab !== 'form') return false;
    var form = document.getElementById('entry-form');
    if (!form) return false;
    if (form.contains(document.activeElement)) return true;
    if (photoDataUrls && photoDataUrls.length) return true;
    var fields = form.querySelectorAll('input, textarea, select');
    for (var i = 0; i < fields.length; i++) {
      var el = fields[i];
      if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) return true; }
      else if ((el.value || '').trim()) return true;
    }
    return false;
  }

  /* ---- 신청서 임시 저장 (새로고침/이동/오류로도 안 날아가게) ---- */
  var DRAFT_KEY = 'form-draft-v1';
  function saveDraft() {
    if (editingEntryId || proxyRegisterMode) return; /* 신규 본인 작성만 (수정·대리등록 제외) */
    var form = document.getElementById('entry-form');
    if (!form) return;
    try {
      var g = function (n) { var el = form.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
      var radio = function (n) { var el = form.querySelector('[name="' + n + '"]:checked'); return el ? el.value : ''; };
      var draft = {
        nickname: g('nickname'), realName: g('realName'), contact: g('contact'),
        gender: radio('gender'), birthYear: g('birthYear'), region: g('region'),
        workplace: g('workplace'), referrerText: g('referrerText'), degreeChoice: radio('degreeChoice'),
        height: g('height'), intro: g('intro'), idealType: g('idealType'), dealbreaker: g('dealbreaker'),
        photos: (photoDataUrls || []).slice(), savedAt: Date.now()
      };
      /* PIN은 민감정보라 저장하지 않음 */
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    } catch (e) {}
  }
  function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  function draftHasContent(d) {
    return !!(d && (d.nickname || d.realName || d.contact || d.region || d.workplace ||
      d.intro || d.idealType || d.dealbreaker || d.height || d.birthYear ||
      d.gender || d.degreeChoice || (d.photos && d.photos.length)));
  }
  function maybeRestoreDraft() {
    if (editingEntryId || proxyRegisterMode) return;
    var form = document.getElementById('entry-form');
    if (!form) return;
    var nick = form.querySelector('[name="nickname"]');
    if (!nick || nick.value) return; /* 이미 채워져 있으면 건드리지 않음 */
    var d = loadDraft();
    if (!draftHasContent(d)) return;
    var setVal = function (n, v) { var el = form.querySelector('[name="' + n + '"]'); if (el && v) el.value = v; };
    setVal('nickname', d.nickname); setVal('realName', d.realName); setVal('contact', d.contact);
    setVal('birthYear', d.birthYear); setVal('region', d.region); setVal('workplace', d.workplace);
    setVal('referrerText', d.referrerText); setVal('height', d.height);
    setVal('intro', d.intro); setVal('idealType', d.idealType); setVal('dealbreaker', d.dealbreaker);
    if (d.gender) { var gr = form.querySelector('[name="gender"][value="' + d.gender + '"]'); if (gr) gr.checked = true; }
    if (d.degreeChoice) { var dr = form.querySelector('[name="degreeChoice"][value="' + d.degreeChoice + '"]'); if (dr) dr.checked = true; }
    if (d.photos && d.photos.length) { photoDataUrls = d.photos.slice(); renderPhotoThumbs(); }
    var lede = form.parentNode.querySelector('.form-lede');
    if (lede && !document.getElementById('draft-restored-note')) {
      var note = document.createElement('div');
      note.id = 'draft-restored-note';
      note.className = 'readonly-note';
      note.style.cssText = 'background:var(--gold-soft);border-color:var(--gold);margin-top:10px;';
      note.innerHTML = '&#128190; 작성 중이던 내용을 불러왔어요. <button type="button" class="card-btn" id="draft-clear" style="margin-left:8px;padding:4px 12px;">새로 쓰기</button>';
      lede.parentNode.insertBefore(note, lede.nextSibling);
    }
  }

  function saveState(state) {
    currentState = state;
    return stateRef.set(JSON.parse(JSON.stringify(state)));
  }

  function decryptAllAdminData(state) {
    if (!isAdminUnlocked || !adminPrivateKey) return Promise.resolve();
    var promises = [];
    (state.entries || []).forEach(function (entry) {
      if (entry.contactEnc && !decryptedContacts[entry.id]) {
        promises.push(decryptWithAdmin(adminPrivateKey, entry.contactEnc).then(function (v) { decryptedContacts[entry.id] = v; }).catch(function () {}));
      }
    });
    (state.dateRequests || []).forEach(function (req) {
      if (!decryptedRequests[req.id] && req.ciphertext) {
        promises.push(decryptWithAdmin(adminPrivateKey, { iv: req.iv, ciphertext: req.ciphertext, wrappedKey: req.wrappedKey }).then(function (v) { decryptedRequests[req.id] = v; }).catch(function () {}));
      }
    });
    return Promise.all(promises);
  }

  /* ---- event handlers ---- */
  function handleAdminToggle() {
    var state = currentState;
    if (isAdminUnlocked) {
      isAdminUnlocked = false;
      adminPrivateKey = null;
      decryptedContacts = {};
      decryptedRequests = {};
      clearAdminPin();
      if (activeTab === 'admin') activeTab = 'form';
      paint(state);
      return;
    }
    if (!state.adminAuth) {
      modalPinSetup().then(function (r) {
        if (!r) return;
        var pwErr = adminPwError(r.p1);
        if (pwErr) return modalNotice('오류', pwErr);
        if (r.p1 !== r.p2) return modalNotice('오류', '비밀번호가 일치하지 않아요.');
        setupAdminPin(r.p1).then(function (auth) {
          state.adminAuth = auth;
          return saveState(state).then(function () {
            return unlockAdminKey(r.p1, auth);
          });
        }).then(function (key) {
          adminPrivateKey = key;
          isAdminUnlocked = true; requestNotifPermission();
          saveAdminPin(r.p1);
          return decryptAllAdminData(state);
        }).then(function () {
          paint(state);
        });
      });
      return;
    }
    modalPin('관리자 인증', '비밀번호를 입력하세요.', { password: true }).then(function (pin) {
      if (!pin) return;
      unlockAdminKey(pin, state.adminAuth).then(function (key) {
        adminPrivateKey = key;
        isAdminUnlocked = true;
        saveAdminPin(pin);
        return decryptAllAdminData(state);
      }).then(function () {
        paint(state);
      }).catch(function () {
        modalNotice('오류', '비밀번호가 올바르지 않아요.');
      });
    });
  }

  function handleChangeAdminPw() {
    var state = currentState;
    if (!isAdminUnlocked || !adminPrivateKey || !state.adminAuth) {
      return modalNotice('안내', '관리자 모드에서만 변경할 수 있어요.');
    }
    modalPinSetup().then(function (r) {
      if (!r) return;
      var pwErr = adminPwError(r.p1);
      if (pwErr) return modalNotice('오류', pwErr);
      if (r.p1 !== r.p2) return modalNotice('오류', '비밀번호가 일치하지 않아요.');
      rewrapAdminKey(r.p1, state.adminAuth, adminPrivateKey).then(function (auth) {
        return stateRef.update({ adminAuth: auth }).then(function () {
          state.adminAuth = auth;
          saveAdminPin(r.p1);
          appendLog('admin', '관리자', '비밀번호 변경');
          modalNotice('완료', '관리자 비밀번호가 변경되었어요.');
        });
      }).catch(function (err) {
        modalNotice('오류', '변경에 실패했어요: ' + (err.message || err));
      });
    });
  }

  /* 숫자 PIN 설정 모달 (신규/확인) */
  function modalNumericPinSetup(title, message) {
    return new Promise(function (resolve) {
      var overlay = openModal(
        '<h3>' + escapeHtml(title) + '</h3>' +
        '<p class="modal-msg">' + escapeHtml(message) + '</p>' +
        '<input type="text" inputmode="numeric" class="modal-input" id="np1" data-numeric maxlength="8" placeholder="새 PIN (숫자 4~8자리)">' +
        '<input type="text" inputmode="numeric" class="modal-input" id="np2" data-numeric maxlength="8" placeholder="새 PIN 확인" style="margin-top:8px;">' +
        '<div class="modal-actions">' +
          '<button type="button" class="card-btn" id="modal-cancel">취소</button>' +
          '<button type="button" class="card-btn primary" id="modal-ok">변경</button>' +
        '</div>'
      );
      function finish(v) { closeModal(overlay); resolve(v); }
      overlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });
      overlay.querySelector('#modal-ok').addEventListener('click', function () {
        finish({ p1: overlay.querySelector('#np1').value.trim(), p2: overlay.querySelector('#np2').value.trim() });
      });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(null); });
    });
  }

  /* 로그인한 본인이 개인 PIN 변경 (연락처 자가암호화도 새 PIN으로 재암호화) */
  function handleChangeMyPin() {
    var me = findMyEntry(currentState);
    if (!me) return modalNotice('로그인 필요', '먼저 로그인해주세요.');
    modalNumericPinSetup('PIN 변경', '새로 사용할 개인 PIN을 입력해주세요.').then(function (r) {
      if (!r) return;
      if (!/^[0-9]{4,8}$/.test(r.p1)) return modalNotice('입력 오류', 'PIN은 숫자 4~8자리예요.');
      if (r.p1 !== r.p2) return modalNotice('오류', 'PIN이 일치하지 않아요.');
      myContact().then(function (contact) {
        return Promise.all([
          makePinAuth(r.p1),
          contact ? encryptForSelf(r.p1, contact) : Promise.resolve(null)
        ]).then(function (res) {
          var newAuth = res[0], newSelf = res[1];
          return db.runTransaction(function (tx) {
            return tx.get(stateRef).then(function (doc) {
              var s = doc.data();
              var entries = (s.entries || []).map(function (e) {
                if (e.id !== me.id) return e;
                var c = JSON.parse(JSON.stringify(e));
                c.pinAuth = newAuth;
                delete c.pinHash;
                delete c.pinEnc;
                if (newSelf) c.contactSelfEnc = newSelf;
                return c;
              });
              tx.update(stateRef, { entries: entries });
            });
          });
        });
      }).then(function () {
        currentUser.pin = r.p1; saveSession();
        appendLog('edit', me.nickname, 'PIN 변경');
        return refreshNow();
      }).then(function () {
        modalNotice('완료', 'PIN이 변경되었어요.');
      }).catch(function (err) {
        modalNotice('오류', '변경에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleFormSubmit() {
    if (formRole === 'mm-new' && !editingEntryId) { handleMatchmakerSubmit(); return; } /* 새 주선자 등록 */
    var state = currentState;
    if (!state.adminAuth) {
      modalNotice('안내', '관리자가 아직 PIN을 설정하지 않았어요. 관리자에게 문의해주세요.');
      return;
    }
    var form = document.getElementById('entry-form');
    var nickname = (form.querySelector('[name="nickname"]').value || '').trim();
    var realName = (form.querySelector('[name="realName"]').value || '').trim();
    var contact = (form.querySelector('[name="contact"]').value || '').trim();
    var genderEl = form.querySelector('[name="gender"]:checked');
    var gender = genderEl ? genderEl.value : '';
    var birthYear = parseInt(form.querySelector('[name="birthYear"]').value, 10);
    var region = (form.querySelector('[name="region"]').value || '').trim();
    var workplace = (form.querySelector('[name="workplace"]').value || '').trim();
    var referrerText = (form.querySelector('[name="referrerText"]').value || '').trim();
    var degreeEl = form.querySelector('[name="degreeChoice"]:checked');
    var degreeChoice = degreeEl ? degreeEl.value : '';
    var pin = (form.querySelector('[name="pin"]').value || '').trim();
    var height = (form.querySelector('[name="height"]').value || '').trim();
    var intro = (form.querySelector('[name="intro"]').value || '').trim();
    var idealType = (form.querySelector('[name="idealType"]').value || '').trim();
    var dealbreaker = (form.querySelector('[name="dealbreaker"]').value || '').trim();
    var blurPhoto = form.querySelector('#f-blur') ? form.querySelector('#f-blur').checked : false;

    var isEdit = !!editingEntryId;
    var proxy = proxyRegisterMode && !isEdit; /* 친구 대신 소개(대리 등록) */
    var origEntry = isEdit ? (state.entries || []).find(function (e) { return e.id === editingEntryId; }) : null;

    var missing = [];
    if (!nickname) missing.push('닉네임');
    if (!gender) missing.push('성별');
    if (!birthYear) missing.push('생년');
    if (!height) missing.push('키');
    if (!region) missing.push('사는 곳');
    if (!workplace) missing.push('직장 위치');
    if (!isEdit) {
      if (!realName) missing.push('실명');
      if (!contact) missing.push('전화번호');
      if (!proxy && !referrerText) missing.push('소개자'); /* 대리 등록은 소개자 선택 */
      if (!proxy && !pin && !currentUser) missing.push('개인 PIN'); /* 로그인 상태면 기존 PIN 재사용 가능 */
      if (intro.length < 20) missing.push('자기소개(20자 이상)');
      if (idealType.length < 20) missing.push('원하는 이성 조건(20자 이상)');
      if (dealbreaker.length < 20) missing.push('피하고 싶은 조건(20자 이상)');
    }
    if (missing.length > 0) {
      modalNotice('입력 오류', '다음 항목을 채워주세요: ' + missing.join(', '));
      return;
    }
    if (proxy && !(currentUser && currentUser.id)) {
      modalNotice('로그인 필요', '친구 대신 소개하려면 먼저 로그인해주세요.');
      return;
    }
    if (!isEdit) {
      var consent = document.getElementById('f-consent');
      if (!consent || !consent.checked) {
        modalNotice('동의 필요', proxy ? '소개 대상 본인의 등록 동의를 확인해 주세요.' : '개인정보 수집 및 이용에 동의해 주세요.');
        return;
      }
    }
    if (proxy && !referrerText) referrerText = '주선자: ' + ((currentUser && currentUser.nickname) || '');
    if (!isEdit && !proxy && !pin && currentUser && currentUser.pin) pin = currentUser.pin; /* 로그인 상태 본인 프로필: 기존 PIN 그대로 사용 */
    if (pin && pin.length < 4) {
      modalNotice('입력 오류', 'PIN은 4자리 이상이어야 해요.');
      return;
    }
    if (contact && !/^01[0-9]{8,9}$/.test(contact)) {
      modalNotice('입력 오류', '전화번호는 01012345678 형식으로 입력해주세요.');
      return;
    }
    /* 닉네임 중복 확인 (본인 제외) */
    var nickLower = nickname.toLowerCase();
    var dup = (state.entries || []).concat(state.pendingEntries || []).some(function (e) {
      return e.id !== editingEntryId && (e.nickname || '').trim().toLowerCase() === nickLower;
    });
    if (dup) {
      modalNotice('닉네임 중복', '이미 사용 중인 닉네임이에요. 다른 닉네임을 사용해주세요.');
      return;
    }
    if (isEdit && !formPhotosReady) {
      modalNotice('안내', '사진을 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }

    var btn = document.getElementById('submit-btn');
    var msg = document.getElementById('status-msg');
    btn.disabled = true;
    msg.textContent = isEdit ? '수정 중...' : '제출 중...';
    msg.className = 'status-msg';

    var pubJwk = state.adminAuth.publicKeyJwk;
    var entryId = (isEdit && origEntry) ? origEntry.id : genId();
    var finalPhotos = photoDataUrls.slice();

    var selfPin = pin || (currentUser && currentUser.id === entryId ? currentUser.pin : null);
    if (proxy && currentUser) selfPin = currentUser.pin; /* 대리 프로필 번호를 주선자 PIN으로 암호화 → sub 전환 시 번호 사용 가능 */
    var encPromises = [
      realName ? encryptForAdmin(pubJwk, realName) : Promise.resolve(null),
      contact ? encryptForAdmin(pubJwk, contact) : Promise.resolve(null),
      referrerText ? encryptForAdmin(pubJwk, referrerText) : Promise.resolve(null),
      pin ? makePinAuth(pin) : Promise.resolve(null),
      (contact && selfPin) ? encryptForSelf(selfPin, contact) : Promise.resolve(null),
      finalPhotos.length ? resizeDataUrl(finalPhotos[0], THUMB_MAX, THUMB_MAX, THUMB_Q) : Promise.resolve(null)
    ];
    Promise.all(encPromises).then(function (results) {
      var thumb = results[5] || null;
      /* 원본 사진은 photos/{id} 별도 문서로 저장 (app/state는 썸네일만) */
      var photoWrite;
      if (finalPhotos.length) photoWrite = photosRef.doc(entryId).set({ photos: finalPhotos });
      else if (isEdit) photoWrite = photosRef.doc(entryId).delete().catch(function () {});
      else photoWrite = Promise.resolve();
      return photoWrite.then(function () {
        photoCache[entryId] = finalPhotos;
        if (isEdit && origEntry) {
          return db.runTransaction(function (tx) {
            return tx.get(stateRef).then(function (doc) {
              var s = doc.data();
              var newEntries = (s.entries || []).map(function (e) {
                if (e.id !== editingEntryId) return e;
                /* 최신 저장본을 복사한 뒤 바뀐 항목만 덮어씀 → 다른(최신) 버전이 추가한 필드도 보존 */
                var u = JSON.parse(JSON.stringify(e));
                u.nickname = nickname;
                u.gender = gender;
                u.birthYear = birthYear;
                u.region = region;
                u.workplace = workplace;
                u.photoThumb = thumb;
                u.photoCount = finalPhotos.length;
                u.blurPhoto = blurPhoto && finalPhotos.length > 0;
                u.height = height;
                u.intro = intro;
                u.idealType = idealType;
                u.dealbreaker = dealbreaker;
                u.degreeChoice = degreeChoice;
                /* 비운 항목은 기존 값 유지, 새로 입력한 항목만 덮어씀 */
                if (results[0]) u.realNameEnc = results[0];
                if (results[1]) u.contactEnc = results[1];
                if (results[2]) u.referrerEnc = results[2];
                if (results[4]) u.contactSelfEnc = results[4];
                /* PIN: 새로 입력했으면 신형(pinAuth)으로 교체, 아니면 기존 형식 유지 */
                if (results[3]) { u.pinAuth = results[3]; delete u.pinHash; }
                return u;
              });
              tx.update(stateRef, { entries: newEntries });
            });
          });
        } else {
          var entry = {
            id: entryId,
            nickname: nickname,
            gender: gender,
            birthYear: birthYear,
            region: region,
            workplace: workplace,
            photoThumb: thumb,
            photoCount: finalPhotos.length,
            blurPhoto: blurPhoto && finalPhotos.length > 0,
            height: height,
            intro: intro,
            idealType: idealType,
            dealbreaker: dealbreaker,
            realNameEnc: results[0],
            contactEnc: results[1],
            referrerEnc: results[2],
            degreeChoice: degreeChoice,
            pinAuth: results[3],
            contactSelfEnc: results[4],
            submittedAt: new Date().toISOString()
          };
          if (proxy) {
            entry.managedBy = currentUser.id;      /* 이 프로필을 관리하는 주선자 */
            entry.isProxy = true;
            entry.proxyConsentAt = new Date().toISOString();
          }
          return stateRef.update({
            pendingEntries: firebase.firestore.FieldValue.arrayUnion(entry)
          });
        }
      });
    }).then(function () {
      photoDataUrls = [];
      if (isEdit) {
        editingEntryId = null;
        if (origEntry && origEntry.nickname !== nickname) appendLog('edit', nickname, '닉네임 변경: ' + origEntry.nickname + ' → ' + nickname);
        else appendLog('edit', nickname, '프로필 수정');
        notifyAdmin('프로필 수정', nickname + '님이 프로필을 수정했어요.');
        modalNotice('완료', '프로필이 수정되었어요.');
        activeTab = 'list';
        paint(currentState);
      } else if (proxy) {
        /* 대리 등록: 주선자는 로그인 유지, 새 프로필로 바꾸지 않음 */
        editingEntryId = null;
        proxyRegisterMode = false;
        var mgrNick = (currentUser && currentUser.nickname) || '주선자';
        appendLog('signup', mgrNick, '친구 대신 소개 신청: ' + nickname);
        notifyAdmin('새 신청서 📝 (대리)', mgrNick + '님이 ' + nickname + '님을 대신 소개했어요 (승인 대기).');
        modalNotice('접수 완료 🤝', nickname + '님을 대신 소개했어요! 관리자 승인 후 명단에 올라가요. 승인되면 상단 "🔄 활동 중 프로필"에서 그 친구로 전환해 요청을 대신 승인·관리할 수 있어요.');
        activeTab = 'mine';
        paint(currentState);
      } else {
        editingEntryId = null;
        clearDraft(); /* 제출 성공 → 임시저장 삭제 */
        currentUser = { id: entryId, nickname: nickname, pin: pin };
        saveSession();
        appendLog('signup', nickname, '신청서 제출');
        notifyAdmin('새 신청서 접수', nickname + '님이 신청서를 제출했어요! 승인 대기 중.');
        showStamp();
      }
    }).catch(function (err) {
      btn.disabled = false;
      msg.textContent = '오류가 발생했어요: ' + (err.message || err);
      msg.className = 'status-msg error';
    });
  }

  function showStamp() {
    var overlay = openModal(
      '<div style="text-align:center;">' +
        '<div class="stamp-ring" style="margin:0 auto 16px;">' + ICON_STAMP + '</div>' +
        '<h3>접수 완료!</h3>' +

    );

      closeModal(overlay);

      paint(currentState);

  }

  function handleEdit(id) {
    var state = currentState;
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    if (isAdminUnlocked) {
      startEditing(entry);
      return;
    }
    if (currentUser && currentUser.id === id) {
      startEditing(entry);
      return;
    }
    if (iManageTarget(state, id)) { /* 내가 소개한 대리(sub) 프로필은 PIN 없이 수정 가능 */
      startEditing(entry);
      return;
    }
    modalPin('본인 확인', '등록 시 설정한 개인 PIN을 입력하세요.').then(function (pin) {
      if (!pin) return;
      verifyPin(pin, entry).then(function (ok) {
        if (!ok) return modalNotice('오류', 'PIN이 올바르지 않아요.');
        maybeUpgradePin(entry, pin);
        startEditing(entry);
      });
    });
  }

  function startEditing(entry) {
    editingEntryId = entry.id;
    exampleTipDismissed = false; /* 수정 모드에서도 예시 카드 표시 */
    photoDataUrls = [];
    formPhotosReady = false;
    /* 원본 사진(고화질)을 photos/{id}에서 불러와 편집기에 채움 */
    loadPhotos(entry).then(function (arr) {
      photoDataUrls = (arr || []).slice();
      formPhotosReady = true;
      renderPhotoThumbs();
    });
    activeTab = 'form';
    paint(currentState);
    setTimeout(function () {
      var form = document.getElementById('entry-form');
      if (!form) return;
      var setVal = function (name, val) { var el = form.querySelector('[name="' + name + '"]'); if (el) el.value = val || ''; };
      setVal('nickname', entry.nickname);
      setVal('realName', '');
      setVal('contact', '');
      var genderRadio = form.querySelector('[name="gender"][value="' + entry.gender + '"]');
      if (genderRadio) genderRadio.checked = true;
      setVal('birthYear', entry.birthYear);
      setVal('region', entry.region);
      setVal('workplace', entry.workplace);
      setVal('referrerText', '');
      var degRadio = form.querySelector('[name="degreeChoice"][value="' + (entry.degreeChoice || '') + '"]');
      if (degRadio) degRadio.checked = true;
      setVal('height', entry.height || '');
      setVal('intro', entry.intro || '');
      setVal('idealType', entry.idealType || '');
      setVal('dealbreaker', entry.dealbreaker || '');
      var blurCheck = form.querySelector('#f-blur');
      if (blurCheck) blurCheck.checked = !!entry.blurPhoto;
      renderPhotoThumbs();
      updateCharCounts();
    }, 50);
  }

  function handleCancelRequest(toId) {
    var state = currentState;
    requireLogin().then(function (myEntry) {
      if (!myEntry) return;
      var req = (state.dateRequests || []).find(function (rq) {
        return rq.fromId === myEntry.id && rq.toId === toId && reqStatus(rq) === 'pending';
      });
      if (!req) return modalNotice('안내', '취소할 수 있는 요청이 없어요.');
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var newRequests = (s.dateRequests || []).filter(function (rq) { return rq.id !== req.id; });
          tx.update(stateRef, { dateRequests: newRequests });
        });
      }).then(function () {
        modalNotice('완료', '요청이 취소되었어요.');
      }).catch(function (err) {
        modalNotice('오류', '취소에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleDelete(id) {
    var state = currentState;
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    function doDelete() {
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var newEntries = (s.entries || []).filter(function (e) { return e.id !== id; });
          var newRequests = (s.dateRequests || []).filter(function (r) { return r.toId !== id; });
          tx.update(stateRef, { entries: newEntries, dateRequests: newRequests });
        });
      }).then(function () {
        photosRef.doc(id).delete().catch(function () {});
        delete photoCache[id];
        if (isAdminUnlocked) appendLog('admin', '관리자', '프로필 삭제 · ' + entry.nickname);
        else appendLog('edit', entry.nickname, '프로필 삭제 (본인)');
        modalNotice('완료', '명단에서 삭제되었어요.');
      }).catch(function (err) {
        modalNotice('오류', '삭제에 실패했어요: ' + (err.message || err));
      });
    }
    if (isAdminUnlocked) {
      modalConfirm('삭제', escapeHtml(entry.nickname) + '님을 명단에서 삭제할까요?').then(function (ok) {
        if (!ok) return;
        doDelete();
      });
      return;
    }
    modalPin('본인 확인', '등록 시 설정한 개인 PIN을 입력하세요.').then(function (pin) {
      if (!pin) return;
      verifyPin(pin, entry).then(function (ok) {
        if (!ok) return modalNotice('오류', 'PIN이 올바르지 않아요.');
        maybeUpgradePin(entry, pin);
        doDelete();
      }).catch(function (err) {
        modalNotice('오류', 'PIN 확인 중 오류가 발생했어요.');
      });
    });
  }

  function handleRequest(toId, type) {
    var state = currentState;
    if (!state.adminAuth) { modalNotice('안내', '관리자 설정이 아직 완료되지 않았어요.'); return; }
    var target = state.entries.find(function (e) { return e.id === toId; });
    if (!target) return;
    var isPhoto = type === 'photo';
    var typeLabel = isPhoto ? '사진 보기' : '번호 보기';
    requireLogin().then(function (fromEntry) {
      if (!fromEntry) return;
      if (isMatchmakerEntry(fromEntry)) {
        return modalNotice('프로필 선택 필요', '주선자 본인은 소개팅 요청을 보낼 수 없어요. 상단 "🔄 활동 중 프로필"에서 소개할 친구를 선택하거나, 먼저 소개할 친구(sub)를 등록해 주세요.');
      }
      if (fromEntry.id === toId) return modalNotice('안내', '본인에게는 요청할 수 없어요.');
      var existingReq = (state.dateRequests || []).find(function (req) {
        return req.fromId === fromEntry.id && req.toId === toId && (req.type || 'contact') === type &&
          (req.hiddenBy || []).indexOf(fromEntry.id) < 0;
      });
      if (existingReq) {
        var st = reqStatus(existingReq);
        if (st === 'rejected') return modalNotice('안내', escapeHtml(target.nickname) + '님이 이 요청을 거절했어요.');
        return modalNotice('안내', '이미 ' + escapeHtml(target.nickname) + '님에게 ' + typeLabel + ' 요청을 보냈어요. "메시지함" 탭에서 확인할 수 있어요.');
      }
      var icon = isPhoto ? '📷' : '📱';
      var noteOverlay = openModal(
        '<h3>' + icon + ' ' + escapeHtml(target.nickname) + '님 ' + typeLabel + ' 요청</h3>' +
        '<p class="modal-msg">상대방이 승인하면 확인할 수 있어요.</p>' +
        '<textarea class="modal-input" id="modal-note" rows="3" maxlength="200" placeholder="한 마디 남기기 (선택)"></textarea>' +
        '<div class="modal-actions">' +
          '<button type="button" class="card-btn" id="modal-cancel">취소</button>' +
          '<button type="button" class="card-btn primary" id="modal-ok">요청하기</button>' +
        '</div>'
      );
      new Promise(function (resolve) {
        function finish(val) { closeModal(noteOverlay); resolve(val); }
        noteOverlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });
        noteOverlay.querySelector('#modal-ok').addEventListener('click', function () {
          finish(noteOverlay.querySelector('#modal-note').value.trim());
        });
        noteOverlay.addEventListener('click', function (e) { if (e.target === noteOverlay) finish(null); });
      }).then(function (note) {
        if (note === null || note === undefined) return;
        /* 번호 요청이면 내 번호를 함께 담아둔다 (상대가 승인하면 서로 공개) */
        var contactPromise = isPhoto ? Promise.resolve(null) : ensureMyContact();
        return contactPromise.then(function (myNum) {
          if (!isPhoto && !myNum) return;
          var req = {
            id: genId(), type: type, fromId: fromEntry.id, toId: toId,
            note: note || '', submittedAt: new Date().toISOString()
          };
          if (myNum) req.fromContact = myNum;
          return stateRef.update({
            dateRequests: firebase.firestore.FieldValue.arrayUnion(req)
          }).then(function () {
            appendLog('request', fromEntry.nickname, typeLabel + ' 요청 → ' + target.nickname);
            notifyAdmin(typeLabel + ' 요청', fromEntry.nickname + '님이 ' + target.nickname + '님의 ' + typeLabel + '를 요청했어요!');
            return refreshNow();
          }).then(function () {
            modalNotice('요청 완료', target.nickname + '님에게 ' + typeLabel + ' 요청을 보냈어요! "메시지함" 탭에서 상태를 볼 수 있어요.');
          });
        });
      }).catch(function (err) {
        modalNotice('오류', '요청에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleApprove(id) {
    var pend = ((currentState && currentState.pendingEntries) || []).find(function (e) { return e.id === id; });
    var nick = pend ? pend.nickname : '';
    db.runTransaction(function (tx) {
      return tx.get(stateRef).then(function (doc) {
        var state = doc.data();
        var idx = (state.pendingEntries || []).findIndex(function (e) { return e.id === id; });
        if (idx < 0) return;
        var entry = state.pendingEntries.splice(idx, 1)[0];
        if (!entry.serial) entry.serial = nextSerial(state);
        var newEntries = (state.entries || []).concat([entry]);
        tx.update(stateRef, { pendingEntries: state.pendingEntries, entries: newEntries });
      });
    }).then(function () {
      appendLog('admin', '관리자', '신청 승인 · ' + nick);
      return refreshNow();
    }).catch(function (err) {
      modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));
    });
  }

  function handleReject(id) {
    var pend = ((currentState && currentState.pendingEntries) || []).find(function (e) { return e.id === id; });
    var nick = pend ? pend.nickname : '';
    db.runTransaction(function (tx) {
      return tx.get(stateRef).then(function (doc) {
        var state = doc.data();
        var newPending = (state.pendingEntries || []).filter(function (e) { return e.id !== id; });
        tx.update(stateRef, { pendingEntries: newPending });
      });
    }).then(function () {
      photosRef.doc(id).delete().catch(function () {});
      delete photoCache[id];
      appendLog('admin', '관리자', '신청 거절 · ' + nick);
      return refreshNow();
    }).catch(function (err) {
      modalNotice('오류', '거절에 실패했어요: ' + (err.message || err));
    });
  }

  function handleApproveRequest(id) {
    var state = currentState;
    var req = (state.dateRequests || []).find(function (r) { return r.id === id; });
    if (!req) return;
    var reqType = req.type || 'contact';
    modalMessage('요청 승인 (관리자)', '신청자에게 전달할 답장을 남길 수 있어요.', '승인', 'approve').then(function (replyMsg) {
      if (replyMsg === null) return;
      if (reqType === 'photo') {
        db.runTransaction(function (tx) {
          return tx.get(stateRef).then(function (doc) {
            var s = doc.data();
            var reqs = (s.dateRequests || []).map(function (r) {
              if (r.id === id) {
                var copy = JSON.parse(JSON.stringify(r));
                copy.approved = true; copy.held = false;
                if (replyMsg) copy.approveMessage = replyMsg;
                return copy;
              }
              return r;
            });
            tx.update(stateRef, { dateRequests: reqs });
          });
        }).then(function () {
          appendLog('admin', '관리자', '사진 요청 승인');
          return refreshNow();
        }).catch(function (err) {
          modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));
        });
        return;
      }
      var fromEntry = (state.entries || []).find(function (e) { return e.id === req.fromId; });
      var toEntry = (state.entries || []).find(function (e) { return e.id === req.toId; });
      var decryptPromises = [];
      if (fromEntry && fromEntry.contactEnc && adminPrivateKey) {
        decryptPromises.push(decryptWithAdmin(adminPrivateKey, fromEntry.contactEnc).catch(function () { return ''; }));
      } else { decryptPromises.push(Promise.resolve('')); }
      if (toEntry && toEntry.contactEnc && adminPrivateKey) {
        decryptPromises.push(decryptWithAdmin(adminPrivateKey, toEntry.contactEnc).catch(function () { return ''; }));
      } else { decryptPromises.push(Promise.resolve('')); }
      Promise.all(decryptPromises).then(function (contacts) {
        return db.runTransaction(function (tx) {
          return tx.get(stateRef).then(function (doc) {
            var s = doc.data();
            var reqs = (s.dateRequests || []).map(function (r) {
              if (r.id === id) {
                var copy = JSON.parse(JSON.stringify(r));
                copy.approved = true; copy.held = false;
                copy.revealedContact = { from: contacts[0], to: contacts[1] };
                if (replyMsg) copy.approveMessage = replyMsg;
                return copy;
              }
              return r;
            });
            tx.update(stateRef, { dateRequests: reqs });
          });
        });
      }).then(function () {
        appendLog('admin', '관리자', '번호 요청 승인');
        return refreshNow();
      }).catch(function (err) {
        modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleHoldRequest(id) {
    modalMessage('요청 보류 (관리자)', '신청자에게 전달할 메시지를 남길 수 있어요. 나중에 다시 승인/거절할 수 있어요.', '보류하기', 'primary').then(function (holdMsg) {
      if (holdMsg === null || holdMsg === undefined) return;
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var reqs = (s.dateRequests || []).map(function (r) {
            if (r.id !== id) return r;
            var c = JSON.parse(JSON.stringify(r));
            c.held = true;
            c.holdMessage = holdMsg || '';
            c.heldBy = 'admin';
            c.decidedAt = new Date().toISOString();
            return c;
          });
          tx.update(stateRef, { dateRequests: reqs });
        });
      }).then(function () {
        appendLog('admin', '관리자', '요청 보류');

    var toName = to ? to.nickname : '상대방';
    var feedback = st === 'held' ? (req.holdMessage || '') : (req.rejectMessage || '');
    var feedbackHtml = feedback
      ? '<div class="mine-note" style="background:var(--gold-soft);color:var(--ink);">' + escapeHtml(toName) + '님의 메시지<br>"' + escapeHtml(feedback) + '"</div>'
      : '<div class="mine-note">' + escapeHtml(toName) + '님이 남긴 메시지는 없어요.</div>';
    var overlay = openModal(
      '<h3>다시 요청하기</h3>' +
      '<p class="modal-msg">' + escapeHtml(toName) + '님에게 ' + (isPhoto ? '사진' : '번호') + ' 요청을 다시 보내요. 상대가 궁금해한 정보를 담아주세요.</p>' +
      feedbackHtml +
      '<textarea class="modal-input" id="reapply-note" rows="3" maxlength="200" placeholder="예: 직장은 강남 ○○회사 다니고 있어요! 다시 요청드려요" style="margin-top:8px;">' + escapeHtml(reqNote(req) || '') + '</textarea>' +
      '<div class="modal-actions">' +
        '<button type="button" class="card-btn" id="modal-cancel">취소</button>' +
        '<button type="button" class="card-btn primary" id="modal-ok">다시 요청</button>' +
      '</div>'
    );
    new Promise(function (resolve) {
      function finish(v) { closeModal(overlay); resolve(v); }
      overlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });
      overlay.querySelector('#modal-ok').addEventListener('click', function () { finish(overlay.querySelector('#reapply-note').value.trim()); });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(null); });
    }).then(function (note) {
      if (note === null || note === undefined) return;
      return db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var reqs = (s.dateRequests || []).map(function (r) {
            if (r.id !== id) return r;
            var c = JSON.parse(JSON.stringify(r));
            c.note = note || '';
            /* 대기 상태로 초기화 (이전 보류/거절/답장 흔적 제거) */
            delete c.held; delete c.holdMessage; delete c.heldBy;
            delete c.rejected; delete c.rejectMessage; delete c.rejectedBy;
            delete c.approved; delete c.userApproved; delete c.approveMessage;
            delete c.decidedAt; delete c.revealedContact; delete c.toContact;
            c.submittedAt = new Date().toISOString();
            c.reappliedAt = new Date().toISOString();
            return c;
          });
          tx.update(stateRef, { dateRequests: reqs });
        });
      }).then(function () {
        appendLog('request', me.nickname, (isPhoto ? '사진' : '번호') + ' 요청 재신청 → ' + toName);
        notifyAdmin('요청 재신청', me.nickname + '님이 ' + toName + '님에게 다시 요청했어요.');
        return refreshNow();
      }).then(function () {
        modalNotice('다시 요청 완료', escapeHtml(toName) + '님에게 다시 요청했어요! 상대가 확인하면 결정해 줄 거예요.');
      }).catch(function (err) {
        modalNotice('오류', '다시 요청에 실패했어요: ' + (err.message || err));
      });
    });
  }

  /* 개인이 자기 목록에서 승인/거절된 내역 삭제 (내 화면에서만 숨김,
     양쪽 다 숨기면 완전 삭제) */
  function handleHideRequest(id) {
    var state = currentState;
    var me = findMyEntry(state);
    if (!me) return modalNotice('로그인 필요', '먼저 로그인해주세요.');
    var req = (state.dateRequests || []).find(function (r) { return r.id === id; });
    if (!req || (req.fromId !== me.id && req.toId !== me.id)) return;
    modalConfirm('내역 삭제', '이 내역을 목록에서 삭제할까요?').then(function (ok) {
      if (!ok) return;
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var reqs = [];
          (s.dateRequests || []).forEach(function (r) {
            if (r.id !== id) { reqs.push(r); return; }
            var c = JSON.parse(JSON.stringify(r));
            var hidden = c.hiddenBy || [];
            if (hidden.indexOf(me.id) < 0) hidden.push(me.id);
            c.hiddenBy = hidden;
            /* 개인 삭제는 본인 화면에서만 숨김 — 기록은 항상 유지 (관리자만 완전 삭제 가능) */
            reqs.push(c);
          });
          tx.update(stateRef, { dateRequests: reqs });
        });
      }).then(function () {
        return refreshNow();
      }).catch(function (err) {
        modalNotice('오류', '삭제에 실패했어요: ' + (err.message || err));
      });
    });
  }

      if (!ok) return;
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {

          var reqs = (s.dateRequests || []).filter(function (r) { return r.id !== id; });
          tx.update(stateRef, { dateRequests: reqs });

  function openGallery(photos, startIdx) {
    var idx = startIdx || 0;
    var overlay = document.createElement('div');
    overlay.className = 'gallery-overlay';
    function render() {
      var html = '<img class="gallery-img" src="' + photos[idx] + '" alt="사진 ' + (idx + 1) + '">';
      if (photos.length > 1) {
        html += '<div class="gallery-counter">' + (idx + 1) + ' / ' + photos.length + '</div>';
        html += '<button class="gallery-nav gallery-nav--prev" id="gal-prev">&#8249;</button>';
        html += '<button class="gallery-nav gallery-nav--next" id="gal-next">&#8250;</button>';
      }
      html += '<button class="gallery-close" id="gal-close">&times;</button>';
      overlay.innerHTML = html;
    }
    render();
    document.body.appendChild(overlay);
    function closeGallery() {
      if (!overlay.parentNode) return;
      overlay.remove();
      popOverlay(overlay);
    }
    pushOverlay(overlay, closeGallery);
    overlay.addEventListener('click', function (e) {
      if (e.target.id === 'gal-prev') { idx = (idx - 1 + photos.length) % photos.length; render(); return; }
      if (e.target.id === 'gal-next') { idx = (idx + 1) % photos.length; render(); return; }
      if (e.target.id === 'gal-close' || e.target === overlay) { closeGallery(); return; }
    });
    overlay.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeGallery();
      if (e.key === 'ArrowLeft' && photos.length > 1) { idx = (idx - 1 + photos.length) % photos.length; render(); }
      if (e.key === 'ArrowRight' && photos.length > 1) { idx = (idx + 1) % photos.length; render(); }
    });
    overlay.setAttribute('tabindex', '0');
    overlay.focus();
  }

      var otherIsRequester = match.fromId === id;

  /* 관리자가 회원 PIN을 새로 재설정 (원본 열람 불가한 기존 회원용) */
  function handleAdminResetPin(id) {
    if (!isAdminUnlocked || !adminPrivateKey) return modalNotice('안내', '관리자 모드에서만 가능해요.');
    var entry = (currentState.entries || []).find(function (e) { return e.id === id; });
    if (!entry) return;
    modalNumericPinSetup('PIN 재설정', escapeHtml(entry.nickname) + '님에게 새로 부여할 PIN을 입력해주세요.').then(function (r) {
      if (!r) return;
      if (!/^[0-9]{4,8}$/.test(r.p1)) return modalNotice('입력 오류', 'PIN은 숫자 4~8자리예요.');
      if (r.p1 !== r.p2) return modalNotice('오류', 'PIN이 일치하지 않아요.');
      var contactP = entry.contactEnc ? decryptWithAdmin(adminPrivateKey, entry.contactEnc).catch(function () { return null; }) : Promise.resolve(null);
      contactP.then(function (contact) {
        return Promise.all([
          makePinAuth(r.p1),
          contact ? encryptForSelf(r.p1, contact) : Promise.resolve(null)
        ]).then(function (res) {
          return db.runTransaction(function (tx) {
            return tx.get(stateRef).then(function (doc) {
              var s = doc.data();
              var entries = (s.entries || []).map(function (e) {
                if (e.id !== id) return e;
                var c = JSON.parse(JSON.stringify(e));
                c.pinAuth = res[0];
                delete c.pinHash;
                delete c.pinEnc;
                if (res[1]) c.contactSelfEnc = res[1];
                return c;
              });
              tx.update(stateRef, { entries: entries });
            });
          });
        });
      }).then(function () {
        appendLog('admin', '관리자', 'PIN 재설정 · ' + entry.nickname);
        return refreshNow();
      }).then(function () {
        modalNotice('완료', entry.nickname + '님의 새 PIN은 ' + r.p1 + ' 입니다. 회원에게 알려주세요.');
      }).catch(function (err) {
        modalNotice('오류', '재설정에 실패했어요: ' + (err.message || err));
      });
    });
  }

  /* ---- global event delegation ---- */
  document.body.addEventListener('click', function (e) {
    var roleBtn = e.target.closest('[data-role]');
    if (roleBtn) {
      formRole = roleBtn.getAttribute('data-role'); /* 'self' | 'matchmaker' */
      proxyRegisterMode = false;
      photoDataUrls = [];
      paint(currentState);
      return;
    }
    if (e.target.closest('#mm-new-btn')) { formRole = 'mm-new'; photoDataUrls = []; paint(currentState); return; }
    if (e.target.closest('#mm-back')) { formRole = 'matchmaker'; paint(currentState); return; }
    if (e.target.closest('#mm-login')) { modalLogin(); return; }
    var tabBtn = e.target.closest('[data-tab]');

  function renderPhotoThumbs() {
    var area = document.getElementById('photo-upload-area');
    if (!area) return;
    area.innerHTML = photoDataUrls.map(function (url, i) {
      return '<div class="photo-thumb"><img src="' + url + '" alt="photo ' + (i + 1) + '"><button type="button" class="photo-thumb-remove" data-remove-photo="' + i + '">&times;</button></div>';
    }).join('') || '<span style="color:var(--muted);font-size:0.82rem;">사진 없음</span>';
  }

  function resizeImage(file, maxW, maxH, quality, cb) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          var ratio = Math.min(maxW / w, maxH / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.body.addEventListener('change', function (e) {
    var testCb = e.target.closest && e.target.closest('[data-testtoggle]');
    if (testCb) { handleSetTest(testCb.getAttribute('data-testtoggle'), testCb.checked); return; }
    var permCb = e.target.closest && e.target.closest('[data-permtoggle]');
    if (permCb) { setPermission(permCb.getAttribute('data-kind'), permCb.getAttribute('data-viewer'), permCb.getAttribute('data-target'), permCb.checked, permCb); return; }
    if (e.target.id === 'f-blur' && !e.target.checked) {
      var blurCb = e.target;
      modalConfirm('전체 공개 확인', '사진을 전체 공개할까요? 모든 회원이 요청 없이 바로 볼 수 있어요.', '전체 공개', 'danger').then(function (ok) {
        if (!ok) blurCb.checked = true; /* 취소하면 다시 흐리게 */
      });
      return;
    }
    if (e.target.id === 'f-photo') {
      var files = e.target.files;
      if (!files || !files.length) return;
      var remaining = 3 - photoDataUrls.length;
      if (remaining <= 0) { modalNotice('안내', '사진은 최대 3장까지 추가할 수 있어요.'); e.target.value = ''; return; }
      var toRead = Math.min(files.length, remaining);
      for (var i = 0; i < toRead; i++) {
        (function (file) {
          resizeImage(file, FULL_MAX, FULL_MAX, FULL_Q, function (dataUrl) {
            photoDataUrls.push(dataUrl);
            renderPhotoThumbs();
          });
        })(files[i]);
      }
      if (files.length > remaining) {
        modalNotice('안내', '최대 3장까지만 추가됩니다. ' + (files.length - remaining) + '장은 무시되었어요.');
      }
      e.target.value = '';
      setTimeout(saveDraft, 300); /* 사진 압축 후 임시저장 */
      return;
    }
    /* 성별/관계 등 라디오·체크 선택도 임시저장 */
    if (e.target.closest && e.target.closest('#entry-form')) saveDraft();
  });

  /* ---- init ---- */
  function init() {
    var localState = readStateLocal();

    stateRef.get().then(function (doc) {
      if (doc.exists) {
        return doc.data();
      }
      return stateRef.set(localState).then(function () { return localState; });
    }).then(function (state) {
      currentState = state;
      if (!Array.isArray(state.entries)) state.entries = [];
      if (!Array.isArray(state.pendingEntries)) state.pendingEntries = [];
      if (!Array.isArray(state.dateRequests)) state.dateRequests = [];
      if (!Array.isArray(state.approvedPairs)) state.approvedPairs = [];
      if (!Array.isArray(state.logs)) state.logs = [];
      if (!Array.isArray(state.messages)) state.messages = [];
      /* 기존 회원 고유번호 백필 (한 번만, 결정적이라 클라이언트 간 동일) */
      if (ensureSerials(state)) {
        stateRef.update({ entries: state.entries }).catch(function () {});
      }
      checkVersion(state);
      restoreSession(state);
      /* 주선자로 로그인 유지 중이면 신청 탭이 sub 추가 모드가 되도록 */
      if (currentUser && currentUser.id) {
        var meAny = (state.entries || []).concat(state.pendingEntries || []).find(function (e) { return e.id === currentUser.id; });
        formRole = (meAny && meAny.isMatchmaker) ? 'matchmaker' : 'self';
      }

      var adminPromise = Promise.resolve();
      try {
        var savedPin = getAdminPin();
        if (savedPin && state.adminAuth) {
          adminPromise = unlockAdminKey(savedPin, state.adminAuth).then(function (key) {
            adminPrivateKey = key;
            isAdminUnlocked = true; requestNotifPermission();
          }).catch(function () {
            clearAdminPin();
          });
        }
      } catch (e) {}

      return adminPromise.then(function () {
        return decryptAllAdminData(state);
      }).then(function () {
        paint(state);
        refreshNotifTokens();
        /* 로그인 유지 상태여도 앱 열 때 최근 방문 시간 갱신 (로그인 때만 갱신되던 문제) */
        if (currentUser && currentUser.id) {
          var meNow = (state.entries || []).find(function (e) { return e.id === currentUser.id; });
          var last = meNow && meNow.lastSeenAt ? new Date(meNow.lastSeenAt).getTime() : 0;
          if (Date.now() - last > 5 * 60 * 1000) touchLastSeen(currentUser.id); /* 5분 이상 지났을 때만 */
        }
      });
    }).catch(function (err) {
      document.getElementById('app').innerHTML =
        '<div style="text-align:center;padding:60px 20px;color:var(--muted);">' +
        '<p>데이터를 불러오는 중 오류가 발생했어요.</p>' +
        '<p style="font-size:0.8rem;">' + escapeHtml(err.message || err) + '</p>' +
        '</div>';
    });

    var prevPendingCount = -1;
    var prevRequestCount = -1;

    function requestNotifPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function showNotification(title, body) {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') {
        var n = new Notification(title, { body: body });
        n.onclick = function () { window.focus(); n.close(); };
      }
    }

    stateRef.onSnapshot(function (doc) {
      if (!doc.exists) return;
      var state = doc.data();
      if (!Array.isArray(state.pendingEntries)) state.pendingEntries = [];
      if (!Array.isArray(state.dateRequests)) state.dateRequests = [];
      if (!Array.isArray(state.approvedPairs)) state.approvedPairs = [];
      if (!Array.isArray(state.logs)) state.logs = [];
      if (!currentUser) restoreSession(state);
      checkVersion(state);

      if (prevPendingCount >= 0 && state.pendingEntries.length > prevPendingCount) {
        showNotification('새 접수!', '새로운 인연 신청서가 도착했어요. (' + state.pendingEntries.length + '건 대기중)');
      }
      if (prevRequestCount >= 0 && state.dateRequests.length > prevRequestCount) {
        showNotification('새 요청!', '새로운 사진/번호 요청이 도착했어요.');
      }
      prevPendingCount = state.pendingEntries.length;
      prevRequestCount = state.dateRequests.length;

      currentState = state;
      decryptAllAdminData(state).then(function () {
        /* 신청서 작성 중이면 화면을 다시 그리지 않음 (입력 내용 보존) */
        if (isEditingForm()) return;
        paint(state);
      });
    });
  }

  }

  function handleAddToHome() {
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var steps = isIOS
      ? '<b>아이폰 (Safari)</b><br>1. 아래 <b>공유 버튼</b> (□↑) 을 누르세요<br>2. <b>"홈 화면에 추가"</b> 를 선택하세요<br>3. 오른쪽 위 <b>"추가"</b> 를 누르면 끝!'
      : isAndroid
        ? '<b>안드로이드 (Chrome)</b><br>1. 오른쪽 위 <b>⋮ 메뉴</b> 를 누르세요<br>2. <b>"홈 화면에 추가"</b> 또는 <b>"앱 설치"</b> 를 선택하세요<br>3. <b>"추가"</b> 를 누르면 끝!'
        : '<b>PC (Chrome · Edge)</b><br>1. 주소창 <b>오른쪽 끝의 설치 아이콘</b> (⊕ 또는 모니터 모양) 을 클릭<br>&nbsp;&nbsp;&nbsp;또는 <b>⋮ 메뉴 → "앱 설치"</b> (없으면 "바로가기 만들기")<br>2. <b>"설치"</b> 를 누르면 끝!';
    var canInstall = !!deferredInstallPrompt;
    var intro = canInstall
      ? '홈 화면에 아이콘을 추가하면 앱처럼 바로 열 수 있어요. 아래 <b>홈 화면에 추가</b> 를 누르면 바로 추가돼요!'
      : '홈 화면에 아이콘을 추가하면 앱처럼 바로 열 수 있어요.<br><span style="color:var(--muted);font-size:0.84rem;">(이미 추가했거나 브라우저가 자동 설치를 지원하지 않을 땐 아래 방법으로 추가하세요)</span><br><br>' + steps;
    var actions = canInstall
      ? '<div class="modal-actions"><button type="button" class="card-btn" id="modal-ok">닫기</button>' +
        '<button type="button" class="card-btn primary" id="do-install">📱 홈 화면에 추가</button></div>'
      : '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인</button></div>';
    var overlay = openModal(
      '<h3>📱 홈 화면에 추가</h3>' +
      '<div class="modal-msg" style="text-align:left;line-height:1.9;">' + intro + '</div>' +
      actions
    );
    overlay.querySelector('#modal-ok').addEventListener('click', function () { closeModal(overlay); });
    var di = overlay.querySelector('#do-install');
    if (di) di.addEventListener('click', function () {
      var p = deferredInstallPrompt;
      closeModal(overlay);
      if (p) { p.prompt(); p.userChoice.then(function () { deferredInstallPrompt = null; }); }
    });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(overlay); });
  }

  /* ---- 익명 인증 후 앱 시작 (외부 접근 차단용 규칙과 함께 동작) ---- */
  var appStarted = false;
  function startApp() {
    if (appStarted) return;
    appStarted = true;
    setupPWA();
    init();
    setupPullRefresh();
    setTimeout(showAnnouncement, 800);
  }
  /* 아이폰 홈화면 앱(standalone)은 네이티브 "당겨서 새로고침"이 없음 → 직접 구현 */
  function setupPullRefresh() {
    try {
      if (!isStandalone()) return; /* 브라우저 탭은 네이티브 기능 있음 */
      var startY = 0, dy = 0, active = false, ind = null;
      function topPos() { return window.pageYOffset || document.documentElement.scrollTop || 0; }
      function ensureInd() {
        if (ind) return ind;
        ind = document.createElement('div');
        ind.style.cssText = 'position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;height:0;overflow:hidden;z-index:99999;background:linear-gradient(var(--gold-soft,#f6ecd9),transparent);color:var(--accent,#B23A48);font-size:0.85rem;font-weight:700;pointer-events:none;padding-bottom:6px;box-sizing:border-box;transition:height 0.12s ease;';
        document.body.appendChild(ind);
        return ind;
      }
      function reset() { if (ind) ind.style.height = '0px'; dy = 0; active = false; }
      document.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) { active = false; return; }
        if (document.querySelector('.modal-overlay')) { active = false; return; } /* 모달 열림 시 비활성 */
        if (topPos() <= 0) { startY = e.touches[0].clientY; active = true; dy = 0; }
        else active = false;
      }, { passive: true });
      document.addEventListener('touchmove', function (e) {
        if (!active) return;
        dy = e.touches[0].clientY - startY;
        if (dy > 0 && topPos() <= 0) {
          var el = ensureInd();
          el.style.height = Math.min(dy * 0.5, 72) + 'px';
          el.textContent = dy > 90 ? '↑ 놓으면 새로고침' : '↓ 당겨서 새로고침';
        } else if (ind) { ind.style.height = '0px'; }
      }, { passive: true });
      document.addEventListener('touchend', function () {
        if (!active) return;
        if (dy > 90) { if (ind) { ind.style.height = '46px'; ind.textContent = '새로고침 중…'; } location.reload(); }
        else reset();
      }, { passive: true });
      document.addEventListener('touchcancel', reset, { passive: true });
    } catch (e) {}
  }
  try {
    firebase.auth().onAuthStateChanged(function (user) {
      if (user) startApp();
    });
    firebase.auth().signInAnonymously().catch(function (e) {
      /* 익명 인증이 콘솔에서 아직 안 켜졌거나 실패해도 앱은 뜨도록 */
      try { console.warn('anonymous auth unavailable:', e && e.code); } catch (e2) {}
      startApp();
    });
  } catch (e) {
    startApp();
  }
  /* 인증이 끝내 응답 없을 때를 대비한 안전장치 */
  setTimeout(startApp, 5000);
})();
</script>
