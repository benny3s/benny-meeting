  function renderPhotoThumbs() {
    var area = document.getElementById('photo-upload-area');
    if (!area) return;
    area.innerHTML = photoDataUrls.map(function (url, i) {
      return '<div class="photo-thumb"><img src="' + url + '" alt="photo ' + (i + 1) + '"><button type="button" class="photo-thumb-remove" data-remove-photo="' + i + '">&times;</button></div>';
    }).join('') || '<span style="color:var(--muted);font-size:0.82rem;">사진 없음</span>';
  }

  function resizeImage(file, maxW, maxH, quality, cb) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          var ratio = Math.min(maxW / w, maxH / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.body.addEventListener('change', function (e) {
    var testCb = e.target.closest && e.target.closest('[data-testtoggle]');
    if (testCb) { handleSetTest(testCb.getAttribute('data-testtoggle'), testCb.checked); return; }
    var permCb = e.target.closest && e.target.closest('[data-permtoggle]');
    if (permCb) { setPermission(permCb.getAttribute('data-kind'), permCb.getAttribute('data-viewer'), permCb.getAttribute('data-target'), permCb.checked, permCb); return; }
    var secOpenCb = e.target.closest && e.target.closest('[data-secopen]');
    if (secOpenCb) { adminSecOpenMap()[secOpenCb.getAttribute('data-secopen')] = secOpenCb.checked; saveAdminSecOpen(); return; }
    if (e.target.id === 'f-blur' && !e.target.checked) {
      var blurCb = e.target;
      modalConfirm('전체 공개 확인', '사진을 전체 공개할까요? 모든 회원이 요청 없이 바로 볼 수 있어요.', '전체 공개', 'danger').then(function (ok) {
        if (!ok) blurCb.checked = true; /* 취소하면 다시 흐리게 */
      });
      return;
    }
    if (e.target.id === 'acq-vcf') {
      handleAcqVcf(e.target.files && e.target.files[0]);
      e.target.value = '';
      return;
    }
    if (e.target.id === 'f-photo') {
      var files = e.target.files;
      if (!files || !files.length) return;
      /* 이미지 파일만 사용 (파일 시스템에서 아무 파일이나 골라도 이미지 아닌 건 제외) */
      var imgs = Array.prototype.filter.call(files, function (f) {
        if (!f) return false;
        if (f.type) return f.type.indexOf('image/') === 0;
        return /\.(jpe?g|png|gif|webp|heic|heif|bmp|tiff?)$/i.test(f.name || ''); /* 타입 비었으면 확장자로 */
      });
      var nonImg = files.length - imgs.length;
      if (!imgs.length) { modalNotice('안내', '이미지 파일만 추가할 수 있어요. (JPG·PNG·HEIC 등)'); e.target.value = ''; return; }
      var remaining = 3 - photoDataUrls.length;
      if (remaining <= 0) { modalNotice('안내', '사진은 최대 3장까지 추가할 수 있어요.'); e.target.value = ''; return; }
      var toRead = Math.min(imgs.length, remaining);
      for (var i = 0; i < toRead; i++) {
        (function (file) {
          resizeImage(file, FULL_MAX, FULL_MAX, FULL_Q, function (dataUrl) {
            photoDataUrls.push(dataUrl);
            renderPhotoThumbs();
          });
        })(imgs[i]);
      }
      var notes = [];
      if (imgs.length > remaining) notes.push('최대 3장까지만 추가돼요 (' + (imgs.length - remaining) + '장 무시).');
      if (nonImg > 0) notes.push('이미지가 아닌 파일 ' + nonImg + '개는 제외했어요.');

    ctx.beginPath(); ctx.moveTo(17 * s, 35 * s); ctx.lineTo(17 * s, 16 * s); ctx.moveTo(31 * s, 35 * s); ctx.lineTo(31 * s, 16 * s); ctx.stroke(); /* 주탑 */

    ctx.fillStyle = '#FBF3EE'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = Math.round(size * 0.2) + 'px serif';
    ctx.fillText('♥', size / 2, size * 0.17); /* 상단 하트 */
    return c.toDataURL('image/png');
  }
  function setupPWA() {
    try {
      var icon192 = makeAppIcon(192), icon512 = makeAppIcon(512);
      var base = location.href.split('?')[0].split('#')[0];
      var dir = base.substring(0, base.lastIndexOf('/') + 1);
      var manifest = {
        id: base, name: '베니브릿지', short_name: '베니브릿지',
        start_url: base, scope: dir, display: 'standalone',
        background_color: '#FBF3EE', theme_color: '#B23A48',
        icons: [
          { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      var mlink = document.createElement('link'); mlink.rel = 'manifest'; mlink.href = URL.createObjectURL(blob);
      document.head.appendChild(mlink);
      var ai = document.createElement('link'); ai.rel = 'apple-touch-icon'; ai.href = icon192;
      document.head.appendChild(ai);
      var tc = document.createElement('meta'); tc.name = 'theme-color'; tc.content = '#B23A48';
      document.head.appendChild(tc);
    } catch (e) {}
    /* 서비스워커를 미리 등록 → 크롬이 "앱 설치"(beforeinstallprompt)를 띄울 수 있게 (알림을 안 켜도 설치 가능) */
    try {
      if ('serviceWorker' in navigator) {
        var swPath = location.pathname.replace(/[^/]*$/, '') + 'firebase-messaging-sw.js';
        navigator.serviceWorker.register(swPath).catch(function () {});
      }
    } catch (e) {}
  }
  function handleCopyUrl() {
    var url = location.origin + location.pathname.replace(/index\.html$/, '');
    function manual() {
      var overlay = openModal(
        '<h3>🔗 사이트 주소</h3>' +
        '<p class="modal-msg">아래 주소를 눌러 전체 선택 후 복사하세요.</p>' +
        '<input type="text" class="modal-input" id="copy-url-field" readonly value="' + escapeHtml(url) + '">' +
        '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인</button></div>'
      );
      var f = overlay.querySelector('#copy-url-field');
      setTimeout(function () { try { f.focus(); f.select(); } catch (e) {} }, 50);
      overlay.querySelector('#modal-ok').addEventListener('click', function () { closeModal(overlay); });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(overlay); });
    }
    function ok() { modalNotice('복사 완료', '사이트 주소가 복사됐어요! 친구에게 붙여넣기 하면 돼요.'); }
    function tryExec() {
      try {
        var ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var done = document.execCommand('copy');
        document.body.removeChild(ta);
        if (done) ok(); else manual();
      } catch (e) { manual(); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(ok).catch(tryExec);
    } else { tryExec(); }
  }

  function handleAddToHome() {
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var steps = isIOS
      ? '<b>아이폰 (Safari)</b><br>1. 아래 <b>공유 버튼</b> (□↑) 을 누르세요<br>2. <b>"홈 화면에 추가"</b> 를 선택하세요<br>3. 오른쪽 위 <b>"추가"</b> 를 누르면 끝!'
      : isAndroid
        ? '<b>안드로이드 (Chrome)</b><br>1. 오른쪽 위 <b>⋮ 메뉴</b> 를 누르세요<br>2. <b>"홈 화면에 추가"</b> 또는 <b>"앱 설치"</b> 를 선택하세요<br>3. <b>"추가"</b> 를 누르면 끝!'
        : '<b>PC (Chrome · Edge)</b><br>1. 주소창 <b>오른쪽 끝의 설치 아이콘</b> (⊕ 또는 모니터 모양) 을 클릭<br>&nbsp;&nbsp;&nbsp;또는 <b>⋮ 메뉴 → "앱 설치"</b> (없으면 "바로가기 만들기")<br>2. <b>"설치"</b> 를 누르면 끝!';
    var canInstall = !!deferredInstallPrompt;
    var intro = canInstall
      ? '홈 화면에 아이콘을 추가하면 앱처럼 바로 열 수 있어요. 아래 <b>홈 화면에 추가</b> 를 누르면 바로 추가돼요!'
      : '홈 화면에 아이콘을 추가하면 앱처럼 바로 열 수 있어요.<br><span style="color:var(--muted);font-size:0.84rem;">(이미 추가했거나 브라우저가 자동 설치를 지원하지 않을 땐 아래 방법으로 추가하세요)</span><br><br>' + steps;
    var actions = canInstall
      ? '<div class="modal-actions"><button type="button" class="card-btn" id="modal-ok">닫기</button>' +
        '<button type="button" class="card-btn primary" id="do-install">📱 홈 화면에 추가</button></div>'
      : '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인</button></div>';
    var overlay = openModal(
      '<h3>📱 홈 화면에 추가</h3>' +
      '<div class="modal-msg" style="text-align:left;line-height:1.9;">' + intro + '</div>' +
      actions
    );
    overlay.querySelector('#modal-ok').addEventListener('click', function () { closeModal(overlay); });
    var di = overlay.querySelector('#do-install');
    if (di) di.addEventListener('click', function () {
      var p = deferredInstallPrompt;
      closeModal(overlay);
      if (p) { p.prompt(); p.userChoice.then(function () { deferredInstallPrompt = null; }); }
    });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(overlay); });
  }

  /* ---- 익명 인증 후 앱 시작 (외부 접근 차단용 규칙과 함께 동작) ---- */
  var appStarted = false;
  function startApp() {
    if (appStarted) return;
    appStarted = true;
    setupPWA();
    init();
    setupPullRefresh();
    setTimeout(showAnnouncement, 800);
  }
  /* 아이폰 홈화면 앱(standalone)은 네이티브 "당겨서 새로고침"이 없음 → 직접 구현 */
  function setupPullRefresh() {
    try {
      if (!isStandalone()) return; /* 브라우저 탭은 네이티브 기능 있음 */
      var startY = 0, dy = 0, active = false, ind = null;
      function topPos() { return window.pageYOffset || document.documentElement.scrollTop || 0; }
      function ensureInd() {
        if (ind) return ind;
        ind = document.createElement('div');
        ind.style.cssText = 'position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;height:0;overflow:hidden;z-index:99999;background:linear-gradient(var(--gold-soft,#f6ecd9),transparent);color:var(--accent,#B23A48);font-size:0.85rem;font-weight:700;pointer-events:none;padding-bottom:6px;box-sizing:border-box;transition:height 0.12s ease;';
        document.body.appendChild(ind);
        return ind;
      }
      function reset() { if (ind) ind.style.height = '0px'; dy = 0; active = false; }
      document.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) { active = false; return; }
        if (document.querySelector('.modal-overlay')) { active = false; return; } /* 모달 열림 시 비활성 */
        if (topPos() <= 0) { startY = e.touches[0].clientY; active = true; dy = 0; }
        else active = false;
      }, { passive: true });
      document.addEventListener('touchmove', function (e) {
        if (!active) return;
        dy = e.touches[0].clientY - startY;
        if (dy > 0 && topPos() <= 0) {
          var el = ensureInd();
          el.style.height = Math.min(dy * 0.5, 72) + 'px';
          el.textContent = dy > 90 ? '↑ 놓으면 새로고침' : '↓ 당겨서 새로고침';
        } else if (ind) { ind.style.height = '0px'; }
      }, { passive: true });
      document.addEventListener('touchend', function () {
        if (!active) return;
        if (dy > 90) { if (ind) { ind.style.height = '46px'; ind.textContent = '새로고침 중…'; } location.reload(); }
        else reset();
      }, { passive: true });
      document.addEventListener('touchcancel', reset, { passive: true });
    } catch (e) {}
  }
  try {
    firebase.auth().onAuthStateChanged(function (user) {
      if (user) startApp();
    });
    firebase.auth().signInAnonymously().catch(function (e) {
      /* 익명 인증이 콘솔에서 아직 안 켜졌거나 실패해도 앱은 뜨도록 */
      try { console.warn('anonymous auth unavailable:', e && e.code); } catch (e2) {}
      startApp();
    });
  } catch (e) {
    startApp();
  }
  /* 인증이 끝내 응답 없을 때를 대비한 안전장치 */
  setTimeout(startApp, 5000);
})();
</script>
