        '<p><b>&#128274; 최근 강화된 보안 (NEW):</b></p>' +
        '<ul style="padding-left:20px;margin:6px 0;">' +
          '<li><b>데이터베이스 잠금</b> — 인증된 접속만 허용하고, 외부에서 데이터를 통째로 열람하거나 삭제할 수 없도록 규칙으로 차단했어요.</li>' +
          '<li>개인 PIN 저장 방식을 <b>더 강력한 방식(PBKDF2)으로 업그레이드</b>했어요. 유출되더라도 원래 PIN을 알아내기가 매우 어려워요. (여러분이 하실 일은 없어요)</li>' +
          '<li><b>회원별 접근 권한 세분화</b> — 회원별 로그인으로 본인 정보는 본인만 관리·수정할 수 있어요.</li>' +
        '</ul>' +
        '<p><b>이전부터 적용 중인 보안:</b></p>' +
        '<ul style="padding-left:20px;margin:6px 0;">' +
          '<li>실명, 연락처, 소개자 정보는 <b>암호화</b>되어 저장돼요. 관리자 외에는 아무도 볼 수 없어요.</li>' +
          '<li>개인 PIN은 원본이 아닌 <b>해시값</b>으로만 저장돼요.</li>' +
          '<li>사진/번호 보기는 <b>당사자 본인이 직접 승인</b>해야 열람할 수 있어요. 원치 않으면 거절하고 메시지도 남길 수 있어요.</li>' +
          '<li>번호는 <b>본인 PIN으로 한 번 더 암호화</b>되어, 본인이 승인할 때만 열려요.</li>' +
          '<li>개인정보 수집 시 <b>동의 절차</b>를 거치고 있어요.</li>' +
        '</ul>' +
        '<p style="color:var(--muted);font-size:0.82rem;">궁금하거나 불안한 점이 있으면 언제든 관리자에게 물어봐주세요!</p>' +
      '</div>' +
      '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인했어요</button></div>'
    );
    overlay.classList.add('wide-modal');
    function finish() {
      closeModal(overlay);
      try { localStorage.setItem('announce-v3', '1'); } catch (e) {}
    }
    overlay.querySelector('#modal-ok').addEventListener('click', finish);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(); });
  }

  /* ---- 홈 화면 바로가기 (PWA) ---- */
  function isStandalone() {
    try {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    } catch (e) { return false; }
  }

  /* ---- 폰 알림 (FCM 웹 푸시) ---- */
  function notifOn() { try { return !!localStorage.getItem('notifToken'); } catch (e) { return false; } }
  function notifSupported() {
    return !!fcmMessaging && ('Notification' in window) && ('serviceWorker' in navigator);
  }
  function myEntryOrPending() {
    return findMyEntry(currentState) || findMyPending(currentState);
  }
  function showNotifHelp() {
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var mine = isIOS ? 'ios' : (isAndroid ? 'android' : 'pc');
    function badge(k) { return mine === k ? ' <span style="background:var(--accent);color:#fff;font-size:0.68rem;padding:1px 7px;border-radius:8px;vertical-align:middle;">내 기기</span>' : ''; }
    function sec(k, title, steps) {
      var hot = mine === k;
      return '<div style="border:1px solid ' + (hot ? 'var(--accent)' : 'var(--line)') + ';border-radius:12px;padding:12px 14px;margin-top:10px;' + (hot ? 'background:var(--paper);' : '') + '">' +
        '<div style="font-weight:700;font-size:0.92rem;margin-bottom:6px;">' + title + badge(k) + '</div>' +
        '<ol style="margin:0;padding-left:18px;font-size:0.84rem;line-height:1.6;color:var(--ink);">' + steps + '</ol></div>';
    }
    var html =
      '<h3>🔔 알림 켜는 법</h3>' +
      '<p class="modal-msg" style="margin-bottom:6px;">요청이 오거나 승인·거절되면 기기로 바로 알림을 받아요. 기기별로 켜는 방법이 조금 달라요.</p>' +
      sec('android', '🤖 안드로이드 (크롬)',
        '<li>이 화면에서 <b>🔔 알림 켜기</b> 를 누르세요.</li>' +
        '<li>“알림을 허용하시겠어요?” 가 뜨면 <b>허용</b>.</li>' +
        '<li>끝! 앱을 꺼둬도 알림이 와요.</li>') +
      sec('ios', '🍎 아이폰 (사파리 · 홈 화면 추가 필수)',
        '<li><b>사파리(Safari)</b>로 이 페이지를 여세요. (크롬 앱은 안 돼요)</li>' +
        '<li>아래쪽 공유 버튼 <b>⬆️</b> → <b>“홈 화면에 추가”</b>.</li>' +
        '<li>홈 화면에 생긴 <b>아이콘</b>으로 앱을 다시 여세요.</li>' +
        '<li>그 안에서 <b>🔔 알림 켜기</b> → <b>허용</b>.</li>' +
        '<li style="color:var(--muted);">※ iOS 16.4 이상에서만 웹 알림이 돼요.</li>') +
      sec('pc', '💻 PC (크롬 · 엣지)',
        '<li><b>🔔 알림 켜기</b> 를 누르세요.</li>' +
        '<li>주소창 아래 뜨는 창에서 <b>허용</b>.</li>' +
        '<li>브라우저가 켜져 있을 때 알림이 와요.</li>') +
      '<p class="modal-msg" style="margin:12px 0 0;font-size:0.8rem;">실수로 <b>차단</b>을 눌렀다면: 주소창 왼쪽 <b>자물쇠</b> 아이콘 → 알림 → <b>허용</b> 으로 바꾸면 돼요.</p>' +
      '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인</button></div>';
    var overlay = openModal(html);
    overlay.classList.add('wide-modal');
    function finish() { closeModal(overlay); }
    overlay.querySelector('#modal-ok').addEventListener('click', finish);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(); });
  }
  function handleNotifToggle() {
    if (!currentUser) { modalNotice('로그인 필요', '알림은 로그인한 뒤 켤 수 있어요. 먼저 로그인해주세요.'); return; }
    if (!notifSupported()) { modalNotice('안내', '이 브라우저에서는 알림을 지원하지 않아요. 크롬(안드로이드/PC)이나 홈 화면에 추가한 아이폰(사파리)에서 사용해주세요.'); return; }
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    if (isIOS && !isStandalone()) {
      modalNotice('아이폰 알림 안내', '아이폰은 먼저 "바로가기 추가"로 홈 화면에 추가한 뒤, 홈 화면 아이콘으로 열어서 알림을 켜주세요.');
      return;
    }
    if (Notification.permission === 'denied') {
      modalNotice('알림 차단됨', '브라우저 설정에서 이 사이트의 알림을 "허용"으로 바꿔주세요. (주소창 왼쪽 자물쇠 → 알림)');
      return;
    }
    if (notifOn()) { disableNotif(); } else { enableNotif(); }
  }
  function enableNotif() {
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') { modalNotice('알림 미허용', '알림을 받으려면 "허용"을 눌러주세요.'); return; }
      var swPath = location.pathname.replace(/[^/]*$/, '') + 'firebase-messaging-sw.js';
      navigator.serviceWorker.register(swPath).then(function (reg) {
        return fcmMessaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      }).then(function (token) {
        if (!token) throw new Error('토큰을 받지 못했어요');
        var me = myEntryOrPending();
        var uid = me ? me.id : currentUser.id;
        return pushTokensRef.doc(uid).set({
          tokens: firebase.firestore.FieldValue.arrayUnion(token),
          nickname: (me && me.nickname) || currentUser.nickname || '',
          updatedAt: new Date().toISOString()
        }, { merge: true }).then(function () {
          try { localStorage.setItem('notifToken', token); } catch (e) {}
        });
      }).then(function () {
        paint(currentState);
        modalNotice('알림 켜짐 🔔', '이제 요청이 오면 이 기기로 알림을 받아요! (앱을 꺼둬도 와요)');
      }).catch(function (err) {
        modalNotice('오류', '알림을 켜지 못했어요: ' + (err.message || err));
      });
    }).catch(function (err) {
      modalNotice('오류', '알림 권한 요청에 실패했어요: ' + (err.message || err));
    });
  }
  function disableNotif() {
    var token = ''; try { token = localStorage.getItem('notifToken') || ''; } catch (e) {}
    var me = myEntryOrPending();
    var uid = me ? me.id : (currentUser && currentUser.id);
    var p = (token && uid)
      ? pushTokensRef.doc(uid).set({ tokens: firebase.firestore.FieldValue.arrayRemove(token) }, { merge: true })
      : Promise.resolve();
    if (fcmMessaging && token) { try { fcmMessaging.deleteToken().catch(function () {}); } catch (e) {} }
    p.catch(function () {}).then(function () {
      try { localStorage.removeItem('notifToken'); } catch (e) {}
      paint(currentState);
      modalNotice('알림 꺼짐', '이 기기로는 더 이상 알림이 오지 않아요.');
    });
  }
  /* 앱이 열려 있을 때 오는 메시지 */
  if (fcmMessaging) {
    try {
      fcmMessaging.onMessage(function (payload) {
        var n = (payload && payload.notification) || (payload && payload.data) || {};
        modalNotice(n.title || '새 알림', n.body || '');
      });
    } catch (e) {}
  }

  var deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
  });
  function makeAppIcon(size) {
    var c = document.createElement('canvas'); c.width = size; c.height = size;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#B23A48'; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = Math.round(size * 0.5) + 'px serif';
    ctx.fillText('♥', size / 2, size * 0.56); /* ♥ */
    return c.toDataURL('image/png');
  }
  function setupPWA() {
    try {
      var icon192 = makeAppIcon(192), icon512 = makeAppIcon(512);
      var base = location.href.split('?')[0].split('#')[0];
      var dir = base.substring(0, base.lastIndexOf('/') + 1);
      var manifest = {
        name: '인연 접수처', short_name: '인연접수처',
        start_url: base, scope: dir, display: 'standalone',
        background_color: '#FBF3EE', theme_color: '#B23A48',
        icons: [
          { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      var mlink = document.createElement('link'); mlink.rel = 'manifest'; mlink.href = URL.createObjectURL(blob);
      document.head.appendChild(mlink);
      var ai = document.createElement('link'); ai.rel = 'apple-touch-icon'; ai.href = icon192;
      document.head.appendChild(ai);
      var tc = document.createElement('meta'); tc.name = 'theme-color'; tc.content = '#B23A48';
      document.head.appendChild(tc);
    } catch (e) {}
  }
  function handleCopyUrl() {
    var url = location.origin + location.pathname.replace(/index\.html$/, '');
    function manual() {
      var overlay = openModal(
        '<h3>🔗 사이트 주소</h3>' +
        '<p class="modal-msg">아래 주소를 눌러 전체 선택 후 복사하세요.</p>' +
        '<input type="text" class="modal-input" id="copy-url-field" readonly value="' + escapeHtml(url) + '">' +
        '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인</button></div>'
      );
      var f = overlay.querySelector('#copy-url-field');
      setTimeout(function () { try { f.focus(); f.select(); } catch (e) {} }, 50);
      overlay.querySelector('#modal-ok').addEventListener('click', function () { closeModal(overlay); });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(overlay); });
    }
    function ok() { modalNotice('복사 완료', '사이트 주소가 복사됐어요! 친구에게 붙여넣기 하면 돼요.'); }
    function tryExec() {
      try {
        var ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var done = document.execCommand('copy');
        document.body.removeChild(ta);
        if (done) ok(); else manual();
      } catch (e) { manual(); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(ok).catch(tryExec);
    } else { tryExec(); }
  }

  function handleAddToHome() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function () { deferredInstallPrompt = null; });
      return;
    }
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var steps = isIOS
      ? '<b>아이폰 (Safari)</b><br>1. 아래 <b>공유 버튼</b> (□↑) 을 누르세요<br>2. <b>"홈 화면에 추가"</b> 를 선택하세요<br>3. 오른쪽 위 <b>"추가"</b> 를 누르면 끝!'
      : '<b>안드로이드 (Chrome)</b><br>1. 오른쪽 위 <b>⋮ 메뉴</b> 를 누르세요<br>2. <b>"홈 화면에 추가"</b> 또는 <b>"앱 설치"</b> 를 선택하세요<br>3. <b>"추가"</b> 를 누르면 끝!';
    var overlay = openModal(
      '<h3>📱 바탕화면에 바로가기 추가</h3>' +
      '<div class="modal-msg" style="text-align:left;line-height:1.9;">홈 화면에 아이콘을 추가하면 앱처럼 바로 열 수 있어요.<br><br>' + steps + '</div>' +
      '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인</button></div>'
    );
    overlay.querySelector('#modal-ok').addEventListener('click', function () { closeModal(overlay); });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(overlay); });
  }

  /* ---- 익명 인증 후 앱 시작 (외부 접근 차단용 규칙과 함께 동작) ---- */
  var appStarted = false;
  function startApp() {
    if (appStarted) return;
    appStarted = true;
    setupPWA();
    init();
    setTimeout(showAnnouncement, 800);
  }
  try {
    firebase.auth().onAuthStateChanged(function (user) {
      if (user) startApp();
    });
    firebase.auth().signInAnonymously().catch(function (e) {
      /* 익명 인증이 콘솔에서 아직 안 켜졌거나 실패해도 앱은 뜨도록 */
      try { console.warn('anonymous auth unavailable:', e && e.code); } catch (e2) {}
      startApp();
    });
  } catch (e) {
    startApp();
  }
  /* 인증이 끝내 응답 없을 때를 대비한 안전장치 */
  setTimeout(startApp, 5000);
})();
</script>
</body>
</html>
