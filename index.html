              '<input type="text" id="f-referrer" name="referrerText" maxlength="60" placeholder="예: 홍길동 (베니 친구), 김철수 (건너 건너)"' + (isEdit ? '' : ' required') + '>' +
              '<span class="hint">' + ICON_LOCK + ' 관리자(베니)가 추후 연락드리기 위해서입니다. 암호화되어 관리자만 볼 수 있어요.</span></div>' +
            '<div class="field"><label>베니와의 관계 <span class="req">필수</span></label>' +
              '<div class="degree-group">' +
                '<label><input type="radio" name="degreeChoice" value="1" required><span>1촌 · 베니의 친구</span></label>' +
                '<label><input type="radio" name="degreeChoice" value="2"><span>2촌 · 베니의 두 다리 건너</span></label>' +
                '<label><input type="radio" name="degreeChoice" value="3"><span>3촌 · 베니의 세 다리 건너</span></label>' +
                '<label><input type="radio" name="degreeChoice" value="other"><span>그 외</span></label>' +
              '</div>' +
            '</div>' +
            '<div class="field"><label>사진 <span class="opt">(선택, 최대 3장)</span></label>' +
              '<span class="hint">사진은 전체 공개, 선택 공개 (흐리게 처리하여, 사진 요청 승인시에만 공개) 가능</span>' +
              '<div class="photo-upload-area" id="photo-upload-area"></div>' +
              '<div style="display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap;">' +
                '<label class="photo-pick">사진 추가<input type="file" id="f-photo" accept="image/*" multiple></label>' +
                '<label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;cursor:pointer">' +
                  '<input type="checkbox" name="blurPhoto" id="f-blur" style="width:16px;height:16px;accent-color:var(--accent)"> 사진 흐리게 처리' +
                '</label>' +
              '</div></div>' +
            '<div class="section-label">추가 정보</div>' +
            '<div class="row-2">' +
              '<div class="field"><label for="f-height">키 (cm) <span class="opt">(선택)</span></label>' +
                '<input type="number" id="f-height" name="height" min="130" max="220" placeholder="예: 168"></div>' +
              '<div class="field"><label for="f-pin">개인 PIN ' + (isEdit ? '<span class="opt">(비우면 유지)</span>' : '<span class="req">필수</span>') + '</label>' +
                '<input type="text" inputmode="numeric" id="f-pin" name="pin" data-numeric pattern="[0-9]{4,8}" maxlength="8" placeholder="숫자 4~8자리"' + (isEdit ? '' : ' required') + '>' +
                '<span class="hint">나중에 본인이 신청을 취소하거나 데이트를 신청할 때 필요해요.</span></div>' +
            '</div>' +
            exampleTip +
            '<div class="field"><label for="f-intro">자기소개 <span class="opt">(선택)</span></label>' +
              '<span class="hint">정보가 자세할수록 매칭 성공률이 올라가요!</span>' +
              '<textarea id="f-intro" name="intro" rows="5" maxlength="500" placeholder="예:\nMBTI: ENFP\n흡연 유무: 비흡연\n주량: 소주 1병\n종교: 무교\n취미: 요리, 카페 탐방, 등산"></textarea></div>' +
            '<div class="field"><label for="f-idealtype">원하는 이성 조건 <span class="opt">(선택)</span></label>' +
              '<textarea id="f-idealtype" name="idealType" rows="5" maxlength="500" placeholder="예:\n학력: 대졸 이상\n키: 170cm 이상\n생년: 90~97년생\nMBTI: 외향형 선호\n흡연 유무: 비흡연\n주량: 적당히\n종교: 무관"></textarea></div>' +
            '<div class="field"><label for="f-dealbreaker">피하고 싶은 조건 <span class="opt">(선택)</span></label>' +
              '<textarea id="f-dealbreaker" name="dealbreaker" rows="3" maxlength="300" placeholder="예: 흡연자, 종교 강요, 연락 안 되는 사람"></textarea></div>' +
          '</div>' +
          '<hr class="perforation">' +
          (isEdit ? '' :
            '<div class="consent-box">' +
              '<label class="consent-label"><input type="checkbox" id="f-consent">' +
                ' <span>개인정보 수집 및 이용에 동의합니다.</span></label>' +
              '<p class="consent-detail">수집 항목: 닉네임, 실명, 연락처, 소개자, 성별, 생년, 지역, 직장, 사진, 자기소개 등<br>' +
                '수집 목적: 소개팅 매칭 및 관리자 연락<br>' +
                '보유 기간: 서비스 이용 종료 시 즉시 삭제<br>' +
                '동의를 거부할 권리가 있으며, 거부 시 신청이 불가합니다.</p>' +
            '</div>' +
            '<div class="consent-box">' +
              '<label class="consent-label"><input type="checkbox" id="f-notify-ack">' +
                ' <span>알림 기능이 아직 준비 중임을 확인했습니다.</span></label>' +
              '<p class="consent-detail">현재 자동 알림(카카오톡 등)이 없어요. 사진/번호 요청이 왔는지 확인하려면 ' +
                '<b>가끔 직접 로그인해서 "신청 현황" 탭을 확인</b>해 주세요. 알림 기능은 준비되는 대로 추가할게요!</p>' +
            '</div>') +
          '<div class="submit-row">' +
            '<button type="submit" class="submit-btn" id="submit-btn">' + (isEdit ? '수정 저장하기' : '도장 찍고 제출하기') + '</button>' +
            '<span class="status-msg" id="status-msg"></span>' +
          '</div>' +
        '</form>' +
      '</div>'
    );
  }

  function fmtDate(iso) {
    if (!iso) return '-';
    try {
      var d = new Date(iso);
      var p = function (n) { return String(n).padStart(2, '0'); };
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) { return '-'; }
  }

  function reqRowHtml(r, state, incoming) {
    var otherId = incoming ? r.fromId : r.toId;
    var other = (state.entries || []).find(function (e) { return e.id === otherId; });
    var otherLabel = other ? uidNick(other) : '(알 수 없음)';
    var st = reqStatus(r);
    var note = reqNote(r);
    var isPhoto = (r.type || 'contact') === 'photo';
    var typeBadge = isPhoto
      ? '<span class="chip" style="background:#fdf0e3;color:#b06000;">📷 사진</span>'
      : '<span class="chip" style="background:#fce8e6;color:#d93025;">📱 번호</span>';
    var actions = '';
    if (incoming && (st === 'pending' || st === 'held')) {
      /* 받은 요청: 승인/보류/거절 (보류 상태에서도 다시 결정 가능) */
      actions =
        '<div class="mine-actions">' +
          '<button type="button" class="card-btn primary" data-action="user-approve" data-id="' + escapeHtml(r.id) + '">승인</button>' +
          '<button type="button" class="card-btn" data-action="user-hold" data-id="' + escapeHtml(r.id) + '">보류</button>' +
          '<button type="button" class="card-btn danger" data-action="user-reject" data-id="' + escapeHtml(r.id) + '">거절</button>' +
        '</div>';
    } else if (!incoming && st === 'pending') {
      actions =
        '<div class="mine-actions">' +
          '<button type="button" class="card-btn" data-action="cancel-sent" data-id="' + escapeHtml(r.id) + '">요청 취소</button>' +
        '</div>';
    } else if (!incoming && st === 'held') {
      /* 보낸 요청이 보류됨 → 정보 담아 다시 요청 가능 */
      actions =
        '<div class="mine-actions">' +
          '<button type="button" class="card-btn primary" data-action="reapply" data-id="' + escapeHtml(r.id) + '">다시 요청</button>' +
          '<button type="button" class="card-btn" data-action="cancel-sent" data-id="' + escapeHtml(r.id) + '">요청 취소</button>' +
        '</div>';
    } else if (!incoming && st === 'rejected') {
      /* 보낸 요청이 거절됨 → 정보 담아 다시 요청 가능 */
      actions =
        '<div class="mine-actions">' +
          '<button type="button" class="card-btn primary" data-action="reapply" data-id="' + escapeHtml(r.id) + '">다시 요청</button>' +
          '<button type="button" class="card-btn" data-action="hide-request" data-id="' + escapeHtml(r.id) + '">내역 삭제</button>' +
        '</div>';
    } else if (st === 'approved' || st === 'rejected') {
      /* (받은 요청 처리 완료 또는 승인된 보낸 요청) 내역 삭제 */
      actions =
        '<div class="mine-actions">' +
          '<button type="button" class="card-btn" data-action="hide-request" data-id="' + escapeHtml(r.id) + '">내역 삭제</button>' +
        '</div>';
    }
    /* 답장 메시지 표시 */
    var replyMsg = '';
    if (st === 'approved' && r.approveMessage) replyMsg = '<div class="mine-note">답장: ' + escapeHtml(r.approveMessage) + '</div>';
    else if (st === 'held' && r.holdMessage) replyMsg = '<div class="mine-note">보류 메시지: ' + escapeHtml(r.holdMessage) + '</div>';
    else if (st === 'rejected' && r.rejectMessage) replyMsg = '<div class="mine-note reject">거절 메시지: ' + escapeHtml(r.rejectMessage) + '</div>';
    return (
      '<div class="mine-item">' +
        '<div class="mine-head">' + typeBadge + '<b>' + escapeHtml(otherLabel) + '</b>' + statusChip(st) +
          '<span class="mine-date">' + fmtDate(r.submittedAt) + '</span></div>' +
        (note ? '<div class="mine-note">"' + escapeHtml(note) + '"</div>' : '') +
        replyMsg +
        actions +
      '</div>'
    );
  }

  function renderMine(state) {
    var me = findMyEntry(state);
    var myPending = findMyPending(state);
    if (!me && myPending) {
      return (
        '<div class="admin-panel">' +
          '<h2>신청 현황</h2>' +
          '<div class="mine-status-box">' +
            '<div class="mine-status-icon">⏳</div>' +
            '<h3>승인 대기 중이에요</h3>' +
            '<p class="sub">관리자(베니)가 신청서를 확인하고 있어요. 승인되면 명단에 등록되고, 사진/번호 요청을 주고받을 수 있어요.</p>' +
            '<p class="sub" style="margin-top:8px;">신청일: ' + fmtDate(myPending.submittedAt) + '</p>' +
          '</div>' +
        '</div>'
      );
    }
    if (!me) {
      return '<div class="admin-panel"><h2>신청 현황</h2><p class="sub">신청 정보를 찾을 수 없어요. 다시 로그인해주세요.</p></div>';
    }
    var reqs = state.dateRequests || [];
    var groups = [
      { key: 'in-photo', title: '📷 받은 사진 요청', incoming: true, type: 'photo' },
      { key: 'in-contact', title: '📱 받은 번호 요청', incoming: true, type: 'contact' },
      { key: 'out-photo', title: '📷 보낸 사진 요청', incoming: false, type: 'photo' },
      { key: 'out-contact', title: '📱 보낸 번호 요청', incoming: false, type: 'contact' }
    ];
    var sections = groups.map(function (g) {
      var items = reqs.filter(function (r) {
        if ((r.type || 'contact') !== g.type) return false;
        if ((r.hiddenBy || []).indexOf(me.id) >= 0) return false;
        return g.incoming ? r.toId === me.id : r.fromId === me.id;
      }).sort(function (a, b) { return (b.submittedAt || '').localeCompare(a.submittedAt || ''); });
      var body = items.length
        ? items.map(function (r) { return reqRowHtml(r, state, g.incoming); }).join('')
        : '<p class="sub" style="margin:0;">아직 없어요.</p>';
      return (
        '<div class="mine-section">' +
          '<h3>' + g.title + '<span class="count">' + items.length + '</span></h3>' +
          body +
        '</div>'
      );
    }).join('');
    return (
      '<div class="admin-panel">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">' +
          '<h2 style="margin:0;">신청 현황</h2>' +
          '<button type="button" class="card-btn" id="change-my-pin" style="flex:none;">🔑 PIN 변경</button>' +
        '</div>' +
        '<div class="my-uid">고유번호 ' + escapeHtml(formatUid(me) || '—') + '</div>' +
        '<p class="sub">' + escapeHtml(me.nickname) + '님, 반가워요! 받은 요청은 직접 승인하거나 거절할 수 있어요.</p>' +
        sections +
      '</div>'
    );
  }

  function renderAdmin(state) {
    if (!isAdminUnlocked) {
      return '<div class="admin-panel"><h2>관리자 모드</h2><p class="sub">위쪽 "관리자" 버튼으로 PIN을 입력하면 승인 대기 명단, 실명, 연락처, 소개자, 데이트 신청함을 볼 수 있어요.</p></div>';
    }
    var pending = state.pendingEntries || [];
    var pendingItems = pending.map(function (e) {
      var displayName = e.nickname || e.name || '(이름 없음)';
      var ageStr = e.birthYear ? (String(e.birthYear).slice(2) + '년생') : '-';
      var deg = degreeLabel(e.degreeChoice || e.degree);
      return (
        '<div class="pending-item">' +
          '<div class="p-name">' + escapeHtml(displayName) + '</div>' +
          '<div class="p-meta">' + genderLabel(e.gender) + ' · ' + escapeHtml(ageStr) + ' · ' + escapeHtml(e.region || '') + ' · ' + escapeHtml(deg) + '</div>' +
          '<div class="pending-actions">' +
            '<button type="button" class="card-btn" data-action="detail-pending" data-id="' + escapeHtml(e.id) + '">상세 보기</button>' +
            '<button type="button" class="card-btn approve" data-action="approve" data-id="' + escapeHtml(e.id) + '">승인</button>' +
            '<button type="button" class="card-btn danger" data-action="reject" data-id="' + escapeHtml(e.id) + '">거절</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    var pendingSection =
      '<div class="pending-section">' +
        '<h2>승인 대기<span class="pending-count">' + pending.length + '</span></h2>' +
        (pending.length ? pendingItems : '<p class="sub">대기 중인 신청이 없어요.</p>') +
      '</div>';
    var allEntries = state.entries;
    var uidOf = function (eid) {
      var e = allEntries.find(function (x) { return x.id === eid; });
      return e ? (formatUid(e) || 'No.—') : '???';
    };
    var reqs = state.dateRequests || [];
    var nameOf = function (eid) {
      var e = allEntries.find(function (x) { return x.id === eid; });
      return e ? e.nickname : '(알 수 없음)';
    };
    var adminReqRow = function (r) {
      var d = decryptedRequests[r.id];
      var reqType = r.type || 'contact';
      var typeBadge = reqType === 'photo'
        ? '<span class="chip" style="background:#e8f0fe;color:#1a73e8;">📷 사진</span>'
        : '<span class="chip" style="background:#fce8e6;color:#d93025;">📱 번호</span>';
      var fromId = r.fromId || (d && d.fromId);
      var toId = r.toId || (d && d.toId);
      var fromName = (d && d.fromName) || nameOf(fromId);
      var toName = (d && d.toName) || nameOf(toId);
      var note = reqNote(r);
      var needsDecrypt = (typeof r.note !== 'string') && !d && r.ciphertext;
      var body =
        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' + typeBadge +
        '<div class="who" style="display:inline;">' +
          '<button type="button" class="card-btn" data-action="detail" data-id="' + escapeHtml(fromId || '') + '" style="flex:none;display:inline-flex;padding:4px 10px;">' + escapeHtml(uidOf(fromId)) + ' ' + escapeHtml(fromName) + '</button>' +
          ' → ' +
          '<button type="button" class="card-btn" data-action="detail" data-id="' + escapeHtml(toId || '') + '" style="flex:none;display:inline-flex;padding:4px 10px;">' + escapeHtml(uidOf(toId)) + ' ' + escapeHtml(toName) + '</button>' +
        '</div></div>' +
        (needsDecrypt ? '<div class="note">복호화 중...</div>' : (note ? '<div class="note">"' + escapeHtml(note) + '"</div>' : '')) +
        (r.approveMessage ? '<div class="note" style="color:#137333;">답장: ' + escapeHtml(r.approveMessage) + '</div>' : '') +
        (r.held && r.holdMessage ? '<div class="note" style="color:#b06000;">보류 메시지: ' + escapeHtml(r.holdMessage) + '</div>' : '') +
        (r.rejected && r.rejectMessage ? '<div class="note" style="color:#c5221f;">거절 메시지: ' + escapeHtml(r.rejectMessage) + '</div>' : '');
      var st = reqStatus(r);
      var decideBtns =
        '<button type="button" class="card-btn approve" data-action="approve-request" data-id="' + escapeHtml(r.id) + '" style="flex:none;">승인</button>' +
        '<button type="button" class="card-btn" data-action="hold-request" data-id="' + escapeHtml(r.id) + '" style="flex:none;">보류</button>' +
        '<button type="button" class="card-btn danger" data-action="reject-request" data-id="' + escapeHtml(r.id) + '" style="flex:none;">거절</button>';
      var actionBtns;
      if (st === 'approved') {
        actionBtns = statusChip(st) +
          '<button type="button" class="card-btn danger" data-action="delete-request" data-id="' + escapeHtml(r.id) + '" style="flex:none;">삭제</button>';
      } else if (st === 'rejected') {
        actionBtns = statusChip(st) +
          '<span class="chip" style="background:#f1f3f4;color:#5f6368;">' + (r.rejectedBy === 'user' ? '본인 거절' : '관리자 거절') + '</span>' +
          '<button type="button" class="card-btn danger" data-action="delete-request" data-id="' + escapeHtml(r.id) + '" style="flex:none;">삭제</button>';
      } else {
        /* pending / held / user_approved → 관리자가 승인/보류/거절 가능 */
        actionBtns = statusChip(st) + decideBtns;
      }
      return (
        '<div class="request-item">' +
          '<div>' + body + '</div>' +
          '<div class="req-foot">' +
            '<span class="when">' + new Date(r.submittedAt).toLocaleString('ko-KR') + '</span>' +
            actionBtns +
          '</div>' +
        '</div>'
      );
    };
    var isDone = function (r) { var st = reqStatus(r); return st === 'approved' || st === 'rejected'; };
    var activeReqs = reqs.filter(function (r) { return !isDone(r); });
    var doneReqs = reqs.filter(isDone).sort(function (a, b) { return (b.decidedAt || b.submittedAt || '').localeCompare(a.decidedAt || a.submittedAt || ''); });
    var activeItems = activeReqs.map(adminReqRow).join('');
    var doneItems = doneReqs.map(adminReqRow).join('');
    var doneSection = doneReqs.length
      ? '<details style="margin-top:12px;"><summary style="cursor:pointer;font-weight:700;font-size:0.95rem;">✅ 요청완료 (' + doneReqs.length + ')</summary>' +
          '<div style="margin-top:10px;">' + doneItems + '</div></details>'
      : '';

    /* 접속 기록 */
    var seenRows = allEntries.slice().sort(function (a, b) {
      return (b.lastSeenAt || '').localeCompare(a.lastSeenAt || '');
    }).map(function (e) {
      return '<tr><td><b style="font-variant-numeric:tabular-nums;">' + escapeHtml(formatUid(e) || '—') + '</b> ' + escapeHtml(e.nickname) + '</td>' +
        '<td class="seen-date">' + (e.lastSeenAt ? new Date(e.lastSeenAt).toLocaleString('ko-KR') : '기록 없음') + '</td></tr>';
    }).join('');
    var seenSection =
      '<h2>👣 최근 접속</h2>' +
      '<p class="sub">회원별 마지막 로그인 시각이에요.</p>' +
      (allEntries.length
        ? '<div class="log-list"><table class="seen-table"><thead><tr><th>고유번호 · 닉네임</th><th>마지막 접속</th></tr></thead><tbody>' + seenRows + '</tbody></table></div>'
        : '<p class="sub">등록된 사람이 없어요.</p>');

    /* 서버 용량 */
    var capSection = capacityHtml(state);

    /* 활동 로그 */
    var logs = (state.logs || []).slice().reverse();
    var logRows = logs.map(function (l) {
      return '<div class="log-row">' +
        '<span class="log-time">' + fmtDate(l.at) + '</span>' +
        '<span class="log-actor">' + escapeHtml(l.actor || '-') + '</span>' +
        '<span class="log-detail">' + escapeHtml(l.detail || '') + '</span>' +
      '</div>';
    }).join('');
    var logSection =
      '<h2>📜 활동 기록</h2>' +
      '<p class="sub">최근 ' + LOG_LIMIT + '건까지 보관돼요. (관리자만 볼 수 있어요)</p>' +
      (logs.length ? '<div class="log-list">' + logRows + '</div>' : '<p class="sub">아직 기록이 없어요.</p>');

    return (
      '<div class="admin-panel">' +
        '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">' +
          '<button type="button" class="card-btn" id="admin-change-pw" style="flex:none;">🔑 비밀번호 변경</button>' +
        '</div>' +
        pendingSection +
        '<hr class="perforation">' +
        '<h2>📬 요청함<span class="pending-count">' + activeReqs.length + '</span></h2>' +
        '<p class="sub">아직 처리하지 않은 사진/번호 요청이에요.</p>' +
        (activeReqs.length ? activeItems : '<p class="sub">처리할 요청이 없어요.</p>') +
        doneSection +
        '<hr class="perforation">' +
        capSection +
        '<hr class="perforation">' +
        seenSection +
        '<hr class="perforation">' +
        logSection +
      '</div>'
    );
  }

  /* ---- 서버 용량 ---- */
  var DOC_LIMIT = 1048576; /* Firestore 문서 1개 최대 1MiB */
  function byteLen(obj) {
    try { return textEnc.encode(typeof obj === 'string' ? obj : JSON.stringify(obj)).length; }
    catch (e) { return 0; }
  }
  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }
  function capacityHtml(state) {
    /* 사진은 photos/{id} 별도 문서로 분리됨. 이 표는 1MB 한계가 걸리는
       메인 문서(app/state = 회원 텍스트+썸네일+요청+로그)만 측정 */
    var total = byteLen(state);
    var thumbBytes = 0, thumbCount = 0;
    (state.entries || []).concat(state.pendingEntries || []).forEach(function (e) {
      if (e.photoThumb) { thumbBytes += byteLen(e.photoThumb); thumbCount++; }
      getPhotos(e).forEach(function (p) { thumbBytes += byteLen(p); }); /* 아직 마이그레이션 안 된 inline */
    });
    var logBytes = byteLen(state.logs || []);
    var reqBytes = byteLen(state.dateRequests || []);
    var otherBytes = Math.max(0, total - thumbBytes - logBytes - reqBytes);
    var pct = Math.min(100, (total / DOC_LIMIT) * 100);
    var barColor = pct > 85 ? '#c5221f' : pct > 60 ? '#E08A2E' : '#3F8C6E';
    var people = (state.entries || []).length + (state.pendingEntries || []).length;
    var avgPerPerson = people ? Math.round(total / people) : 0;
    var roomLeft = DOC_LIMIT - total;
    var morePeople = avgPerPerson ? Math.floor(roomLeft / avgPerPerson) : '-';
    var warn = '';
    if (pct > 85) warn = '<p class="sub" style="color:#c5221f;margin-top:10px;">⚠️ 메인 문서가 거의 찼어요. 회원 텍스트를 버킷으로 나눌 때가 됐어요.</p>';
    else if (pct > 60) warn = '<p class="sub" style="color:#b06000;margin-top:10px;">메인 문서 사용량이 절반을 넘었어요.</p>';
    return (
      '<h2>💾 서버 용량 (메인 문서)</h2>' +
      '<p class="sub">사진은 회원별 문서로 분리 저장돼요. 이 표는 1MB 한계가 걸리는 메인 문서(회원 텍스트·썸네일·요청·로그)만 표시해요.</p>' +
      '<div class="cap-bar"><div class="cap-fill" style="width:' + pct.toFixed(1) + '%;background:' + barColor + ';"></div></div>' +
      '<div class="cap-total">' + fmtBytes(total) + ' / 1 MB 사용 중 <b>(' + pct.toFixed(1) + '%)</b> · 남은 용량 ' + fmtBytes(roomLeft) + '</div>' +
      '<table class="seen-table" style="margin-top:12px;">' +
        '<tbody>' +
          '<tr><td>🖼️ 썸네일/inline 사진 ' + thumbCount + '개</td><td class="seen-date">' + fmtBytes(thumbBytes) + '</td></tr>' +
          '<tr><td>📬 요청 ' + (state.dateRequests || []).length + '건</td><td class="seen-date">' + fmtBytes(reqBytes) + '</td></tr>' +
          '<tr><td>📜 활동 기록 ' + (state.logs || []).length + '건</td><td class="seen-date">' + fmtBytes(logBytes) + '</td></tr>' +
          '<tr><td>그 외 (프로필 텍스트 등)</td><td class="seen-date">' + fmtBytes(otherBytes) + '</td></tr>' +
          '<tr><td><b>1인당 평균</b></td><td class="seen-date"><b>' + fmtBytes(avgPerPerson) + '</b></td></tr>' +
          '<tr><td><b>메인 문서에 더 담을 수 있는 인원 (추정)</b></td><td class="seen-date"><b>약 ' + morePeople + '명</b></td></tr>' +
        '</tbody>' +
      '</table>' +
      warn
    );
  }

  function renderApp(state) {
    var entries = state.entries || [];
    var pendingCount = (state.pendingEntries || []).length;
    var reqCount = (state.dateRequests || []).filter(function (r) {
      var st = reqStatus(r); return st !== 'approved' && st !== 'rejected';
    }).length;
    var tabs =
      '<button type="button" class="tab-btn" data-tab="form" role="tab" aria-selected="' + (activeTab === 'form') + '">신청서 작성</button>' +
      '<button type="button" class="tab-btn" data-tab="list" role="tab" aria-selected="' + (activeTab === 'list') + '">명단 보기<span class="count">' + entries.length + '</span></button>';
    if (currentUser) {
      var myEntry = findMyEntry(state);
      var pendingBadge = '';
      if (myEntry) {
        var incoming = (state.dateRequests || []).filter(function (r) {
          return r.toId === myEntry.id && reqStatus(r) === 'pending';
        }).length;
        if (incoming) pendingBadge = '<span class="count" title="새 요청">' + incoming + '</span>';
      }
      tabs += '<button type="button" class="tab-btn" data-tab="mine" role="tab" aria-selected="' + (activeTab === 'mine') + '">신청 현황' + pendingBadge + '</button>';
    }
    if (isAdminUnlocked) {
      tabs += '<button type="button" class="tab-btn" data-tab="admin" role="tab" aria-selected="' + (activeTab === 'admin') + '">관리자' +
        '<span class="count' + (pendingCount >= 1 ? ' blink' : '') + '" title="승인 대기">대기 ' + pendingCount + '</span>' +
        '<span class="count" title="요청">요청 ' + reqCount + '</span></button>';
    }
    var panel;
    if (activeTab === 'list') panel = renderList(state);
    else if (activeTab === 'mine' && currentUser) panel = renderMine(state);
    else if (activeTab === 'admin' && isAdminUnlocked) panel = renderAdmin(state);
    else panel = renderForm(state);
    return (
      '<div class="masthead"><div class="masthead-inner">' +
        '<div class="masthead-icon">' + ICON_HEART + '</div>' +
        '<div><h1 id="masthead-title" title="새로고침" style="cursor:pointer;">인연 접수처</h1><p>관리자 베니(<a href="https://instagram.com/benny3_song" target="_blank" rel="noopener" style="color:var(--gold);text-decoration:underline">@benny3_song</a>)의 친구를 소개하는, 작은 신청 창구에요.</p></div>' +
      '</div>' +
      '<div class="admin-bar">' +
        '<div class="admin-bar-row">' +
          '<button type="button" class="admin-link" id="copy-url">&#128279; URL 복사</button>' +
          (isStandalone() ? '' : '<button type="button" class="admin-link" id="add-home">&#128241; 바로가기 추가</button>') +
          '<button type="button" class="admin-link" id="show-notice">&#128227; 공지사항</button>' +
          (NOTIF_ENABLED
            ? '<button type="button" class="admin-link' + (notifOn() ? ' unlocked' : '') + '" id="notif-toggle">' +
              (notifOn() ? '&#128276; 알림 켜짐' : '&#128276; 알림 켜기') + '</button>' +
              '<button type="button" class="admin-link" id="notif-help" title="알림 켜는 법" style="padding:6px 11px;">&#10067;</button>'
            : '') +
        '</div>' +
        '<div class="admin-bar-row">' +
          (currentUser
            ? '<button type="button" class="admin-link unlocked" id="user-logout">' + ICON_UNLOCK + ' ' + escapeHtml(currentUser.nickname) + ' · 로그아웃</button>'
            : '<button type="button" class="admin-link" id="user-login">' + ICON_LOCK + ' 로그인</button>') +
          '<button type="button" class="admin-link' + (isAdminUnlocked ? ' unlocked' : '') + '" id="admin-toggle">' +
            (isAdminUnlocked ? ICON_UNLOCK + ' 관리자 모드' : ICON_LOCK + ' 관리자') +
          '</button>' +
        '</div>' +
      '</div></div>' +
      '<div class="notice-bar">' +
        '<span class="notice-icon">&#128227;</span> 요청이 오거나 승인·거절되면 알림으로 바로 알려드려요. 위 <b>&#128276; 알림 켜기</b> 를 눌러 켜보세요! (켜는 법은 <b>&#10067;</b>)' +
      '</div>' +
      '<div class="page">' +
        '<div class="tabs" role="tablist">' + tabs + '</div>' +
        '<div id="tab-panel">' + panel + '</div>' +
      '</div>'
    );
  }

  /* ---- state & paint ---- */
  function paint(state) {
    currentState = state;
    document.getElementById('app').innerHTML = renderApp(state);
    maybeRestoreDraft();
  }

  /* 신청서를 작성 중이면(포커스/입력/사진 있음) 배경 갱신으로 화면을 다시 그리지 않음
     — 다른 사람 활동으로 인한 실시간 갱신이 입력 중인 폼을 지우는 문제 방지 */
  function isEditingForm() {
    if (activeTab !== 'form') return false;
    var form = document.getElementById('entry-form');
    if (!form) return false;
    if (form.contains(document.activeElement)) return true;
    if (photoDataUrls && photoDataUrls.length) return true;
    var fields = form.querySelectorAll('input, textarea, select');
    for (var i = 0; i < fields.length; i++) {
      var el = fields[i];
      if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) return true; }
      else if ((el.value || '').trim()) return true;
    }
    return false;
  }

  /* ---- 신청서 임시 저장 (새로고침/이동/오류로도 안 날아가게) ---- */
  var DRAFT_KEY = 'form-draft-v1';
  function saveDraft() {
    if (editingEntryId) return; /* 신규 작성만 */
    var form = document.getElementById('entry-form');
    if (!form) return;
    try {
      var g = function (n) { var el = form.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
      var radio = function (n) { var el = form.querySelector('[name="' + n + '"]:checked'); return el ? el.value : ''; };
      var draft = {
        nickname: g('nickname'), realName: g('realName'), contact: g('contact'),
        gender: radio('gender'), birthYear: g('birthYear'), region: g('region'),
        workplace: g('workplace'), referrerText: g('referrerText'), degreeChoice: radio('degreeChoice'),
        height: g('height'), intro: g('intro'), idealType: g('idealType'), dealbreaker: g('dealbreaker'),
        photos: (photoDataUrls || []).slice(), savedAt: Date.now()
      };
      /* PIN은 민감정보라 저장하지 않음 */
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    } catch (e) {}
  }
  function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  function draftHasContent(d) {
    return !!(d && (d.nickname || d.realName || d.contact || d.region || d.workplace ||
      d.intro || d.idealType || d.dealbreaker || d.height || d.birthYear ||
      d.gender || d.degreeChoice || (d.photos && d.photos.length)));
  }
  function maybeRestoreDraft() {
    if (editingEntryId) return;
    var form = document.getElementById('entry-form');
    if (!form) return;
    var nick = form.querySelector('[name="nickname"]');
    if (!nick || nick.value) return; /* 이미 채워져 있으면 건드리지 않음 */
    var d = loadDraft();
    if (!draftHasContent(d)) return;
    var setVal = function (n, v) { var el = form.querySelector('[name="' + n + '"]'); if (el && v) el.value = v; };
    setVal('nickname', d.nickname); setVal('realName', d.realName); setVal('contact', d.contact);
    setVal('birthYear', d.birthYear); setVal('region', d.region); setVal('workplace', d.workplace);
    setVal('referrerText', d.referrerText); setVal('height', d.height);
    setVal('intro', d.intro); setVal('idealType', d.idealType); setVal('dealbreaker', d.dealbreaker);
    if (d.gender) { var gr = form.querySelector('[name="gender"][value="' + d.gender + '"]'); if (gr) gr.checked = true; }
    if (d.degreeChoice) { var dr = form.querySelector('[name="degreeChoice"][value="' + d.degreeChoice + '"]'); if (dr) dr.checked = true; }
    if (d.photos && d.photos.length) { photoDataUrls = d.photos.slice(); renderPhotoThumbs(); }
    var lede = form.parentNode.querySelector('.form-lede');
    if (lede && !document.getElementById('draft-restored-note')) {
      var note = document.createElement('div');
      note.id = 'draft-restored-note';
      note.className = 'readonly-note';
      note.style.cssText = 'background:var(--gold-soft);border-color:var(--gold);margin-top:10px;';
      note.innerHTML = '&#128190; 작성 중이던 내용을 불러왔어요. <button type="button" class="card-btn" id="draft-clear" style="margin-left:8px;padding:4px 12px;">새로 쓰기</button>';
      lede.parentNode.insertBefore(note, lede.nextSibling);
    }
  }

  function saveState(state) {
    currentState = state;
    return stateRef.set(JSON.parse(JSON.stringify(state)));
  }

  function decryptAllAdminData(state) {
    if (!isAdminUnlocked || !adminPrivateKey) return Promise.resolve();
    var promises = [];
    (state.entries || []).forEach(function (entry) {
      if (entry.contactEnc && !decryptedContacts[entry.id]) {
        promises.push(decryptWithAdmin(adminPrivateKey, entry.contactEnc).then(function (v) { decryptedContacts[entry.id] = v; }).catch(function () {}));
      }
    });
    (state.dateRequests || []).forEach(function (req) {
      if (!decryptedRequests[req.id] && req.ciphertext) {
        promises.push(decryptWithAdmin(adminPrivateKey, { iv: req.iv, ciphertext: req.ciphertext, wrappedKey: req.wrappedKey }).then(function (v) { decryptedRequests[req.id] = v; }).catch(function () {}));
      }
    });
    return Promise.all(promises);
  }

  /* ---- event handlers ---- */
  function handleAdminToggle() {
    var state = currentState;
    if (isAdminUnlocked) {
      isAdminUnlocked = false;
      adminPrivateKey = null;
      decryptedContacts = {};
      decryptedRequests = {};
      try { sessionStorage.removeItem('adminPin'); } catch (e) {}
      if (activeTab === 'admin') activeTab = 'form';
      paint(state);
      return;
    }
    if (!state.adminAuth) {
      modalPinSetup().then(function (r) {
        if (!r) return;
        var pwErr = adminPwError(r.p1);
        if (pwErr) return modalNotice('오류', pwErr);
        if (r.p1 !== r.p2) return modalNotice('오류', '비밀번호가 일치하지 않아요.');
        setupAdminPin(r.p1).then(function (auth) {
          state.adminAuth = auth;
          return saveState(state).then(function () {
            return unlockAdminKey(r.p1, auth);
          });
        }).then(function (key) {
          adminPrivateKey = key;
          isAdminUnlocked = true; requestNotifPermission();
          try { sessionStorage.setItem('adminPin', r.p1); } catch (e) {}
          return decryptAllAdminData(state);
        }).then(function () {
          paint(state);
        });
      });
      return;
    }
    modalPin('관리자 인증', '비밀번호를 입력하세요.', { password: true }).then(function (pin) {
      if (!pin) return;
      unlockAdminKey(pin, state.adminAuth).then(function (key) {
        adminPrivateKey = key;
        isAdminUnlocked = true;
        try { sessionStorage.setItem('adminPin', pin); } catch (e) {}
        return decryptAllAdminData(state);
      }).then(function () {
        paint(state);
      }).catch(function () {
        modalNotice('오류', '비밀번호가 올바르지 않아요.');
      });
    });
  }

  function handleChangeAdminPw() {
    var state = currentState;
    if (!isAdminUnlocked || !adminPrivateKey || !state.adminAuth) {
      return modalNotice('안내', '관리자 모드에서만 변경할 수 있어요.');
    }
    modalPinSetup().then(function (r) {
      if (!r) return;
      var pwErr = adminPwError(r.p1);
      if (pwErr) return modalNotice('오류', pwErr);
      if (r.p1 !== r.p2) return modalNotice('오류', '비밀번호가 일치하지 않아요.');
      rewrapAdminKey(r.p1, state.adminAuth, adminPrivateKey).then(function (auth) {
        return stateRef.update({ adminAuth: auth }).then(function () {
          state.adminAuth = auth;
          try { sessionStorage.setItem('adminPin', r.p1); } catch (e) {}
          appendLog('admin', '관리자', '비밀번호 변경');
          modalNotice('완료', '관리자 비밀번호가 변경되었어요.');
        });
      }).catch(function (err) {
        modalNotice('오류', '변경에 실패했어요: ' + (err.message || err));
      });
    });
  }

  /* 숫자 PIN 설정 모달 (신규/확인) */
  function modalNumericPinSetup(title, message) {
    return new Promise(function (resolve) {
      var overlay = openModal(
        '<h3>' + escapeHtml(title) + '</h3>' +
        '<p class="modal-msg">' + escapeHtml(message) + '</p>' +
        '<input type="text" inputmode="numeric" class="modal-input" id="np1" data-numeric maxlength="8" placeholder="새 PIN (숫자 4~8자리)">' +
        '<input type="text" inputmode="numeric" class="modal-input" id="np2" data-numeric maxlength="8" placeholder="새 PIN 확인" style="margin-top:8px;">' +
        '<div class="modal-actions">' +
          '<button type="button" class="card-btn" id="modal-cancel">취소</button>' +
          '<button type="button" class="card-btn primary" id="modal-ok">변경</button>' +
        '</div>'
      );
      function finish(v) { closeModal(overlay); resolve(v); }
      overlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });
      overlay.querySelector('#modal-ok').addEventListener('click', function () {
        finish({ p1: overlay.querySelector('#np1').value.trim(), p2: overlay.querySelector('#np2').value.trim() });
      });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(null); });
    });
  }

  /* 로그인한 본인이 개인 PIN 변경 (연락처 자가암호화도 새 PIN으로 재암호화) */
  function handleChangeMyPin() {
    var me = findMyEntry(currentState);
    if (!me) return modalNotice('로그인 필요', '먼저 로그인해주세요.');
    modalNumericPinSetup('PIN 변경', '새로 사용할 개인 PIN을 입력해주세요.').then(function (r) {
      if (!r) return;
      if (!/^[0-9]{4,8}$/.test(r.p1)) return modalNotice('입력 오류', 'PIN은 숫자 4~8자리예요.');
      if (r.p1 !== r.p2) return modalNotice('오류', 'PIN이 일치하지 않아요.');
      myContact().then(function (contact) {
        return Promise.all([
          makePinAuth(r.p1),
          contact ? encryptForSelf(r.p1, contact) : Promise.resolve(null)
        ]).then(function (res) {
          var newAuth = res[0], newSelf = res[1];
          return db.runTransaction(function (tx) {
            return tx.get(stateRef).then(function (doc) {
              var s = doc.data();
              var entries = (s.entries || []).map(function (e) {
                if (e.id !== me.id) return e;
                var c = JSON.parse(JSON.stringify(e));
                c.pinAuth = newAuth;
                delete c.pinHash;
                delete c.pinEnc;
                if (newSelf) c.contactSelfEnc = newSelf;
                return c;
              });
              tx.update(stateRef, { entries: entries });
            });
          });
        });
      }).then(function () {
        currentUser.pin = r.p1; saveSession();
        appendLog('edit', me.nickname, 'PIN 변경');
        return refreshNow();
      }).then(function () {
        modalNotice('완료', 'PIN이 변경되었어요.');
      }).catch(function (err) {
        modalNotice('오류', '변경에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleFormSubmit() {
    var state = currentState;
    if (!state.adminAuth) {
      modalNotice('안내', '관리자가 아직 PIN을 설정하지 않았어요. 관리자에게 문의해주세요.');
      return;
    }
    var form = document.getElementById('entry-form');
    var nickname = (form.querySelector('[name="nickname"]').value || '').trim();
    var realName = (form.querySelector('[name="realName"]').value || '').trim();
    var contact = (form.querySelector('[name="contact"]').value || '').trim();
    var genderEl = form.querySelector('[name="gender"]:checked');
    var gender = genderEl ? genderEl.value : '';
    var birthYear = parseInt(form.querySelector('[name="birthYear"]').value, 10);
    var region = (form.querySelector('[name="region"]').value || '').trim();
    var workplace = (form.querySelector('[name="workplace"]').value || '').trim();
    var referrerText = (form.querySelector('[name="referrerText"]').value || '').trim();
    var degreeEl = form.querySelector('[name="degreeChoice"]:checked');
    var degreeChoice = degreeEl ? degreeEl.value : '';
    var pin = (form.querySelector('[name="pin"]').value || '').trim();
    var height = (form.querySelector('[name="height"]').value || '').trim();
    var intro = (form.querySelector('[name="intro"]').value || '').trim();
    var idealType = (form.querySelector('[name="idealType"]').value || '').trim();
    var dealbreaker = (form.querySelector('[name="dealbreaker"]').value || '').trim();
    var blurPhoto = form.querySelector('#f-blur') ? form.querySelector('#f-blur').checked : false;

    var isEdit = !!editingEntryId;
    var origEntry = isEdit ? (state.entries || []).find(function (e) { return e.id === editingEntryId; }) : null;

    var missing = [];
    if (!nickname) missing.push('닉네임');
    if (!gender) missing.push('성별');
    if (!birthYear) missing.push('생년');
    if (!region) missing.push('사는 곳');
    if (!workplace) missing.push('직장 위치');
    if (!degreeChoice) missing.push('베니와의 관계');
    if (!isEdit) {
      if (!realName) missing.push('실명');
      if (!contact) missing.push('전화번호');
      if (!referrerText) missing.push('소개자');
      if (!pin) missing.push('개인 PIN');
    }
    if (missing.length > 0) {
      modalNotice('입력 오류', '다음 항목을 채워주세요: ' + missing.join(', '));
      return;
    }
    if (!isEdit) {
      var consent = document.getElementById('f-consent');
      if (!consent || !consent.checked) {
        modalNotice('동의 필요', '개인정보 수집 및 이용에 동의해 주세요.');
        return;
      }
      var notifyAck = document.getElementById('f-notify-ack');
      if (!notifyAck || !notifyAck.checked) {
        modalNotice('확인 필요', '알림 기능이 준비 중임을 확인란에 체크해 주세요. (가끔 직접 로그인해 확인이 필요해요)');
        return;
      }
    }
    if (pin && pin.length < 4) {
      modalNotice('입력 오류', 'PIN은 4자리 이상이어야 해요.');
      return;
    }
    if (contact && !/^01[0-9]{8,9}$/.test(contact)) {
      modalNotice('입력 오류', '전화번호는 01012345678 형식으로 입력해주세요.');
      return;
    }
    /* 닉네임 중복 확인 (본인 제외) */
    var nickLower = nickname.toLowerCase();
    var dup = (state.entries || []).concat(state.pendingEntries || []).some(function (e) {
      return e.id !== editingEntryId && (e.nickname || '').trim().toLowerCase() === nickLower;
    });
    if (dup) {
      modalNotice('닉네임 중복', '이미 사용 중인 닉네임이에요. 다른 닉네임을 사용해주세요.');
      return;
    }
    if (isEdit && !formPhotosReady) {
      modalNotice('안내', '사진을 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }

    var btn = document.getElementById('submit-btn');
    var msg = document.getElementById('status-msg');
    btn.disabled = true;
    msg.textContent = isEdit ? '수정 중...' : '제출 중...';
    msg.className = 'status-msg';

    var pubJwk = state.adminAuth.publicKeyJwk;
    var entryId = (isEdit && origEntry) ? origEntry.id : genId();
    var finalPhotos = photoDataUrls.slice();

    var selfPin = pin || (currentUser && currentUser.id === entryId ? currentUser.pin : null);
    var encPromises = [
      realName ? encryptForAdmin(pubJwk, realName) : Promise.resolve(null),
      contact ? encryptForAdmin(pubJwk, contact) : Promise.resolve(null),
      referrerText ? encryptForAdmin(pubJwk, referrerText) : Promise.resolve(null),
      pin ? makePinAuth(pin) : Promise.resolve(null),
      (contact && selfPin) ? encryptForSelf(selfPin, contact) : Promise.resolve(null),
      finalPhotos.length ? resizeDataUrl(finalPhotos[0], THUMB_MAX, THUMB_MAX, THUMB_Q) : Promise.resolve(null)
    ];
    Promise.all(encPromises).then(function (results) {
      var thumb = results[5] || null;
      /* 원본 사진은 photos/{id} 별도 문서로 저장 (app/state는 썸네일만) */
      var photoWrite;
      if (finalPhotos.length) photoWrite = photosRef.doc(entryId).set({ photos: finalPhotos });
      else if (isEdit) photoWrite = photosRef.doc(entryId).delete().catch(function () {});
      else photoWrite = Promise.resolve();
      return photoWrite.then(function () {
        photoCache[entryId] = finalPhotos;
        if (isEdit && origEntry) {
          var updated = {
            id: origEntry.id,
            nickname: nickname,
            gender: gender,
            birthYear: birthYear,
            region: region,
            workplace: workplace,
            photoThumb: thumb,
            photoCount: finalPhotos.length,
            blurPhoto: blurPhoto && finalPhotos.length > 0,
            height: height,
            intro: intro,
            idealType: idealType,
            dealbreaker: dealbreaker,
            realNameEnc: results[0] || origEntry.realNameEnc || null,
            contactEnc: results[1] || origEntry.contactEnc || null,
            referrerEnc: results[2] || origEntry.referrerEnc || null,
            degreeChoice: degreeChoice,
            contactSelfEnc: results[4] || origEntry.contactSelfEnc || null,
            lastSeenAt: origEntry.lastSeenAt || null,
            submittedAt: origEntry.submittedAt
          };
          /* PIN: 새로 입력했으면 신형(pinAuth)으로, 아니면 기존 형식 유지 (undefined 금지) */
          if (results[3]) updated.pinAuth = results[3];
          else if (origEntry.pinAuth) updated.pinAuth = origEntry.pinAuth;
          else if (origEntry.pinHash) updated.pinHash = origEntry.pinHash;
          if (origEntry.serial) updated.serial = origEntry.serial;
          return db.runTransaction(function (tx) {
            return tx.get(stateRef).then(function (doc) {
              var s = doc.data();
              var newEntries = (s.entries || []).map(function (e) { return e.id === editingEntryId ? updated : e; });
              tx.update(stateRef, { entries: newEntries });
            });
          });
        } else {
          var entry = {
            id: entryId,
            nickname: nickname,
            gender: gender,
            birthYear: birthYear,
            region: region,
            workplace: workplace,
            photoThumb: thumb,
            photoCount: finalPhotos.length,
            blurPhoto: blurPhoto && finalPhotos.length > 0,
            height: height,
            intro: intro,
            idealType: idealType,
            dealbreaker: dealbreaker,
            realNameEnc: results[0],
            contactEnc: results[1],
            referrerEnc: results[2],
            degreeChoice: degreeChoice,
            pinAuth: results[3],
            contactSelfEnc: results[4],
            submittedAt: new Date().toISOString()
          };
          return stateRef.update({
            pendingEntries: firebase.firestore.FieldValue.arrayUnion(entry)
          });
        }
      });
    }).then(function () {
      photoDataUrls = [];
      if (isEdit) {
        editingEntryId = null;
        appendLog('edit', nickname, '프로필 수정');
        notifyAdmin('프로필 수정', nickname + '님이 프로필을 수정했어요.');
        modalNotice('완료', '프로필이 수정되었어요.');
        activeTab = 'list';
        paint(currentState);
      } else {
        editingEntryId = null;
        clearDraft(); /* 제출 성공 → 임시저장 삭제 */
        currentUser = { id: entryId, nickname: nickname, pin: pin };
        saveSession();
        appendLog('signup', nickname, '신청서 제출');
        notifyAdmin('새 신청서 접수', nickname + '님이 신청서를 제출했어요! 승인 대기 중.');
        showStamp();
      }
    }).catch(function (err) {
      btn.disabled = false;
      msg.textContent = '오류가 발생했어요: ' + (err.message || err);
      msg.className = 'status-msg error';
    });
  }

  function showStamp() {
    var overlay = openModal(
      '<div style="text-align:center;">' +
        '<div class="stamp-ring" style="margin:0 auto 16px;">' + ICON_STAMP + '</div>' +
        '<h3>접수 완료!</h3>' +
        '<p class="modal-msg" style="margin-bottom:4px;">관리자에게 승인 요청이 전달되었어요!</p>' +
        '<p style="font-size:0.82rem;color:var(--muted);margin:0 0 20px;">승인 후 명단에 올라갑니다.</p>' +
        '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인</button></div>' +
      '</div>'
    );
    function finish() {
      closeModal(overlay);
      activeTab = 'list';
      paint(currentState);
    }
    overlay.querySelector('#modal-ok').addEventListener('click', finish);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(); });
  }

  function handleEdit(id) {
    var state = currentState;
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    if (isAdminUnlocked) {
      startEditing(entry);
      return;
    }
    if (currentUser && currentUser.id === id) {
      startEditing(entry);
      return;
    }
    modalPin('본인 확인', '등록 시 설정한 개인 PIN을 입력하세요.').then(function (pin) {
      if (!pin) return;
      verifyPin(pin, entry).then(function (ok) {
        if (!ok) return modalNotice('오류', 'PIN이 올바르지 않아요.');
        maybeUpgradePin(entry, pin);
        startEditing(entry);
      });
    });
  }

  function startEditing(entry) {
    editingEntryId = entry.id;
    exampleTipDismissed = false; /* 수정 모드에서도 예시 카드 표시 */
    photoDataUrls = [];
    formPhotosReady = false;
    /* 원본 사진(고화질)을 photos/{id}에서 불러와 편집기에 채움 */
    loadPhotos(entry).then(function (arr) {
      photoDataUrls = (arr || []).slice();
      formPhotosReady = true;
      renderPhotoThumbs();
    });
    activeTab = 'form';
    paint(currentState);
    setTimeout(function () {
      var form = document.getElementById('entry-form');
      if (!form) return;
      var setVal = function (name, val) { var el = form.querySelector('[name="' + name + '"]'); if (el) el.value = val || ''; };
      setVal('nickname', entry.nickname);
      setVal('realName', '');
      setVal('contact', '');
      var genderRadio = form.querySelector('[name="gender"][value="' + entry.gender + '"]');
      if (genderRadio) genderRadio.checked = true;
      setVal('birthYear', entry.birthYear);
      setVal('region', entry.region);
      setVal('workplace', entry.workplace);
      setVal('referrerText', '');
      var degRadio = form.querySelector('[name="degreeChoice"][value="' + (entry.degreeChoice || '') + '"]');
      if (degRadio) degRadio.checked = true;
      setVal('height', entry.height || '');
      setVal('intro', entry.intro || '');
      setVal('idealType', entry.idealType || '');
      setVal('dealbreaker', entry.dealbreaker || '');
      var blurCheck = form.querySelector('#f-blur');
      if (blurCheck) blurCheck.checked = !!entry.blurPhoto;
      renderPhotoThumbs();
    }, 50);
  }

  function handleCancelRequest(toId) {
    var state = currentState;
    requireLogin().then(function (myEntry) {
      if (!myEntry) return;
      var req = (state.dateRequests || []).find(function (rq) {
        return rq.fromId === myEntry.id && rq.toId === toId && reqStatus(rq) === 'pending';
      });
      if (!req) return modalNotice('안내', '취소할 수 있는 요청이 없어요.');
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var newRequests = (s.dateRequests || []).filter(function (rq) { return rq.id !== req.id; });
          tx.update(stateRef, { dateRequests: newRequests });
        });
      }).then(function () {
        modalNotice('완료', '요청이 취소되었어요.');
      }).catch(function (err) {
        modalNotice('오류', '취소에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleDelete(id) {
    var state = currentState;
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    function doDelete() {
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var newEntries = (s.entries || []).filter(function (e) { return e.id !== id; });
          var newRequests = (s.dateRequests || []).filter(function (r) { return r.toId !== id; });
          tx.update(stateRef, { entries: newEntries, dateRequests: newRequests });
        });
      }).then(function () {
        photosRef.doc(id).delete().catch(function () {});
        delete photoCache[id];
        modalNotice('완료', '명단에서 삭제되었어요.');
      }).catch(function (err) {
        modalNotice('오류', '삭제에 실패했어요: ' + (err.message || err));
      });
    }
    if (isAdminUnlocked) {
      modalConfirm('삭제', escapeHtml(entry.nickname) + '님을 명단에서 삭제할까요?').then(function (ok) {
        if (!ok) return;
        doDelete();
      });
      return;
    }
    modalPin('본인 확인', '등록 시 설정한 개인 PIN을 입력하세요.').then(function (pin) {
      if (!pin) return;
      verifyPin(pin, entry).then(function (ok) {
        if (!ok) return modalNotice('오류', 'PIN이 올바르지 않아요.');
        maybeUpgradePin(entry, pin);
        doDelete();
      }).catch(function (err) {
        modalNotice('오류', 'PIN 확인 중 오류가 발생했어요.');
      });
    });
  }

  function handleRequest(toId, type) {
    var state = currentState;
    if (!state.adminAuth) { modalNotice('안내', '관리자 설정이 아직 완료되지 않았어요.'); return; }
    var target = state.entries.find(function (e) { return e.id === toId; });
    if (!target) return;
    var isPhoto = type === 'photo';
    var typeLabel = isPhoto ? '사진 보기' : '번호 보기';
    requireLogin().then(function (fromEntry) {
      if (!fromEntry) return;
      if (fromEntry.id === toId) return modalNotice('안내', '본인에게는 요청할 수 없어요.');
      var existingReq = (state.dateRequests || []).find(function (req) {
        return req.fromId === fromEntry.id && req.toId === toId && (req.type || 'contact') === type &&
          (req.hiddenBy || []).indexOf(fromEntry.id) < 0;
      });
      if (existingReq) {
        var st = reqStatus(existingReq);
        if (st === 'rejected') return modalNotice('안내', escapeHtml(target.nickname) + '님이 이 요청을 거절했어요.');
        return modalNotice('안내', '이미 ' + escapeHtml(target.nickname) + '님에게 ' + typeLabel + ' 요청을 보냈어요. "신청 현황" 탭에서 확인할 수 있어요.');
      }
      var icon = isPhoto ? '📷' : '📱';
      var noteOverlay = openModal(
        '<h3>' + icon + ' ' + escapeHtml(target.nickname) + '님 ' + typeLabel + ' 요청</h3>' +
        '<p class="modal-msg">상대방이 승인하면 확인할 수 있어요.</p>' +
        '<textarea class="modal-input" id="modal-note" rows="3" maxlength="200" placeholder="한 마디 남기기 (선택)"></textarea>' +
        '<div class="modal-actions">' +
          '<button type="button" class="card-btn" id="modal-cancel">취소</button>' +
          '<button type="button" class="card-btn primary" id="modal-ok">요청하기</button>' +
        '</div>'
      );
      new Promise(function (resolve) {
        function finish(val) { closeModal(noteOverlay); resolve(val); }
        noteOverlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });
        noteOverlay.querySelector('#modal-ok').addEventListener('click', function () {
          finish(noteOverlay.querySelector('#modal-note').value.trim());
        });
        noteOverlay.addEventListener('click', function (e) { if (e.target === noteOverlay) finish(null); });
      }).then(function (note) {
        if (note === null || note === undefined) return;
        /* 번호 요청이면 내 번호를 함께 담아둔다 (상대가 승인하면 서로 공개) */
        var contactPromise = isPhoto ? Promise.resolve(null) : ensureMyContact();
        return contactPromise.then(function (myNum) {
          if (!isPhoto && !myNum) return;
          var req = {
            id: genId(), type: type, fromId: fromEntry.id, toId: toId,
            note: note || '', submittedAt: new Date().toISOString()
          };
          if (myNum) req.fromContact = myNum;
          return stateRef.update({
            dateRequests: firebase.firestore.FieldValue.arrayUnion(req)
          }).then(function () {
            appendLog('request', fromEntry.nickname, typeLabel + ' 요청 → ' + target.nickname);
            notifyAdmin(typeLabel + ' 요청', fromEntry.nickname + '님이 ' + target.nickname + '님의 ' + typeLabel + '를 요청했어요!');
            return refreshNow();
          }).then(function () {
            modalNotice('요청 완료', escapeHtml(target.nickname) + '님에게 ' + typeLabel + ' 요청을 보냈어요!<br>"신청 현황" 탭에서 상태를 볼 수 있어요.');
          });
        });
      }).catch(function (err) {
        modalNotice('오류', '요청에 실패했어요: ' + (err.message || err));
      });
    });
  }

  function handleApprove(id) {
    var pend = ((currentState && currentState.pendingEntries) || []).find(function (e) { return e.id === id; });
    var nick = pend ? pend.nickname : '';
    db.runTransaction(function (tx) {
      return tx.get(stateRef).then(function (doc) {
        var state = doc.data();
        var idx = (state.pendingEntries || []).findIndex(function (e) { return e.id === id; });
        if (idx < 0) return;
        var entry = state.pendingEntries.splice(idx, 1)[0];
        if (!entry.serial) entry.serial = nextSerial(state);
        var newEntries = (state.entries || []).concat([entry]);
        tx.update(stateRef, { pendingEntries: state.pendingEntries, entries: newEntries });
      });
    }).then(function () {
      appendLog('admin', '관리자', '신청 승인 · ' + nick);
      return refreshNow();
    }).catch(function (err) {
      modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));
    });
  }

  function handleReject(id) {
    var pend = ((currentState && currentState.pendingEntries) || []).find(function (e) { return e.id === id; });
    var nick = pend ? pend.nickname : '';
    db.runTransaction(function (tx) {
      return tx.get(stateRef).then(function (doc) {
        var state = doc.data();
        var newPending = (state.pendingEntries || []).filter(function (e) { return e.id !== id; });
        tx.update(stateRef, { pendingEntries: newPending });
      });
    }).then(function () {
      photosRef.doc(id).delete().catch(function () {});
      delete photoCache[id];
      appendLog('admin', '관리자', '신청 거절 · ' + nick);
      return refreshNow();
    }).catch(function (err) {
      modalNotice('오류', '거절에 실패했어요: ' + (err.message || err));
    });
  }

  function handleApproveRequest(id) {
    var state = currentState;
    var req = (state.dateRequests || []).find(function (r) { return r.id === id; });
    if (!req) return;
    var reqType = req.type || 'contact';
    modalMessage('요청 승인 (관리자)', '신청자에게 전달할 답장을 남길 수 있어요.', '승인', 'approve').then(function (replyMsg) {
      if (replyMsg === null) return;
      if (reqType === 'photo') {
        db.runTransaction(function (tx) {
          return tx.get(stateRef).then(function (doc) {
            var s = doc.data();
            var reqs = (s.dateRequests || []).map(function (r) {
              if (r.id === id) {
                var copy = JSON.parse(JSON.stringify(r));
                copy.approved = true; copy.held = false;
                if (replyMsg) copy.approveMessage = replyMsg;
                return copy;
              }
              return r;
            });
            tx.update(stateRef, { dateRequests: reqs });
          });
        }).then(function () {
          appendLog('admin', '관리자', '사진 요청 승인');
          return refreshNow();
        }).catch(function (err) {
          modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));
        });
        return;
      }
      var fromEntry = (state.entries || []).find(function (e) { return e.id === req.fromId; });
      var toEntry = (state.entries || []).find(function (e) { return e.id === req.toId; });
      var decryptPromises = [];
      if (fromEntry && fromEntry.contactEnc && adminPrivateKey) {
        decryptPromises.push(decryptWithAdmin(adminPrivateKey, fromEntry.contactEnc).catch(function () { return ''; }));
      } else { decryptPromises.push(Promise.resolve('')); }
      if (toEntry && toEntry.contactEnc && adminPrivateKey) {
        decryptPromises.push(decryptWithAdmin(adminPrivateKey, toEntry.contactEnc).catch(function () { return ''; }));
      } else { decryptPromises.push(Promise.resolve('')); }
      Promise.all(decryptPromises).then(function (contacts) {
        return db.runTransaction(function (tx) {
          return tx.get(stateRef).then(function (doc) {
            var s = doc.data();
            var reqs = (s.dateRequests || []).map(function (r) {
              if (r.id === id) {
                var copy = JSON.parse(JSON.stringify(r));
                copy.approved = true; copy.held = false;
                copy.revealedContact = { from: contacts[0], to: contacts[1] };
                if (replyMsg) copy.approveMessage = replyMsg;
                return copy;
              }
              return r;
            });
            tx.update(stateRef, { dateRequests: reqs });
          });
        });
      }).then(function () {
        appendLog('admin', '관리자', '번호 요청 승인');

  function handleReapplyRequest(id) {

    if (!me) return modalNotice('로그인 필요', '먼저 로그인해주세요.');
    var req = (state.dateRequests || []).find(function (r) { return r.id === id; });

    var st = reqStatus(req);
    if (st !== 'held' && st !== 'rejected') return;
    var isPhoto = (req.type || 'contact') === 'photo';
    var to = (state.entries || []).find(function (e) { return e.id === req.toId; });
    var toName = to ? to.nickname : '상대방';
    var feedback = st === 'held' ? (req.holdMessage || '') : (req.rejectMessage || '');
    var feedbackHtml = feedback
      ? '<div class="mine-note" style="background:var(--gold-soft);color:var(--ink);">' + escapeHtml(toName) + '님의 메시지<br>"' + escapeHtml(feedback) + '"</div>'

    var overlay = openModal(
      '<h3>다시 요청하기</h3>' +
      '<p class="modal-msg">' + escapeHtml(toName) + '님에게 ' + (isPhoto ? '사진' : '번호') + ' 요청을 다시 보내요. 상대가 궁금해한 정보를 담아주세요.</p>' +
      feedbackHtml +
      '<textarea class="modal-input" id="reapply-note" rows="3" maxlength="200" placeholder="예: 직장은 강남 ○○회사 다니고 있어요! 다시 요청드려요" style="margin-top:8px;">' + escapeHtml(reqNote(req) || '') + '</textarea>' +
      '<div class="modal-actions">' +
        '<button type="button" class="card-btn" id="modal-cancel">취소</button>' +
        '<button type="button" class="card-btn primary" id="modal-ok">다시 요청</button>' +
      '</div>'
    );
    new Promise(function (resolve) {
      function finish(v) { closeModal(overlay); resolve(v); }
      overlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });
      overlay.querySelector('#modal-ok').addEventListener('click', function () { finish(overlay.querySelector('#reapply-note').value.trim()); });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) finish(null); });

      return db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();

            if (r.id !== id) return r;

            delete c.held; delete c.holdMessage; delete c.heldBy;
            delete c.rejected; delete c.rejectMessage; delete c.rejectedBy;
            delete c.approved; delete c.userApproved; delete c.approveMessage;
            delete c.decidedAt; delete c.revealedContact; delete c.toContact;
            c.submittedAt = new Date().toISOString();
            c.reappliedAt = new Date().toISOString();
            return c;
          });
          tx.update(stateRef, { dateRequests: reqs });

  function openGallery(photos, startIdx) {
    var idx = startIdx || 0;
    var overlay = document.createElement('div');
    overlay.className = 'gallery-overlay';
    function render() {
      var html = '<img class="gallery-img" src="' + photos[idx] + '" alt="사진 ' + (idx + 1) + '">';
      if (photos.length > 1) {
        html += '<div class="gallery-counter">' + (idx + 1) + ' / ' + photos.length + '</div>';
        html += '<button class="gallery-nav gallery-nav--prev" id="gal-prev">&#8249;</button>';
        html += '<button class="gallery-nav gallery-nav--next" id="gal-next">&#8250;</button>';
      }
      html += '<button class="gallery-close" id="gal-close">&times;</button>';
      overlay.innerHTML = html;
    }
    render();
    document.body.appendChild(overlay);
    function closeGallery() {
      if (!overlay.parentNode) return;
      overlay.remove();
      popOverlay(overlay);
    }
    pushOverlay(overlay, closeGallery);
    overlay.addEventListener('click', function (e) {
      if (e.target.id === 'gal-prev') { idx = (idx - 1 + photos.length) % photos.length; render(); return; }
      if (e.target.id === 'gal-next') { idx = (idx + 1) % photos.length; render(); return; }
      if (e.target.id === 'gal-close' || e.target === overlay) { closeGallery(); return; }
    });
    overlay.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeGallery();
      if (e.key === 'ArrowLeft' && photos.length > 1) { idx = (idx - 1 + photos.length) % photos.length; render(); }
      if (e.key === 'ArrowRight' && photos.length > 1) { idx = (idx + 1) % photos.length; render(); }
    });
    overlay.setAttribute('tabindex', '0');
    overlay.focus();
  }

  function handleRevealContact(id) {

    if (!entry) return;
    requireLogin().then(function (myEntry) {
      if (!myEntry) return;
      var matchReqs = (state.dateRequests || []).filter(function (req) {
        return req.approved && (req.type || 'contact') === 'contact' && (req.fromId === id || req.toId === id);
      });
      var match = matchReqs.find(function (req) {
        return (req.fromId === myEntry.id && req.toId === id) || (req.toId === myEntry.id && req.fromId === id);
      });
      if (!match) return modalNotice('안내', '승인된 번호 요청이 없어요. "신청 현황" 탭에서 상태를 확인해보세요.');
      var otherIsRequester = match.fromId === id;
      var contact = match.revealedContact
        ? (otherIsRequester ? match.revealedContact.from : match.revealedContact.to)

  function handleAdminResetPin(id) {
    if (!isAdminUnlocked || !adminPrivateKey) return modalNotice('안내', '관리자 모드에서만 가능해요.');
    var entry = (currentState.entries || []).find(function (e) { return e.id === id; });

    modalNumericPinSetup('PIN 재설정', escapeHtml(entry.nickname) + '님에게 새로 부여할 PIN을 입력해주세요.').then(function (r) {
      if (!r) return;
      if (!/^[0-9]{4,8}$/.test(r.p1)) return modalNotice('입력 오류', 'PIN은 숫자 4~8자리예요.');
      if (r.p1 !== r.p2) return modalNotice('오류', 'PIN이 일치하지 않아요.');
      var contactP = entry.contactEnc ? decryptWithAdmin(adminPrivateKey, entry.contactEnc).catch(function () { return null; }) : Promise.resolve(null);
      contactP.then(function (contact) {
        return Promise.all([
          makePinAuth(r.p1),
          contact ? encryptForSelf(r.p1, contact) : Promise.resolve(null)
        ]).then(function (res) {
          return db.runTransaction(function (tx) {
            return tx.get(stateRef).then(function (doc) {
              var s = doc.data();
              var entries = (s.entries || []).map(function (e) {
                if (e.id !== id) return e;
                var c = JSON.parse(JSON.stringify(e));
                c.pinAuth = res[0];
                delete c.pinHash;
                delete c.pinEnc;
                if (res[1]) c.contactSelfEnc = res[1];
                return c;
              });
              tx.update(stateRef, { entries: entries });
            });
          });
        });
      }).then(function () {
        appendLog('admin', '관리자', 'PIN 재설정 · ' + entry.nickname);
        return refreshNow();
      }).then(function () {
        modalNotice('완료', entry.nickname + '님의 새 PIN은 ' + r.p1 + ' 입니다. 회원에게 알려주세요.');
      }).catch(function (err) {
        modalNotice('오류', '재설정에 실패했어요: ' + (err.message || err));
      });
    });

  }

  function resizeImage(file, maxW, maxH, quality, cb) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          var ratio = Math.min(maxW / w, maxH / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.body.addEventListener('change', function (e) {
    if (e.target.id === 'f-photo') {
      var files = e.target.files;
      if (!files || !files.length) return;
      var remaining = 3 - photoDataUrls.length;
      if (remaining <= 0) { modalNotice('안내', '사진은 최대 3장까지 추가할 수 있어요.'); e.target.value = ''; return; }
      var toRead = Math.min(files.length, remaining);
      for (var i = 0; i < toRead; i++) {
        (function (file) {
          resizeImage(file, FULL_MAX, FULL_MAX, FULL_Q, function (dataUrl) {
            photoDataUrls.push(dataUrl);
            renderPhotoThumbs();
          });
        })(files[i]);
      }
      if (files.length > remaining) {
        modalNotice('안내', '최대 3장까지만 추가됩니다. ' + (files.length - remaining) + '장은 무시되었어요.');

  /* ---- init ---- */
  function init() {
    var localState = readStateLocal();

    stateRef.get().then(function (doc) {
      if (doc.exists) {
        return doc.data();
      }
      return stateRef.set(localState).then(function () { return localState; });
    }).then(function (state) {
      currentState = state;
      if (!Array.isArray(state.entries)) state.entries = [];
      if (!Array.isArray(state.pendingEntries)) state.pendingEntries = [];
      if (!Array.isArray(state.dateRequests)) state.dateRequests = [];
      if (!Array.isArray(state.approvedPairs)) state.approvedPairs = [];
      if (!Array.isArray(state.logs)) state.logs = [];
      /* 기존 회원 고유번호 백필 (한 번만, 결정적이라 클라이언트 간 동일) */
      if (ensureSerials(state)) {
        stateRef.update({ entries: state.entries }).catch(function () {});
      }
      checkVersion(state);
      restoreSession(state);

      var adminPromise = Promise.resolve();
      try {
        var savedPin = sessionStorage.getItem('adminPin');
        if (savedPin && state.adminAuth) {
          adminPromise = unlockAdminKey(savedPin, state.adminAuth).then(function (key) {
            adminPrivateKey = key;
            isAdminUnlocked = true; requestNotifPermission();
          }).catch(function () {
            sessionStorage.removeItem('adminPin');
          });
        }
      } catch (e) {}

      return adminPromise.then(function () {
        return decryptAllAdminData(state);
      }).then(function () {
        paint(state);
      });
    }).catch(function (err) {
      document.getElementById('app').innerHTML =
        '<div style="text-align:center;padding:60px 20px;color:var(--muted);">' +
        '<p>데이터를 불러오는 중 오류가 발생했어요.</p>' +
        '<p style="font-size:0.8rem;">' + escapeHtml(err.message || err) + '</p>' +
        '</div>';
    });

    var prevPendingCount = -1;
    var prevRequestCount = -1;

    function requestNotifPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function showNotification(title, body) {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') {
        var n = new Notification(title, { body: body });
        n.onclick = function () { window.focus(); n.close(); };
      }
    }

    stateRef.onSnapshot(function (doc) {
      if (!doc.exists) return;
      var state = doc.data();
      if (!Array.isArray(state.pendingEntries)) state.pendingEntries = [];
      if (!Array.isArray(state.dateRequests)) state.dateRequests = [];
      if (!Array.isArray(state.approvedPairs)) state.approvedPairs = [];
      if (!Array.isArray(state.logs)) state.logs = [];
      if (!currentUser) restoreSession(state);
      checkVersion(state);

      if (prevPendingCount >= 0 && state.pendingEntries.length > prevPendingCount) {
        showNotification('새 접수!', '새로운 인연 신청서가 도착했어요. (' + state.pendingEntries.length + '건 대기중)');
      }
      if (prevRequestCount >= 0 && state.dateRequests.length > prevRequestCount) {
        showNotification('새 요청!', '새로운 사진/번호 요청이 도착했어요.');
      }
      prevPendingCount = state.pendingEntries.length;
      prevRequestCount = state.dateRequests.length;

      currentState = state;
      decryptAllAdminData(state).then(function () {
        /* 신청서 작성 중이면 화면을 다시 그리지 않음 (입력 내용 보존) */
        if (isEditingForm()) return;
        paint(state);
      });
    });
  }
